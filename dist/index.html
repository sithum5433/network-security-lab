 integrity. Do not assume this protection makes it universally more secure than RADIUS deployments. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8907.html\" target=\"_blank\" rel=\"noopener\">RFC 8907, particularly sections 4 and 10\u003c/a>.\u003c/p>","refs":[{"sourceId":"src24","from":15,"to":16}]},{"title":"RADIUS versus TACACS+: exam comparison","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Classic RADIUS\u003c/th>\u003cth>Classic TACACS+\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Transport/port\u003c/td>\u003ctd>UDP 1812 auth, 1813 accounting; application retries.\u003c/td>\u003ctd>TCP 49; reliable transport.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Confidentiality scope\u003c/td>\u003ctd>User-Password hidden; many attributes clear in classic transport.\u003c/td>\u003ctd>Packet body obfuscated; header clear.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AAA organisation\u003c/td>\u003ctd>Authentication outcome and authorization attributes commonly returned together; separate accounting.\u003c/td>\u003ctd>Independent authentication, authorization and accounting exchanges.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ecosystem\u003c/td>\u003ctd>Open RFCs, broad multi-vendor network-admission support.\u003c/td>\u003ctd>Cisco-origin, public informational specification and multiple implementations; verify platform support.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Traditional use\u003c/td>\u003ctd>Wi-Fi/802.1X, VPN and mass network admission.\u003c/td>\u003ctd>Infrastructure CLI authorization and audit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trade-off emphasized by course\u003c/td>\u003ctd>Lightweight high-volume admission ecosystem.\u003c/td>\u003ctd>Granular management control with more exchanges/connection state.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>For an exam recommendation, begin with the scenario: a university needs scalable Wi-Fi admission and vendor interoperability, so choose RADIUS. An operations team needs permission for individual configuration commands, so choose TACACS+. Protocol overhead alone does not prove that a deployment will fail; actual support, server capacity, latency, redundancy and policy integration determine scale.\u003c/p>","refs":[{"sourceId":"src24","from":11,"to":17}]},{"title":"Method lists: ordered availability fallback","html":"\u003cp>A method list specifies ordered AAA sources. In \u003ccode>aaa authentication login default group tacacs+ local\u003c/code>, try the TACACS+ server group first. If the group returns a definitive success, accept. If it returns a definitive denial, reject. Advance to \u003ccode>local\u003c/code> when the method returns ERROR/unavailability, such as all configured servers failing to respond.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>First result\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PASS\u003c/td>\u003ctd>Accept; stop.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FAIL / explicit reject\u003c/td>\u003ctd>Deny; stop; do not let fallback bypass policy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ERROR / no usable response\u003c/td>\u003ctd>Try the next configured method.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The ACL analogy is ordered evaluation with a decisive result stopping further processing. The exact rule differs: an ACL advances on nonmatch, while this method list advances on an error/unavailable method, not invalid credentials. \u003ca href=\"https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_usr_aaa/configuration/15-mt/sec-usr-aaa-15-mt-book/configuring_authentication.html\" target=\"_blank\" rel=\"noopener\">Cisco authentication guide\u003c/a>.\u003c/p>","refs":[{"sourceId":"src24","from":19,"to":20}]},{"title":"Step 1–2: enable AAA and prepare local access","html":"\u003cp>\u003ccode>aaa new-model\u003c/code> enables the IOS AAA framework. Prepare a known local emergency identity before relying on a remote server, and verify behaviour on the target IOS/Packet Tracer version.\u003c/p>\u003cpre>\u003ccode>aaa new-model\nusername admin privilege 15 secret StrongPass123\naaa authentication login default local\u003c/code>\u003c/pre>\u003cp>\u003ccode>username\u003c/code> creates a local identity with full privilege; \u003ccode>secret\u003c/code> stores a password verifier using the supported platform scheme. \u003ccode>aaa authentication login default local\u003c/code> makes the default login list use the local user database. Passwords in these templates are lecture placeholders; replace them. This configuration authenticates identities, while authorization and accounting require their own appropriate commands.\u003c/p>","refs":[{"sourceId":"src24","from":22,"to":23}]},{"title":"Step 3: TACACS+ with local fallback","html":"\u003cp>Lecture template with explicit submode exits for readability:\u003c/p>\u003cpre>\u003ccode>aaa new-model\nusername admin privilege 15 secret StrongPass123\ntacacs server TACACS-SERVER1\n address ipv4 192.168.1.100\n key MySharedKey\n exit\naaa authentication login default group tacacs+ local\naaa authorization exec default group tacacs+ local\naaa accounting exec default start-stop group tacacs+\u003c/code>\u003c/pre>\u003cul>\u003cli>The server object defines its address and shared secret; the server must use the matching secret and recognise the client device.\u003c/li>\u003cli>\u003ccode>authentication login\u003c/code> checks identity centrally, with local fallback on server-group ERROR.\u003c/li>\u003cli>\u003ccode>authorization exec\u003c/code> controls an EXEC session and its attributes; it is not a complete per-command policy.\u003c/li>\u003cli>\u003ccode>accounting exec ... start-stop\u003c/code> records EXEC session start and stop; it does not log every CLI command.\u003c/li>\u003c/ul>\u003cp>Per-command authorization/accounting needs separate platform-appropriate \u003ccode>aaa authorization commands\u003c/code> and \u003ccode>aaa accounting commands\u003c/code> configuration plus server policy. The lecture gives a conceptual template, not a complete production SSH/VTY, command-control or redundancy configuration.\u003c/p>","refs":[{"sourceId":"src24","from":24,"to":24}]},{"title":"Step 4: RADIUS with local fallback","html":"\u003cp>Lecture template:\u003c/p>\u003cpre>\u003ccode>aaa new-model\nusername admin privilege 15 secret StrongPass123\nradius server RADIUS-SERVER1\n address ipv4 192.168.1.200 auth-port 1812 acct-port 1813\n key MySharedKey\n exit\naaa authentication login default group radius local\u003c/code>\u003c/pre>\u003cp>The server definition supplies authentication/accounting ports and matching secret. \u003ccode>group radius local\u003c/code> gives the fallback order for this login example. It does not by itself configure Wi-Fi/802.1X, VPN admission or RADIUS accounting for every service. Those require the relevant authenticator, access-service policy and supported commands. Check version-specific support before a lab; the supplied lecture explicitly says its lab feasibility was still to be confirmed.\u003c/p>","refs":[{"sourceId":"src24","from":25,"to":27}]}],"quiz":[{"question":"For two branch routers and one administrator, what is the simplest justified starting point?","options":["A mandatory new server cluster","Local AAA with secure local accounts","Disable authentication","Use public Wi-Fi credentials for the CLI"],"answer":1,"explanation":"At very small scale local AAA avoids extra server cost and overhead; revisit as scale grows.","refs":[{"sourceId":"src24","from":5,"to":7}]},{"question":"Which scenario is device administration AAA?","options":["A student joins Wi-Fi","A remote worker opens a VPN","An engineer is permitted to run selected router CLI commands","A device receives an IP address"],"answer":2,"explanation":"The protected action is infrastructure management.","refs":[{"sourceId":"src24","from":9,"to":10}]},{"question":"Which pair identifies classic RADIUS?","options":["TCP 49","UDP 1812/1813","TCP 443 only","UDP 53"],"answer":1,"explanation":"1812 carries authentication/authorization and 1813 accounting.","refs":[{"sourceId":"src24","from":13,"to":13}]},{"question":"Why is TACACS+ traditionally selected for CLI administration?","options":["It eliminates all server failures","It requires no shared secret","It encrypts the IP header","It separates AAA and supports fine command control"],"answer":3,"explanation":"Independent authorization/accounting suit privileged infrastructure actions.","refs":[{"sourceId":"src24","from":15,"to":16}]},{"question":"A TACACS+ server returns invalid-password reject. What does group tacacs+ local do?","options":["Rejects the login","Always tries local","Accepts any local administrator","Disables AAA"],"answer":0,"explanation":"A definitive denial stops the list; fallback does not bypass a reachable server’s policy.","refs":[{"sourceId":"src24","from":19,"to":20}]},{"question":"All TACACS+ servers time out and local follows in the method list. What happens?","options":["Every login is automatically accepted","AAA tries the local database","The router clears its configuration","The server rejection overrides local"],"answer":1,"explanation":"No usable response/ERROR permits the next method.","refs":[{"sourceId":"src24","from":19,"to":20}]},{"question":"Which command enables IOS AAA?","options":["enable secret","service password-encryption","aaa new-model","ip routing"],"answer":2,"explanation":"AAA configuration depends on the AAA framework being enabled.","refs":[{"sourceId":"src24","from":22,"to":22}]},{"question":"What does aaa accounting exec default start-stop group tacacs+ primarily record?","options":["Every IP packet","Every command argument automatically","Only denied passwords","EXEC session start and stop"],"answer":3,"explanation":"EXEC accounting is session accounting, not per-command accounting.","refs":[{"sourceId":"src24","from":24,"to":24}]},{"question":"Which statement is technically precise about classic TACACS+ protection?","options":["Every network header is encrypted","The TACACS+ body is protected/obfuscated while its header remains clear","It is identical to TLS 1.3 AEAD","It requires no shared secret"],"answer":1,"explanation":"The lecture’s entire-packet wording must be read as body protection, with classic-protocol security limits.","refs":[{"sourceId":"src24","from":15,"to":17}]},{"question":"What is the danger of reversing the list to local group tacacs+?","options":["The local database is normally available and can reject, preventing the central method from being tried","It changes TCP 49 to UDP","It disables all usernames","It automatically synchronises local users to the server"],"answer":0,"explanation":"Order matters and a definitive local reject normally stops evaluation.","refs":[{"sourceId":"src24","from":19,"to":25}]}],"tutorialAnswers":[{"sourceId":"src25","question":"Q1. A small branch office with two routers is deciding between local and server-based AAA. Recommend which approach is more appropriate given this scale, and justify your answer using both cost and administrative overhead.   [LO3, LO4]","answerHtml":"\u003cp>Recommend local AAA for two routers if the branch has no wider central access-management requirement. It needs no new server/licence/maintenance infrastructure and managing a few local accounts is modest work. The trade-off is per-device updates and logs; if the network grows or enterprise policy demands central control, server-based AAA becomes more appropriate. Keep strong unique local credentials and review them.\u003c/p>","refs":[{"sourceId":"src25","from":8,"to":8},{"sourceId":"src24","from":5,"to":7}]},{"sourceId":"src25","question":"Q2. Explain the specific new risk that server-based AAA introduces that local AAA does not have, and explain what this risk means in practice if it is left unaddressed.   [LO4]","answerHtml":"\u003cp>Central AAA adds dependency on the server and the path to it. If unreachable and no fallback/redundancy exists, new logins cannot be authenticated centrally and administrators can be locked out during the outage. It also creates a high-value security target. Resilient servers and a tested, controlled local fallback reduce the availability risk.\u003c/p>","refs":[{"sourceId":"src25","from":9,"to":9},{"sourceId":"src24","from":6,"to":7}]},{"sourceId":"src25","question":"Q3. Explain the difference between device administration AAA and network access AAA in terms of what is actually being protected in each case.   [LO3]","answerHtml":"\u003cp>Device administration protects the infrastructure’s management interface: who logs in to a router/switch and which commands they may execute. Network access protects admission to connectivity: Wi-Fi, VPN and wired 802.1X sessions. The former can change the network; the latter decides whether a user/device may reach it.\u003c/p>","refs":[{"sourceId":"src25","from":11,"to":11},{"sourceId":"src24","from":9,"to":10}]},{"sourceId":"src25","question":"Q4. Explain why TACACS+'s design, full encryption and clean AAA separation, suits device administration specifically, while RADIUS's lighter, bundled design suits network access specifically. Use the actual stakes and scale of each scenario in your answer.   [LO4]","answerHtml":"\u003cp>TACACS+ separates AAA exchanges and supports command-level authorization/accounting, matching the high impact of infrastructure configuration. Its body protection covers more management attributes than classic RADIUS password hiding. RADIUS is deeply integrated with network admission and returns admission outcomes plus policy attributes efficiently across mixed equipment, suiting many concurrent Wi-Fi/VPN sessions. Use-case support and implementation capacity matter; neither is universally superior, and neither classic transport should be treated as modern authenticated encryption.\u003c/p>","refs":[{"sourceId":"src25","from":12,"to":12},{"sourceId":"src24","from":11,"to":17}]},{"sourceId":"src25","question":"Q5. Compare RADIUS and TACACS+ specifically on what portion of the packet each encrypts, and explain the practical security consequence of that difference.   [LO4]","answerHtml":"\u003cp>Classic RADIUS hides the User-Password field, while many other attributes can be observed on its transport path; credential details also depend on the authentication method. TACACS+ protects/obfuscates its packet body, so management data gets broader confidentiality coverage, but its header is clear. The lecture’s “entire packet” phrasing is shorthand, and classic TACACS+ protection has integrity/confidentiality limitations; secure the management path.\u003c/p>","refs":[{"sourceId":"src25","from":14,"to":14},{"sourceId":"src24","from":13,"to":17}]},{"sourceId":"src25","question":"Q6. A university needs to authenticate thousands of students and staff connecting to its WiFi network simultaneously throughout the day. Recommend RADIUS or TACACS+ for this scenario, and justify your recommendation using at least two specific characteristics of the protocol you chose.   [LO3, LO4]","answerHtml":"\u003cp>Recommend RADIUS: it is broadly supported by wireless/802.1X authenticators and servers, and its multi-vendor admission ecosystem suits a university campus. Central policy and accounting support thousands of changing user sessions with appropriately sized redundant infrastructure. Its UDP-based request/response design includes application retries; use secure authentication methods and supported protected transport.\u003c/p>","refs":[{"sourceId":"src25","from":15,"to":15},{"sourceId":"src24","from":13,"to":14}]},{"sourceId":"src25","question":"Q7. An administrator argues that TACACS+ should be used for everything, including WiFi authentication, since it is more secure than RADIUS. Evaluate this argument, and explain what would actually go wrong if TACACS+ were deployed for a large-scale WiFi network.   [LO2, LO4]","answerHtml":"\u003cp>Reject the blanket claim. TACACS+ is primarily suited to command-oriented device administration; Wi-Fi/802.1X products and admission policy normally integrate with RADIUS. Forcing TACACS+ may lack supported admission integration and impose unnecessary connection/exchange state without adding relevant per-command benefits. Do not claim inevitable overload from the protocol name alone: actual capacity is implementation-dependent. Choose RADIUS for the campus access workflow and TACACS+ where fine management control is required.\u003c/p>","refs":[{"sourceId":"src25","from":16,"to":16},{"sourceId":"src24","from":11,"to":17}]},{"sourceId":"src25","question":"Q8. Explain why RADIUS being an open, multi-vendor standard matters practically in a network that includes equipment from multiple manufacturers, not just Cisco.   [LO4]","answerHtml":"\u003cp>A common public protocol lets switches, APs, VPN gateways and AAA servers from different manufacturers exchange supported access requests/policy attributes without a separate proprietary authentication island per vendor. That reduces integration and administration burden. Confirm compatible EAP methods, attributes and features rather than assuming every vendor implements every extension identically.\u003c/p>","refs":[{"sourceId":"src25","from":17,"to":17},{"sourceId":"src24","from":13,"to":14}]},{"sourceId":"src25","question":"Q9. Explain what an AAA method list actually does, and explain the specific problem it solves that would otherwise exist in a purely server-based AAA deployment.   [LO3, LO4]","answerHtml":"\u003cp>A method list orders possible AAA sources, such as TACACS+ then local. Try the first method and stop on accept or explicit deny; continue on ERROR/unavailability. It addresses the availability gap of a purely central deployment by retaining a working local route when all central servers are unreachable, while preserving denials from a reachable server.\u003c/p>","refs":[{"sourceId":"src25","from":19,"to":19},{"sourceId":"src24","from":19,"to":20}]},{"sourceId":"src25","question":"Q10. Explain the connection between how an AAA method list is processed and how an ACL from Week 7 is processed. What do they have in common?   [LO4]","answerHtml":"\u003cp>Both are processed in a defined order and stop when a decisive outcome is obtained, so later entries may never run. The conditions differ: an ACL continues when an entry does not match; the shown IOS AAA list continues when a method errors/is unavailable. A reject is a result, so it stops rather than falling through to weaker authentication.\u003c/p>","refs":[{"sourceId":"src25","from":20,"to":20},{"sourceId":"src24","from":19,"to":20}]},{"sourceId":"src25","question":"Q11. List the correct order of commands needed to configure TACACS+ server-based authentication with a local fallback on a Cisco device, and briefly explain what each command actually does.   [LO1, LO5]","answerHtml":"\u003cp>Enable AAA, create the local fallback identity, define the TACACS+ address and shared secret, then apply the ordered login list:\u003c/p>\u003cpre>\u003ccode>aaa new-model\nusername admin privilege 15 secret StrongPass123\ntacacs server TACACS-SERVER1\n address ipv4 192.168.1.100\n key MySharedKey\n exit\naaa authentication login default group tacacs+ local\u003c/code>\u003c/pre>\u003cp>The first enables AAA, the second supplies local credentials, the server object identifies the central endpoint/shared secret, and the last tries that group before local on errors. Add authorization/accounting for the requirements, for example the lecture’s \u003ccode>aaa authorization exec default group tacacs+ local\u003c/code> and \u003ccode>aaa accounting exec default start-stop group tacacs+\u003c/code>. These EXEC commands alone do not implement every-command control. Replace placeholder secrets and verify platform/line behaviour.\u003c/p>","refs":[{"sourceId":"src25","from":22,"to":22},{"sourceId":"src24","from":22,"to":24}]},{"sourceId":"src25","question":"Q12. In the command aaa authentication login default group tacacs+ local, identify which part of this command defines the method list's fallback order, and explain what would happen if the order were written the other way around.   [LO5]","answerHtml":"\u003cp>\u003ccode>group tacacs+ local\u003c/code> is the ordered method sequence. TACACS+ is primary; local is reached for central ERROR/unavailability. With \u003ccode>local group tacacs+\u003c/code>, local is primary and, because the local method normally gives accept/reject rather than unavailable, a missing or wrong local account can be rejected without consulting TACACS+. Do not read the order as “try every database until a password works.”\u003c/p>","refs":[{"sourceId":"src25","from":23,"to":23},{"sourceId":"src24","from":19,"to":25}]},{"sourceId":"src25","question":"Q13. Explain what the aaa new-model command actually does, and explain why every other AAA configuration command in this week's material depends on it being entered first.   [LO5]","answerHtml":"\u003cp>\u003ccode>aaa new-model\u003c/code> turns on the IOS AAA framework and makes its method lists and authorization/accounting configuration available. The subsequent AAA commands select how the enabled framework performs each function. It is a prerequisite rather than a server definition, user account or complete security policy by itself.\u003c/p>","refs":[{"sourceId":"src25","from":24,"to":24},{"sourceId":"src24","from":22,"to":25}]}]},"m15":{"id":"m15","title":"Cryptography fundamentals: ciphers, keys and hybrid protocols","sections":[{"title":"Vocabulary and security services","html":"\u003cp>Protect data over untrusted networks where intermediaries may read, copy or modify traffic. \u003cstrong>Plaintext\u003c/strong> is the original readable information; a \u003cstrong>cipher\u003c/strong> is the algorithm; a \u003cstrong>key\u003c/strong> controls its operation; \u003cstrong>encryption\u003c/strong> produces ciphertext and \u003cstrong>decryption\u003c/strong> recovers plaintext. \u003cstrong>Cryptanalysis\u003c/strong> studies recovering secrets or otherwise breaking the system without the intended key.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Service\u003c/th>\u003cth>Question\u003c/th>\u003cth>Typical tool\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>Can others read it?\u003c/td>\u003ctd>Encryption.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>Was it changed?\u003c/td>\u003ctd>Authenticated encryption/MAC; a hash only with protected reference.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authentication\u003c/td>\u003ctd>Who is the peer/origin?\u003c/td>\u003ctd>MAC among key holders; signatures plus trusted key identity/certificates.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Non-repudiation\u003c/td>\u003ctd>Can the signer credibly deny it?\u003c/td>\u003ctd>Digital signatures with key-custody and identity assumptions.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Encryption by itself addresses confidentiality. Select a secure authenticated construction when tampering matters; symmetric keys shared by two parties do not identify one unique signer to an independent verifier. Applications include VPN, AAA credential protection and routing authentication.\u003c/p>","refs":[{"sourceId":"src28","from":5,"to":7}]},{"title":"Kerckhoffs and classical design lessons","html":"\u003cp>Kerckhoffs’s principle: a cryptosystem should remain secure when its design is public and only the key is secret. Public algorithms can receive extensive scrutiny; secret algorithms may leak or hide weaknesses. Use established algorithms and protect keys. AES came from an open selection process; obscurity does not replace analysis.\u003c/p>\u003cp>\u003cstrong>Substitution\u003c/strong> changes symbol identities while keeping positions. \u003cstrong>Transposition\u003c/strong> rearranges positions without changing identities. Caesar and Vigenère are substitution systems; writing rows and reading columns illustrates transposition. These classical systems are teaching tools and are insecure for real communication.\u003c/p>\u003cp>\u003cstrong>Confusion\u003c/strong> complicates the key–ciphertext relationship, often through substitution. \u003cstrong>Diffusion\u003c/strong> spreads each input’s influence, through mixing/permutation. Modern repeated rounds combine these ideas; the avalanche effect means one small input change alters roughly half the output bits. Large key spaces resist brute force; ciphertext must avoid useful plaintext patterns.\u003c/p>","refs":[{"sourceId":"src28","from":8,"to":15}]},{"title":"Classical worked examples and attacks","html":"\u003ch4>Caesar\u003c/h4>\u003cp>Use A=0 through Z=25 and C=(P+k) mod 26. With k=3, HELLO becomes KHOOR; decrypt by subtracting 3. There are only 25 nontrivial shifts, so an attacker can try all keys; letter frequencies also reveal structure.\u003c/p>\u003cp>Tutorial k=5:\u003c/p>\u003cpre>\u003ccode>N → S   E → J   T → Y   W → B   O → T   R → W   K → P\nNETWORK → SJYBTWP\u003c/code>\u003c/pre>\u003ch4>Vigenère\u003c/h4>\u003cp>Repeat the key and add each letter’s value modulo 26:\u003c/p>\u003cpre>\u003ccode>Plaintext:  ATTACKATDAWN\nKey:        LEMONLEMONLE\nCiphertext: LXFOPVEFRNHR\u003c/code>\u003c/pre>\u003cp>The same plaintext A maps to different ciphertext letters at different key positions, weakening simple whole-message frequency counts. But the key repeats: Kasiski examination uses repeated fragments to infer key length, then separates ciphertext into columns, each essentially a Caesar cipher. Repetition and statistical leakage, plus limited keys, make it breakable. A repeating-key “keystream” is a conceptual bridge, not a secure modern stream construction.\u003c/p>","refs":[{"sourceId":"src28","from":11,"to":15}]},{"title":"Symmetric encryption and key distribution","html":"\u003cp>Both endpoints hold a shared secret key used for encryption/decryption. Examples: AES, ChaCha20 and historical DES, 3DES, RC4. Symmetric encryption is fast, suits bulk traffic and benefits from hardware such as AES-NI. It is used in TLS, VPN, disks, databases and Wi-Fi security suites.\u003c/p>\u003cp>Two distinct problems: \u003cstrong>delivery\u003c/strong>—establish the first secret without revealing it over the hostile channel; \u003cstrong>scale\u003c/strong>—with a distinct secret for each pair of n users, keys=n(n−1)/2.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Users\u003c/th>\u003cth>Pairwise keys\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>45\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100\u003c/td>\u003ctd>4,950\u003c/td>\u003c/tr>\u003ctr>\u003ctd>200\u003c/td>\u003ctd>200×199/2 = 19,900\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1,000\u003c/td>\u003ctd>499,500\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The pairwise formula assumes every pair needs its own independent key; it is not the key count for every real protocol. Anyone holding a shared key can create protected messages, so it gives no signer-specific non-repudiation. Exposure affects data under that key; rekeying, ephemeral exchanges and forward secrecy can limit the scope rather than one key necessarily exposing every past connection.\u003c/p>","refs":[{"sourceId":"src28","from":17,"to":19}]},{"title":"Block ciphers and modes of operation","html":"\u003cp>A block cipher transforms a fixed-size block under a key; a mode defines protection of arbitrary-length data. DES/3DES have 64-bit blocks; AES has 128-bit blocks. Padding is needed in modes such as CBC for incomplete final blocks, but not CTR/GCM. Repeated internal substitution and mixing provide confusion/diffusion.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Properties and failure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ECB\u003c/td>\u003ctd>Encrypt each block independently with the same key.\u003c/td>\u003ctd>Equal plaintext blocks yield equal ciphertext blocks; the slide’s encrypted penguin remains recognisable. Avoid for structured multi-block messages.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CBC\u003c/td>\u003ctd>XOR plaintext block with previous ciphertext, then encrypt; first block uses an unpredictable IV.\u003c/td>\u003ctd>Hides repeated patterns; sequential encryption, padding, error propagation and padding-oracle risk if unauthenticated/incorrectly handled. Needs integrity protection.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CTR\u003c/td>\u003ctd>Encrypt unique counter inputs, then XOR their output with plaintext.\u003c/td>\u003ctd>Stream-like, no padding, parallel/random access. Reused counter/nonce under one key repeats keystream. No authentication alone.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GCM\u003c/td>\u003ctd>Counter-style encryption plus authentication tag, including optional associated data.\u003c/td>\u003ctd>AEAD: confidentiality and integrity/authentication together; fast and parallel. Nonce reuse under one key can destroy confidentiality and integrity.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>For CBC a corrupted ciphertext block garbles the corresponding decrypted block and changes a bit in the next block. For CTR/stream encryption a corrupted ciphertext bit flips its plaintext bit; authenticated schemes must reject failed tags rather than deliver corrupted data. IV/nonce rules depend on the mode: not all IVs merely require uniqueness, and nonces need not be secret.\u003c/p>","refs":[{"sourceId":"src28","from":21,"to":24}]},{"title":"Block algorithms, sizes and uses","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>Block\u003c/th>\u003cth>Key/security\u003c/th>\u003cth>Course status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DES\u003c/td>\u003ctd>64 bits\u003c/td>\u003ctd>56-bit key.\u003c/td>\u003ctd>Broken/retired; brute-force demonstration in 1998.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3DES\u003c/td>\u003ctd>64 bits\u003c/td>\u003ctd>Up to 168 nominal key bits; roughly 112-bit security for three-key construction.\u003c/td>\u003ctd>Historical/deprecated; slow and small-block birthday risks such as Sweet32.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AES\u003c/td>\u003ctd>128 bits\u003c/td>\u003ctd>128/192/256-bit keys.\u003c/td>\u003ctd>Modern block-cipher standard (Rijndael, FIPS 197, 2001).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>AES is extensively studied and fast with hardware support. Mode flexibility suits sector storage (AES-XTS), files/databases and authenticated network traffic (AES-GCM in TLS and ESP). Limits arise from wrong modes, padding handling and nonce/IV mistakes; without hardware some stream constructions are faster. Padding/whole-block overhead belongs to particular modes, not every AES construction. AES-XTS is designed for storage confidentiality and does not itself supply general message authentication.\u003c/p>","refs":[{"sourceId":"src28","from":25,"to":26}]},{"title":"Stream ciphers and the one-time pad","html":"\u003cp>A stream cipher derives a pseudorandom keystream from a secret key and a nonce, then XORs it with plaintext. XORing ciphertext with the same keystream decrypts: C=P XOR S and P=C XOR S. This is low-latency, handles variable lengths without padding and can be efficient on constrained hardware.\u003c/p>\u003cp>The ideal one-time pad uses a truly random secret as long as the message, securely shared and never reused; under these assumptions it provides perfect secrecy. A practical stream cipher expands a short key computationally and does not inherit unconditional perfect secrecy.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>Key\u003c/th>\u003cth>Status/use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RC4\u003c/td>\u003ctd>Historically 40–2048 bits.\u003c/td>\u003ctd>Broken biases; WEP, early WPA/TKIP and old TLS. Prohibited in TLS; historical only.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ChaCha20\u003c/td>\u003ctd>256 bits.\u003c/td>\u003ctd>Modern software-friendly stream cipher; combine with Poly1305 for authenticated protection. Used in TLS, SSH and WireGuard constructions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A5/1\u003c/td>\u003ctd>64 bits.\u003c/td>\u003ctd>Historical GSM/2G; practical attacks. Not a modern secure recommendation.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Plain stream encryption provides no integrity: attackers can flip targeted bits. Use authenticated constructions, unique nonces and proper protocol sequencing. A stream transmission error affects the corresponding bit; an AEAD tag catches corruption and the record is rejected.\u003c/p>","refs":[{"sourceId":"src28","from":27,"to":30}]},{"title":"Keystream reuse and WEP: worked reasoning","html":"\u003cp>If C1=P1 XOR S and C2=P2 XOR S, then:\u003c/p>\u003cpre>\u003ccode>C1 XOR C2 = P1 XOR S XOR P2 XOR S\n          = P1 XOR P2\nIf P1 is known: S = C1 XOR P1, then P2 = C2 XOR S.\u003c/code>\u003c/pre>\u003cp>Ciphertext XOR exposes the plaintext relationship; known/guessable protocol fields can recover content. It does not automatically reveal two arbitrary unknown plaintexts without additional information, but confidentiality has catastrophically weakened.\u003c/p>\u003cp>WEP used RC4 and a clear 24-bit IV, only 2^24=16,777,216 possible values. Birthday collisions become likely after only thousands of packets, long before exhausting all values, repeating key/IV-derived keystreams. WEP also combined IV and key poorly, enabling key-recovery attacks. Secure components still need sound constructions, sufficiently large nonces and uniqueness guarantees. Never deploy WEP.\u003c/p>","refs":[{"sourceId":"src28","from":29,"to":30}]},{"title":"Block versus stream: choose the construction","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Block\u003c/th>\u003cth>Stream\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Native processing\u003c/td>\u003ctd>Fixed blocks.\u003c/td>\u003ctd>Keystream XOR with bits/bytes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Padding\u003c/td>\u003ctd>Mode-dependent: CBC yes; CTR/GCM no.\u003c/td>\u003ctd>No.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Performance\u003c/td>\u003ctd>AES very fast with acceleration; mode affects latency/parallelism.\u003c/td>\u003ctd>ChaCha20 efficient in software, useful on low-end/mobile hardware.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error\u003c/td>\u003ctd>Mode-dependent; CBC propagates to two decrypted blocks.\u003c/td>\u003ctd>Matching bit flip; authenticated records reject corruption.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Common misuse\u003c/td>\u003ctd>Pattern-leaking modes, IV/padding mistakes.\u003c/td>\u003ctd>Keystream reuse and missing authentication.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cul>\u003cli>\u003cstrong>Laptop disk:\u003c/strong> AES-XTS supports fixed sectors/random access and hardware acceleration; storage integrity needs separate consideration.\u003c/li>\u003cli>\u003cstrong>Live voice:\u003c/strong> stream-like AES-CTR or an appropriate authenticated real-time construction; small packets, no padding and latency matter.\u003c/li>\u003cli>\u003cstrong>TLS:\u003c/strong> AES-GCM with AES hardware, or ChaCha20-Poly1305 for efficient software. Both provide authenticated protection.\u003c/li>\u003c/ul>\u003cp>CTR/GCM demonstrate that a block primitive can form a stream-like construction; choose the complete mode/protocol rather than relying on the family label.\u003c/p>","refs":[{"sourceId":"src28","from":31,"to":32}]},{"title":"Public-key concepts and RSA","html":"\u003cp>A key pair has a public value that can be distributed and a private value retained by its owner. For an appropriate public-key encryption scheme, encrypt a small value to the recipient’s public key and decrypt with its private key. For a signature scheme, sign with the signer’s private key and verify with its public key. The values are mathematically related, but recovering a properly generated private key from its public value should be computationally infeasible. These are distinct, scheme-defined operations; not every public-key algorithm supports both.\u003c/p>\u003cp>RSA is associated with the difficulty of factoring a large modulus made from primes. The course lists 2048-bit keys as its baseline and 3072-bit RSA for roughly 128-bit strength. RSA encryption uses a secure scheme such as OAEP and is limited to short inputs; RSA signatures use dedicated schemes such as PSS. It is much slower and produces larger values than bulk symmetric encryption. Never encrypt VPN traffic by repeatedly applying raw RSA. Protect public-key identity as well as the private key.\u003c/p>\u003cp>\u003cstrong>Precision:\u003c/strong> signatures are not generic “encryption with a private key”; RFC 8017 defines encryption and signature schemes separately, with their own encoding and verification. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8017.html\" target=\"_blank\" rel=\"noopener\">RSA specification\u003c/a>.\u003c/p>","refs":[{"sourceId":"src28","from":34,"to":35}]},{"title":"Diffie-Hellman, the diagram and forward secrecy","html":"\u003cp>DH agrees a secret over a public channel; it does not encrypt the message. Public parameters p and g are known. Alice chooses private a and sends A=g^a mod p; Bob chooses b and sends B=g^b mod p. Alice computes B^a mod p and Bob A^b mod p; both equal g^(ab) mod p.\u003c/p>\u003ch4>Numbers from the lecture diagram (toy values only)\u003c/h4>\u003cpre>\u003ccode>p = 13, g = 6\nAlice private a = 5; A = 6^5 mod 13 = 7776 mod 13 = 2\nBob private   b = 4; B = 6^4 mod 13 = 1296 mod 13 = 9\nAlice: B^a mod 13 = 9^5 mod 13 = 59049 mod 13 = 3\nBob:   A^b mod 13 = 2^4 mod 13 = 16 mod 13 = 3\u003c/code>\u003c/pre>\u003cp>The other slide diagram uses paint: agree a public colour, mix a private colour, exchange mixtures and add the private colour again to reach the same final mixture. It illustrates combining public and private material, not literal security from paint.\u003c/p>\u003cp>For real parameters, recovering the secret from public values is intended to be infeasible; tiny teaching numbers provide no security. Fresh ephemeral secrets (DHE/ECDHE) and deletion of them support forward secrecy: later theft of a long-term authentication key does not reveal earlier session keys. Unauthenticated DH is vulnerable to MITM, who establishes a separate secret with each side. Bind the exchange to authenticated identities using signatures/certificates or an appropriate authenticated protocol.\u003c/p>","refs":[{"sourceId":"src28","from":36,"to":37}]},{"title":"ECC and asymmetric comparison","html":"\u003cp>ECC uses elliptic-curve discrete-logarithm problems for key agreement/signatures. Roughly 256-bit ECC gives the course’s 128-bit security comparison to 3072-bit RSA/finite-field DH. Smaller public keys and signatures make suitable curves/schemes attractive for sensors, smart cards, mobile and IoT. ECDH is key agreement; ECDSA is a signature scheme. P-256 supports these families; Curve25519/X25519 is a distinct agreement choice and should not be conflated with ECDSA.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>RSA\u003c/th>\u003cth>Finite-field DH\u003c/th>\u003cth>ECC family\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Typical task\u003c/td>\u003ctd>Short-value encryption/key transport or signatures.\u003c/td>\u003ctd>Key agreement.\u003c/td>\u003ctd>ECDH/ECDHE agreement; ECDSA/EdDSA signatures.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Underlying problem\u003c/td>\u003ctd>RSA/factoring-related.\u003c/td>\u003ctd>Finite-field discrete logarithm.\u003c/td>\u003ctd>Elliptic-curve discrete logarithm.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>~128-bit comparison\u003c/td>\u003ctd>3072-bit RSA.\u003c/td>\u003ctd>3072-bit field.\u003c/td>\u003ctd>~256-bit curve.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Forward secrecy\u003c/td>\u003ctd>Not from static RSA key transport.\u003c/td>\u003ctd>When ephemeral and correctly used.\u003c/td>\u003ctd>When ephemeral agreement is correctly used.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Public-key techniques ease initial secret establishment and support signatures, with roughly one key pair per participant rather than a full pairwise secret mesh. Their disadvantages are computation, larger outputs and the need to authenticate the public key. RSA, conventional DH and ECC face a sufficiently capable quantum-computing threat; the lecture flags post-quantum replacements as separate developing technology.\u003c/p>","refs":[{"sourceId":"src28","from":38,"to":40}]},{"title":"Hybrid encryption: TLS, IPsec and SSH","html":"\u003cp>Symmetric encryption is fast but cannot distribute its own first secret. Public-key cryptography helps establish/authenticate secrets but is inefficient for bulk data. Hybrid protocols combine them and derive fresh traffic keys for a connection; rekeying can occur later too.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Protocol\u003c/th>\u003cth>Setup/authentication\u003c/th>\u003cth>Bulk protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TLS 1.3 certificate-authenticated example\u003c/td>\u003ctd>ECDHE key agreement; server certificate establishes key identity; signature authenticates the handshake.\u003c/td>\u003ctd>AES-GCM or ChaCha20-Poly1305 AEAD.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IPsec\u003c/td>\u003ctd>IKE uses DH and authenticates with PSK or signatures/certificates; derives keys and negotiates security associations.\u003c/td>\u003ctd>ESP carries protected traffic, often AES-GCM.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SSH\u003c/td>\u003ctd>Key exchange such as Curve25519 plus host/user authentication.\u003c/td>\u003ctd>AES or ChaCha20-based protected session.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cstrong>TLS precision:\u003c/strong> TLS 1.3 removed RSA key transport. An RSA certificate/signature can authenticate ephemeral key agreement; it does not mean RSA encrypts the session key. TLS 1.3 also supports PSK modes, so the table shows the certificate-based path rather than every possible handshake. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8446.html\" target=\"_blank\" rel=\"noopener\">TLS 1.3 specification\u003c/a>.\u003c/p>","refs":[{"sourceId":"src28","from":42,"to":44}]}],"quiz":[{"question":"Which service does ordinary encryption alone primarily provide?","options":["Non-repudiation","Confidentiality","Certificate identity validation","Replay prevention"],"answer":1,"explanation":"Integrity and authentication require suitable additional/authenticated constructions.","refs":[{"sourceId":"src28","from":5,"to":6}]},{"question":"Which is the correct Caesar +5 encryption of NETWORK?","options":["SJYBTWP","MDUVNQJ","KHOOR","NETWORK"],"answer":0,"explanation":"Shift each letter forward five, wrapping W to B.","refs":[{"sourceId":"src28","from":12,"to":14}]},{"question":"How many distinct pairwise symmetric keys are needed for 200 users?","options":["200","400","19,900","39,800"],"answer":2,"explanation":"n(n−1)/2 = 200×199/2.","refs":[{"sourceId":"src28","from":18,"to":18}]},{"question":"Why is ECB unsuitable for structured multi-block data?","options":["It always uses weak 8-bit keys","It cannot decrypt","It reveals repeated-block patterns","It is an asymmetric agreement protocol"],"answer":2,"explanation":"Identical blocks under one key have identical ciphertext.","refs":[{"sourceId":"src28","from":23,"to":23}]},{"question":"Which property belongs to AES-GCM?","options":["It requires no nonce rules","It provides confidentiality and an authentication tag","It is a 64-bit block cipher","It is identical to unauthenticated ECB"],"answer":1,"explanation":"GCM is an AEAD construction; nonce uniqueness is critical.","refs":[{"sourceId":"src28","from":24,"to":24}]},{"question":"Which statement about padding is correct?","options":["Every AES use requires padding","Every stream cipher requires padding","CBC generally needs padding; CTR and GCM do not","Padding authenticates the sender"],"answer":2,"explanation":"Padding depends on mode, not simply the block-cipher label.","refs":[{"sourceId":"src28","from":22,"to":24}]},{"question":"Two ciphertexts reuse one keystream. What does XORing them give?","options":["The private signing key","Always both complete plaintexts without assumptions","The AES key directly","The XOR of the plaintexts"],"answer":3,"explanation":"The repeated keystream cancels; known/guessable text can then reveal content.","refs":[{"sourceId":"src28","from":29,"to":29}]},{"question":"Which choice fits TLS on a phone without AES acceleration?","options":["RC4","DES-ECB","ChaCha20-Poly1305","A5/1"],"answer":2,"explanation":"It offers efficient software authenticated encryption; the other options are historical/insecure.","refs":[{"sourceId":"src28","from":28,"to":32}]},{"question":"Why does plain DH allow a man in the middle?","options":["It sends the private key directly","It agrees a secret without authenticating whose public exchange values were received","It uses only 25 keys","It cannot produce the same value at both ends"],"answer":1,"explanation":"An active attacker can create separate agreements with each side unless identities are authenticated.","refs":[{"sourceId":"src28","from":36,"to":36}]},{"question":"Why is direct RSA encryption of all VPN traffic inappropriate?","options":["RSA has no key pair","It is designed only for Ethernet addresses","It is too slow and limited to small securely encoded inputs; use hybrid key establishment plus symmetric AEAD","It automatically gives better forward secrecy than ephemeral DH"],"answer":2,"explanation":"Hybrid protocols use expensive public-key operations for setup and fast symmetric protection for data.","refs":[{"sourceId":"src28","from":35,"to":44}]}],"tutorialAnswers":[{"sourceId":"src29","question":"Q1. State Kerckhoffs's principle, and explain why a cipher whose design is public but whose key is secret is considered stronger than a cipher whose design is kept secret.   [LO4]","answerHtml":"\u003cp>A cryptosystem should remain secure even when the algorithm is publicly known; only the key must stay secret. A public design can be scrutinised and its weaknesses found, whereas secrecy may merely hide flaws until reverse engineering or a leak. Publicity is not itself proof of security: choose well-reviewed constructions and protect/manage strong keys.\u003c/p>","refs":[{"sourceId":"src29","from":8,"to":8},{"sourceId":"src28","from":8,"to":8}]},{"sourceId":"src29","question":"Q2. Symmetric encryption protects confidentiality. Explain which other security services (integrity, authentication, non-repudiation) it does not provide on its own, and why.   [LO3]","answerHtml":"\u003cp>Encryption alone hides content but may allow undetected bit modifications, so integrity is not guaranteed. It does not by itself bind the peer/key to a named identity, so authentication is not assured. With symmetric encryption both parties know the key and either could create ciphertext, so it cannot provide third-party-verifiable non-repudiation. Use AEAD/MAC for integrity/origin among key holders and signatures plus trusted key identities when signer evidence is required.\u003c/p>","refs":[{"sourceId":"src29","from":9,"to":9},{"sourceId":"src28","from":6,"to":7}]},{"sourceId":"src29","question":"Q3. Encrypt the word NETWORK using a Caesar cipher with a shift of 5. Show your working for each letter, and then explain how an attacker who only sees the ciphertext could recover the message without knowing the shift.   [LO3]","answerHtml":"\u003cp>Using A=0 and adding 5 modulo 26:\u003c/p>\u003cpre>\u003ccode>N(13)+5=18 → S\nE(4)+5=9 → J\nT(19)+5=24 → Y\nW(22)+5=27 mod26=1 → B\nO(14)+5=19 → T\nR(17)+5=22 → W\nK(10)+5=15 → P\nCiphertext: SJYBTWP\u003c/code>\u003c/pre>\u003cp>The attacker tries all 25 nontrivial shifts and recognises the meaningful plaintext; with longer text, frequency patterns can help infer the shift.\u003c/p>","refs":[{"sourceId":"src29","from":11,"to":11},{"sourceId":"src28","from":12,"to":14}]},{"sourceId":"src29","question":"Q4. Explain why the Vigenere cipher defeats simple frequency analysis, yet is still breakable. What do the weaknesses of classical ciphers teach us about the properties a modern cipher must have?   [LO4]","answerHtml":"\u003cp>The repeated keyword makes one plaintext letter map to different ciphertext letters at different key positions, so a single overall frequency count is less useful. Repeated fragments can reveal key length (Kasiski analysis); split positions by key index and attack each as a Caesar system. Modern ciphers need sufficiently large key spaces and strong confusion/diffusion that hide exploitable statistical structure rather than repeat a short key.\u003c/p>","refs":[{"sourceId":"src29","from":12,"to":12},{"sourceId":"src28","from":13,"to":15}]},{"sourceId":"src29","question":"Q5. A company has 200 employees, and every pair of employees needs a private symmetric channel. Calculate how many keys are needed using n(n-1)/2, and explain the two separate problems that make symmetric key distribution hard.   [LO3]","answerHtml":"\u003cp>Keys=200×199/2=\u003cstrong>19,900\u003c/strong>. First, initial delivery: a secret sent openly is visible to an eavesdropper, so parties need secure establishment. Second, scale/lifecycle: a fully pairwise system needs many distinct keys to create, store, rotate and revoke consistently. Public-key authenticated key establishment can reduce the need for pre-delivered pairwise secrets.\u003c/p>","refs":[{"sourceId":"src29","from":14,"to":14},{"sourceId":"src28","from":18,"to":19}]},{"sourceId":"src29","question":"Q6. Explain what a mode of operation is, and explain why ECB mode is unsuitable for encrypting a long message while CBC mode is better.   [LO4]","answerHtml":"\u003cp>A mode specifies how a one-block cipher protects a longer message. ECB encrypts blocks independently, so repeated plaintext blocks show as repeated ciphertext, exposing structure such as the penguin image. CBC mixes each plaintext block with the previous ciphertext (and an unpredictable IV for the first), hiding equality patterns. CBC still needs correct padding, integrity protection and safe error handling; authenticated modern modes are preferable for new network designs.\u003c/p>","refs":[{"sourceId":"src29","from":16,"to":16},{"sourceId":"src28","from":22,"to":24}]},{"sourceId":"src29","question":"Q7. Explain how CTR mode makes a block cipher behave like a stream cipher, and state the single most important rule for using it safely.   [LO4]","answerHtml":"\u003cp>CTR encrypts a sequence of counter inputs under the block key to make a keystream, then XORs that stream with plaintext. Messages need no block padding and blocks can be processed in parallel. The critical rule is never reuse a counter/nonce input under the same key; repeated keystreams expose plaintext relationships. CTR by itself also needs authentication.\u003c/p>","refs":[{"sourceId":"src29","from":17,"to":17},{"sourceId":"src28","from":24,"to":24}]},{"sourceId":"src29","question":"Q8. Using WEP as your example, explain why reusing a keystream is catastrophic. Include what an attacker learns when two messages are encrypted with the same keystream.   [LO3]","answerHtml":"\u003cp>C1=P1 XOR S and C2=P2 XOR S, so C1 XOR C2=P1 XOR P2. If one plaintext is known, the attacker obtains S=C1 XOR P1 and can recover the other; likely protocol fields can also help. WEP’s 24-bit IV repeats on busy networks through birthday collisions, causing repeated RC4 keystreams, and its IV/key construction enables key recovery. This is why a nonce protocol and construction matter as much as the cipher.\u003c/p>","refs":[{"sourceId":"src29","from":18,"to":18},{"sourceId":"src28","from":29,"to":30}]},{"sourceId":"src29","question":"Q9. Compare block ciphers and stream ciphers on four aspects: the unit of data processed, the need for padding, what happens when a transmission error occurs, and the characteristic way each tends to fail in practice.   [LO4]","answerHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Block\u003c/th>\u003cth>Stream\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Unit\u003c/td>\u003ctd>Fixed-size blocks, for AES 128 bits.\u003c/td>\u003ctd>Keystream XOR at bit/byte level.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Padding\u003c/td>\u003ctd>Mode-dependent; CBC yes, CTR/GCM no.\u003c/td>\u003ctd>No message block padding.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Errors\u003c/td>\u003ctd>Depends on mode: CBC corrupts one block and flips corresponding bits in the next.\u003c/td>\u003ctd>Corresponding bit error only before authentication checking.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failure\u003c/td>\u003ctd>Wrong mode, IV/padding mistakes.\u003c/td>\u003ctd>Keystream reuse, missing integrity.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Authenticated constructions should reject altered records; both families need correct keys, nonces and protocol design.\u003c/p>","refs":[{"sourceId":"src29","from":19,"to":19},{"sourceId":"src28","from":22,"to":31}]},{"sourceId":"src29","question":"Q10. Recommend a cipher family and mode for each of the following, and justify each choice: (a) full disk encryption on a laptop, (b) a real-time voice call, (c) a TLS session on a low-end phone with no AES hardware support.   [LO3, LO4]","answerHtml":"\u003cp>(a) \u003cstrong>AES-XTS\u003c/strong> for disk sectors: random-access storage and AES acceleration; add separate integrity mechanisms where required. (b) \u003cstrong>Stream-like AES-CTR\u003c/strong> or an authenticated real-time construction: low latency and no padding suit small voice packets; nonce and authentication management are essential. (c) \u003cstrong>ChaCha20-Poly1305\u003c/strong> for TLS on a phone without AES hardware: efficient software encryption with authentication. Choose complete secure constructions rather than family names alone.\u003c/p>","refs":[{"sourceId":"src29","from":20,"to":20},{"sourceId":"src28","from":24,"to":32}]},{"sourceId":"src29","question":"Q11. Explain, in your own words, how Diffie-Hellman lets two parties who have never met agree a shared secret over a public channel, and explain why it is vulnerable to a man in the middle when used on its own.   [LO3, LO4]","answerHtml":"\u003cp>Each party chooses a private exponent and publishes a value derived from shared public parameters. Combining the received public value with its own private value gives the same secret at both ends, while the private values are not sent. In the lecture’s toy example p=13,g=6,a=5,b=4 gives public 2 and 9 and shared 3. An active attacker can substitute its own public values, agree one key with Alice and another with Bob, and relay messages. Authenticate the agreement with signatures/certificates or an appropriate authenticated protocol.\u003c/p>","refs":[{"sourceId":"src29","from":22,"to":22},{"sourceId":"src28","from":36,"to":37}]},{"sourceId":"src29","question":"Q12. A company is designing a battery-powered sensor with very little memory and processing power that must sign its readings. Compare RSA and elliptic curve cryptography for this device and recommend one, justifying your answer.   [LO3, LO4]","answerHtml":"\u003cp>Recommend an established ECC signature scheme supported by the sensor, such as ECDSA or EdDSA, rather than treating ECDH as signing. At the lecture’s roughly 128-bit comparison, ~256-bit ECC keys replace ~3072-bit RSA, reducing storage, transmission and often computation/energy. RSA uses larger keys/signatures and is less attractive on a constrained sensor. Use a mature implementation, supported curve and secure private-key/randomness handling; ECDSA nonce reuse is dangerous.\u003c/p>","refs":[{"sourceId":"src29","from":23,"to":23},{"sourceId":"src28","from":35,"to":40}]},{"sourceId":"src29","question":"Q13. Give two advantages and two disadvantages of asymmetric encryption compared with symmetric encryption.   [LO4]","answerHtml":"\u003cp>Two advantages: public keys support first-contact secret establishment without delivering every pairwise secret, and signatures provide publicly verifiable origin/integrity and support non-repudiation. Two disadvantages: operations are much slower with larger keys/outputs, and a public key’s claimed identity must be authenticated. Conventional RSA/DH/ECC also face future quantum threats.\u003c/p>","refs":[{"sourceId":"src29","from":24,"to":24},{"sourceId":"src28","from":40,"to":42}]},{"sourceId":"src29","question":"Q14. Explain why neither symmetric nor asymmetric encryption is sufficient on its own, and describe the two phases of hybrid encryption using a TLS connection as your example.   [LO3, LO4]","answerHtml":"\u003cp>Symmetric encryption is efficient but needs an already established shared secret; asymmetric techniques establish/authenticate secrets but are inefficient for bulk traffic. In a certificate-authenticated TLS 1.3 handshake, ephemeral ECDHE establishes shared material and certificates/signatures authenticate it; keys are derived for records. Application data then uses fast AEAD such as AES-GCM or ChaCha20-Poly1305. TLS 1.3 does not transport the session key using RSA.\u003c/p>","refs":[{"sourceId":"src29","from":26,"to":26},{"sourceId":"src28","from":42,"to":44}]},{"sourceId":"src29","question":"Q15. A colleague proposes encrypting all traffic in a new VPN directly with RSA, to avoid having to manage session keys. Evaluate this proposal and explain what would go wrong.   [LO4]","answerHtml":"\u003cp>Reject the proposal. RSA operations are expensive and securely encoded RSA encryption accepts only small values, so direct bulk traffic encryption would be inefficient and inappropriate. It also does not eliminate key management: private/public keys, authentication, replay/integrity and rotation still need handling. Use IKE with authenticated DH to derive fresh symmetric ESP keys, then efficient AEAD such as AES-GCM, with rekeying and appropriate forward secrecy.\u003c/p>","refs":[{"sourceId":"src29","from":27,"to":27},{"sourceId":"src28","from":35,"to":44}]}]},"m16":{"id":"m16","title":"Integrity, HMAC, signatures, certificates and PKI","sections":[{"title":"Hash properties and distinct attack goals","html":"\u003cp>A cryptographic hash deterministically maps arbitrary-length input to a fixed-length digest. It is a fingerprint, not encryption and not a secret-key proof of origin.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Attacker’s task it should resist\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Preimage resistance\u003c/td>\u003ctd>Given h, find any m with H(m)=h.\u003c/td>\u003ctd>Recover an input from its stored digest.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Second-preimage resistance\u003c/td>\u003ctd>Given a particular m, find different m′ with H(m′)=H(m).\u003c/td>\u003ctd>Replace an already fixed evidence file with a different file sharing its digest.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Collision resistance\u003c/td>\u003ctd>Find any two different m,m′ with equal digest.\u003c/td>\u003ctd>Prepare a benign/malicious pair, get the benign one signed, then substitute its colliding partner.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Fixed size makes comparison/storage simple; determinism ensures the same bytes yield the same result. Hashes must be computed over exactly the relevant bytes and the reference must be protected for adversarial integrity. Collisions necessarily exist because the input space is larger; the requirement is computational infeasibility, not mathematical impossibility.\u003c/p>","refs":[{"sourceId":"src30","from":5,"to":5}]},{"title":"Avalanche and hash algorithm status","html":"\u003cp>A small input change should produce an apparently unrelated digest. The lecture SHA-256 example (first 32 of 64 hex digits):\u003c/p>\u003cpre>\u003ccode>Pay Alice 100 dollars → 2a31bcf4ca7789bc833e8aedb1e97f1b\nPay Alice 900 dollars → 995a973968487cb07d6ebd53fb8379d0\u003c/code>\u003c/pre>\u003cp>The full digests differ in 133 of 256 bits, close to half. This illustrates avalanche; it is not by itself a proof that an algorithm resists cryptanalysis.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Family\u003c/th>\u003cth>Digest\u003c/th>\u003cth>Course status and context\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MD5\u003c/td>\u003ctd>128 bits.\u003c/td>\u003ctd>Broken collisions; historic 2008 rogue-CA attack. Do not select for new security designs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SHA-1\u003c/td>\u003ctd>160 bits.\u003c/td>\u003ctd>Deprecated collision resistance; SHAttered demonstrated in 2017. Historical compatibility only.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SHA-2\u003c/td>\u003ctd>SHA-256:256 bits; SHA-512:512 bits.\u003c/td>\u003ctd>Modern family used in protocols, signatures and integrity constructions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SHA-3\u003c/td>\u003ctd>224/256/384/512 bits.\u003c/td>\u003ctd>Keccak design, standardised 2015; structural alternative to SHA-2.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Older IPsec framework names such as MD5/SHA-1 are course history; prefer suitable modern authenticated constructions and algorithms. Collision weakness in a bare hash and security of HMAC built from it are not identical questions, but new designs should avoid legacy choices.\u003c/p>","refs":[{"sourceId":"src30","from":6,"to":7}]},{"title":"Hash attacks, passwords and trusted references","html":"\u003cp>A generic collision search on an ideal n-bit digest takes about 2^(n/2) work because of the birthday effect; SHA-256 therefore has about 128-bit collision strength, not 256-bit collision strength. MD5 also has far stronger practical structural attacks than its generic bound.\u003c/p>\u003cp>For low-entropy passwords, preimage resistance does not prevent dictionary/brute-force guessing: hash candidates and compare. Unsalted databases also allow precomputed rainbow-table attacks and reveal repeated passwords via repeated digests. Use a \u003cstrong>unique random salt per password\u003c/strong> plus an appropriately configured \u003cstrong>slow password-hashing/KDF\u003c/strong> such as Argon2, scrypt, bcrypt or PBKDF2. Salt defeats reusable precomputation; cost slows each guess. Neither makes weak passwords unguessable.\u003c/p>\u003cp>Applications: compare file downloads with a trusted digest; record forensic evidence digests with protected custody; use hashes inside signatures/MACs. If an attacker replaces both a download and the digest beside it, a match gives no assurance of vendor origin. Protect the digest channel, or verify a vendor signature using an independently trusted public key. Plain hashes are excellent change detectors only with a trusted reference.\u003c/p>","refs":[{"sourceId":"src30","from":8,"to":10}]},{"title":"MAC and HMAC: shared-secret integrity","html":"\u003cp>If Alice sends “Pay Carol 100” and an unprotected SHA-256 digest, Mallory can change it to “Pay Mallory 9000” and compute a fresh matching digest. A hash shows consistency with a reference, not authorship. A Message Authentication Code combines the message with a shared secret unknown to Mallory.\u003c/p>\u003cp>Sender computes a tag over message/context; receiver recomputes using the same secret and compares safely. A valid tag demonstrates integrity and origin among key holders. The source diagram shows message + key entering MAC generation, then transmitted message/tag compared with the receiver’s recomputed tag.\u003c/p>\u003cpre>\u003ccode>HMAC(K,m) = H((K′ XOR opad) || H((K′ XOR ipad) || m))\u003c/code>\u003c/pre>\u003cp>K′ is the block-sized processed key; || means concatenation. The inner/outer construction avoids problems of naïvely hashing key and message together. HMAC-SHA256 and HMAC-SHA512 are examples. It is fast and supports IPsec integrity, API authentication, keyed session tokens and routing authentication. TLS uses HMAC in key derivation/Finished, while TLS 1.3 data records use AEAD tags rather than a separate per-record HMAC.\u003c/p>\u003cp>Limits: establish/protect the shared key; either endpoint can generate tags, so no third-party-verifiable signer-specific non-repudiation. A stolen key allows forgery. A captured valid message/tag can be replayed unless the authenticated data includes a sequence number, nonce, timestamp or equivalent freshness context enforced by the protocol.\u003c/p>","refs":[{"sourceId":"src30","from":12,"to":14}]},{"title":"Digital signatures: sign and verify","html":"\u003cp>Sender hashes/encodes the message as required by a secure signature scheme, signs with the private key and sends message plus signature. Receiver obtains the genuine public key, recomputes the message digest as required, and runs verification. Modern schemes return valid/invalid; not all recover a second digest from the signature. Hashing lets a large message feed a compact signature operation efficiently.\u003c/p>\u003cp>A secure signature supports integrity, origin authentication of the private-key holder and publicly verifiable evidence supporting non-repudiation. It does not hide the message, prove the signer’s key identity without trusted binding, prove a particular human’s intent or solve compromise of the signing device/private key. Context and freshness still matter.\u003c/p>\u003cp>The lecture’s digest-transformation diagram is conceptual. Use a signature scheme such as RSA-PSS, ECDSA or EdDSA, rather than implementing “encrypt a hash with a private key.” Dedicated scheme encoding/verification is essential. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8017.html\" target=\"_blank\" rel=\"noopener\">RSA scheme definitions\u003c/a>.\u003c/p>","refs":[{"sourceId":"src30","from":16,"to":17}]},{"title":"Signature schemes and the non-repudiation comparison","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Scheme\u003c/th>\u003cth>Basis/size in course\u003c/th>\u003cth>Operational point\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RSA signatures\u003c/td>\u003ctd>RSA/factoring-related; 2048–3072-bit keys; signature length follows modulus.\u003c/td>\u003ctd>Widely deployed; PSS for appropriate new designs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DSA\u003c/td>\u003ctd>Finite-field discrete logarithm; course shows 2048-bit keys.\u003c/td>\u003ctd>Legacy; not for new signature generation in the cited modern NIST standard.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ECDSA\u003c/td>\u003ctd>Elliptic curves; ~256-bit keys and ~64-byte signature components.\u003c/td>\u003ctd>Per-message nonce must be generated correctly and not reused; reuse can expose the private key. Safe deterministic generation is also possible in appropriate implementations.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EdDSA/Ed25519\u003c/td>\u003ctd>Elliptic-curve scheme; 64-byte signatures, compact keys.\u003c/td>\u003ctd>Deterministic signing avoids dependence on fresh external random nonces for every signature, while key/implementation protection remains essential.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>MAC: Alice and Bob both hold the key, so Alice can claim Bob generated a disputed tag. Signature: Bob can verify but cannot produce Alice’s signature without her private key; a third party can verify the same evidence. Secure key custody, valid identity binding and protected records are necessary assumptions. High-assurance audit logs can be signed to strengthen accountability.\u003c/p>\u003cp>Uses include certificates, software/firmware updates, code signing, S/MIME email, contracts, DNSSEC, RPKI, TLS and SSH authentication. Signatures cost more CPU and bytes than MACs. Conventional signature schemes also face the lecture’s future quantum threat.\u003c/p>\u003cp>The qualification that ECDSA can safely generate its per-message value deterministically is specified in \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6979\" target=\"_blank\" rel=\"noopener\">RFC 6979\u003c/a>; it does not make arbitrary repeated nonces safe.\u003c/p>","refs":[{"sourceId":"src30","from":18,"to":20}]},{"title":"Hash versus MAC versus signature: choose by guarantee","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Hash\u003c/th>\u003cth>MAC/HMAC\u003c/th>\u003cth>Digital signature\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Key\u003c/td>\u003ctd>None.\u003c/td>\u003ctd>Shared secret.\u003c/td>\u003ctd>Private signs, public verifies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>When reference digest is trusted/protected.\u003c/td>\u003ctd>Yes, against parties without the key.\u003c/td>\u003ctd>Yes, with trusted public key and secure scheme.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Origin\u003c/td>\u003ctd>No.\u003c/td>\u003ctd>One of the key holders.\u003c/td>\u003ctd>Private-key holder; identity needs trusted binding.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Non-repudiation\u003c/td>\u003ctd>No.\u003c/td>\u003ctd>No between shared-key holders.\u003c/td>\u003ctd>Supports it under key/identity/evidence assumptions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Speed\u003c/td>\u003ctd>Generally fastest.\u003c/td>\u003ctd>Fast.\u003c/td>\u003ctd>Slower, larger proof.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical choice\u003c/td>\u003ctd>File check against trusted reference.\u003c/td>\u003ctd>Router-to-router packet authentication; often AEAD instead.\u003c/td>\u003ctd>Publicly verifiable vendor update or certificate.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>A server’s public key alone leaves an identity gap. Mallory can substitute her own key and produce perfectly valid signatures or negotiate encryption with it. The mathematics verifies a key, not the bank’s name. A trusted identity-to-key binding is required.\u003c/p>","refs":[{"sourceId":"src30","from":19,"to":22}]},{"title":"X.509 certificates, fields and MITM defence","html":"\u003cp>A certificate is a public signed data structure binding a subject identity to a public key. A CA signs it with the CA private key; relying parties trust the CA through an established trust anchor. Like a passport, assurance depends on the trusted issuer checking the binding. The certificate contains no private key and may be distributed openly.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Version/serial\u003c/td>\u003ctd>Normally X.509 v3; serial uniquely identifies a certificate within the issuer.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Signature algorithm/issuer\u003c/td>\u003ctd>How the issuer signed and which CA issued it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Validity\u003c/td>\u003ctd>Not Before and Not After times.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subject and public key\u003c/td>\u003ctd>Certified entity and its public key/algorithm.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extensions\u003c/td>\u003ctd>SAN hostnames, Key Usage, Basic Constraints/CA status and revocation locations.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CA signature\u003c/td>\u003ctd>Protects the certified fields against alteration.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Against MITM, reject an attacker key without a valid certificate for the intended service under an accepted chain, and require proof of the matching private key during the handshake. A CA signature is not sufficient if hostname, validity, usage, constraints or trust checks fail. DV validates domain control rather than promising that a site’s business is honest.\u003c/p>","refs":[{"sourceId":"src30","from":24,"to":26}]},{"title":"Six checks and certificate types","html":"\u003cul>\u003cli>\u003cstrong>Dates:\u003c/strong> current time lies within validity; rejects expired or not-yet-valid credentials.\u003c/li>\u003cli>\u003cstrong>Service name:\u003c/strong> the certificate identifies the intended hostname, using SAN for modern service identity; rejects a valid certificate for another site.\u003c/li>\u003cli>\u003cstrong>Signature:\u003c/strong> verify the issuer signature; detect modification/forgery.\u003c/li>\u003cli>\u003cstrong>Chain/trust:\u003c/strong> validate each link and relevant CA/usage/algorithm constraints to an accepted trust anchor; reject unknown or unauthorised issuers.\u003c/li>\u003cli>\u003cstrong>Revocation/status:\u003c/strong> apply the client’s revocation policy; expiry alone does not catch an emergency compromise.\u003c/li>\u003cli>\u003cstrong>Private-key possession:\u003c/strong> the peer proves the matching key during the handshake; a copied certificate alone is insufficient.\u003c/li>\u003c/ul>\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Vetting\u003c/th>\u003cth>Use/limitation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DV\u003c/td>\u003ctd>Domain control.\u003c/td>\u003ctd>Common public sites; fast automation; not organisational/business legitimacy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OV\u003c/td>\u003ctd>Domain plus organisation existence/identity checks.\u003c/td>\u003ctd>Institutional/business use; more issuance work.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EV\u003c/td>\u003ctd>More extensive organisation vetting.\u003c/td>\u003ctd>High-vetting policies; browser display is less prominent than historically.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Self-signed\u003c/td>\u003ctd>No independent CA vouching.\u003c/td>\u003ctd>Lab/test devices where trust is securely provisioned or fingerprint checked; public users do not automatically trust it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>For a public shop, use an accepted CA-issued certificate with the correct name and protected private key; DV supplies ordinary domain authentication. For a controlled lab, a securely verified self-signed certificate can be adequate. Larger internal deployments generally manage an internal CA instead of encouraging warning bypass.\u003c/p>\u003cp>For modern TLS service identity, use the appropriate SAN identifier rather than relying on the subject Common Name: \u003ca href=\"https://datatracker.ietf.org/doc/html/rfc9525\" target=\"_blank\" rel=\"noopener\">RFC 9525\u003c/a>.\u003c/p>","refs":[{"sourceId":"src30","from":27,"to":28}]},{"title":"PKI components and the chain of trust","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CA\u003c/td>\u003ctd>Issue, sign and revoke certificates; protect signing keys.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RA\u003c/td>\u003ctd>Verify applicant identity on the CA’s behalf.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subscriber/end entity\u003c/td>\u003ctd>Person, device or service requesting/using a certificate.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repository\u003c/td>\u003ctd>Publish certificates and status/revocation information.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relying party\u003c/td>\u003ctd>Browser/router deciding whether the certificate is acceptable.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Typical chain: trusted root → intermediate CA → leaf server/device. Keep the highly valuable root key offline and use intermediates for daily signing. A compromised intermediate can be revoked/replaced, limiting remediation compared with loss of the root trust anchor. Compromise of a root can affect all dependent chains and requires trust-store response; hierarchy/constraints still define the scope.\u003c/p>\u003cp>The server normally supplies leaf and intermediates; the client already has its trust anchor. A root is trusted because a vendor/organisation placed it in a trust store, not because self-signing mathematically establishes identity. Vendors audit and can remove CAs. Organisations can deploy internal roots, whose controllers can issue identities trusted by managed devices. RPKI uses a similar chain pattern with different trust anchors and resource authorisations.\u003c/p>","refs":[{"sourceId":"src30","from":30,"to":32}]},{"title":"Revocation, lifecycle and operational limits","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>CRL\u003c/th>\u003cth>OCSP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mechanism\u003c/td>\u003ctd>CA signs a list of revoked certificate serial numbers.\u003c/td>\u003ctd>Responder signs status for a queried certificate: good, revoked or unknown.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Freshness\u003c/td>\u003ctd>Limited by publication/cache validity.\u003c/td>\u003ctd>Potentially fresher, but response validity/caching still matters.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scale\u003c/td>\u003ctd>List size and download distribution.\u003c/td>\u003ctd>Small per-certificate replies but responder load/availability.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Privacy\u003c/td>\u003ctd>No individual site query needed.\u003c/td>\u003ctd>Direct queries reveal sites to responder; stapling reduces this.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outage\u003c/td>\u003ctd>A valid cached list may help.\u003c/td>\u003ctd>Some clients fail open, undermining assurance.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>OCSP stapling attaches a recent CA-signed status reply at the server so clients need not directly query. Revocation behaviour is client-policy dependent; not every browser performs every live check. This is an operational weakness when checks are skipped, stale or fail open.\u003c/p>\u003cp>Lifecycle: generate keys locally → CSR containing public key/identity → RA validation → CA issuance → deployment → renewal or revocation. Keep the private key private throughout. Expiration/automated renewal limit exposure but can cause outages if mismanaged. Revoke on key theft, misissuance or loss of entitlement; publish status. PKI scales trust without prior pairwise secrets, but centralises risk and requires key protection, monitoring, renewals and users respecting errors.\u003c/p>","refs":[{"sourceId":"src30","from":33,"to":36}]},{"title":"DigiNotar: valid signatures from an untrustworthy CA","html":"\u003cp>In the lecture’s 2011 case, attackers compromised the Dutch CA DigiNotar and issued fraudulent certificates including one for google.com. Clients could accept genuine CA signatures on false identity bindings. They were used to intercept Gmail traffic, particularly affecting Iranian users. Browser/OS vendors removed the CA from trust stores and the company subsequently failed.\u003c/p>\u003cp>The lesson: trusting a signing key is also trusting the issuer’s identity checks and operations. A compromised broadly trusted CA may misissue for domains it does not legitimately control. Root-store distrust, stronger audits and Certificate Transparency help respond/detect misissuance. CT publicly logs issuance so domain owners can notice unauthorised certificates; it improves visibility, rather than magically making a compromised key safe.\u003c/p>","refs":[{"sourceId":"src30","from":35,"to":36}]},{"title":"TLS 1.3: every primitive in one handshake","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Message/stage\u003c/th>\u003cth>Primitive and purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ClientHello\u003c/td>\u003ctd>Offers supported algorithms and an ephemeral key share.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ServerHello\u003c/td>\u003ctd>Server key share; ECDHE shared material feeds a key-derivation schedule.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Certificate\u003c/td>\u003ctd>X.509 chain binds server identity to a key under accepted CA policy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CertificateVerify\u003c/td>\u003ctd>Signature authenticates the handshake and proves the peer holds the certificate private key.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finished\u003c/td>\u003ctd>HMAC-based confirmatio
