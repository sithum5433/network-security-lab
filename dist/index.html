n authenticates the transcript under derived handshake secrets.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application data\u003c/td>\u003ctd>Symmetric AEAD such as AES-GCM or ChaCha20-Poly1305 provides confidentiality and integrity.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The table follows the certificate-authenticated ECDHE path. TLS 1.3 also has PSK modes; it does not use RSA key transport. After ServerHello, the relevant handshake messages, including the certificate, are encrypted under derived handshake keys. Traffic and handshake keys have distinct roles rather than one generic key. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8446.html\" target=\"_blank\" rel=\"noopener\">TLS 1.3 specification\u003c/a>.\u003c/p>\u003cp>Primitive map: symmetric encryption needs a shared key; DH agreement needs peer authentication; a hash needs no secret; HMAC needs a shared key; a signature needs private-key custody plus trust in the public key; a certificate needs an accepted trust chain. Together these solve separate requirements.\u003c/p>","refs":[{"sourceId":"src30","from":38,"to":39}]},{"title":"Cisco PKI: trustpoint and enrolment order","html":"\u003cp>A trustpoint is a named CA configuration: whom to trust, enrolment method and key pair. Generate the router’s key pair first; define the trustpoint; authenticate the CA (obtain and verify its certificate/fingerprint over a trusted independent channel); then enrol the router (send a CSR and obtain its own certificate). Authentication establishes which CA is acceptable before relying on its response.\u003c/p>\u003cpre>\u003ccode>ip domain-name lab.local\ncrypto key generate rsa general-keys label RTR-KEYS modulus 2048\ncrypto pki trustpoint CORP-CA\n enrollment url http://192.168.1.50:80\n subject-name CN=R1.lab.local\n rsakeypair RTR-KEYS\n revocation-check none\n exit\ncrypto pki authenticate CORP-CA\ncrypto pki enroll CORP-CA\nshow crypto pki certificates\u003c/code>\u003c/pre>\u003cp>The enrolment request carries the public key and identity, not the private key. \u003ccode>revocation-check none\u003c/code> is the lecture’s lab-only simplification; production policy needs supported revocation checking. The HTTP lab URL does not itself authenticate the CA; verify the CA fingerprint independently. After enrolment, certificates can authenticate IPsec/SSL-VPN peers instead of configuring every pair with a PSK, provided peer name/policy and trust validation are correctly set.\u003c/p>","refs":[{"sourceId":"src30","from":40,"to":41}]}],"quiz":[{"question":"Given a fixed signed document, finding a different document with the same digest attacks which property?","options":["Preimage resistance only","Second-preimage resistance","Key agreement","Password salting"],"answer":1,"explanation":"The original input is fixed, unlike finding any two colliding inputs.","refs":[{"sourceId":"src30","from":5,"to":5}]},{"question":"Which changes best improve unsalted SHA-256 password storage?","options":["Encrypt all passwords with one published key","Only add a username prefix to SHA-256","Use a unique random salt and a suitably costed slow password KDF","Use MD5 twice"],"answer":2,"explanation":"Salt prevents reusable precomputation; cost slows guessing.","refs":[{"sourceId":"src30","from":8,"to":8}]},{"question":"An attacker edits a message and its unprotected SHA-256 digest. Why may the receiver accept?","options":["SHA-256 always produces the same digest for every input","The attacker can compute a fresh unkeyed digest of the edited message","Hashes contain the sender’s private key","Digest comparison encrypts the message"],"answer":1,"explanation":"A plain hash does not authenticate origin when the reference is attacker-controlled.","refs":[{"sourceId":"src30","from":12,"to":12}]},{"question":"Why can Alice deny an HMAC message to a third party?","options":["HMAC cannot detect any modification","The verifier must decrypt with Alice’s private key","The hash is always public","Bob also holds the shared key and could generate the tag"],"answer":3,"explanation":"A shared-key proof does not distinguish Alice from Bob as originator.","refs":[{"sourceId":"src30","from":19,"to":19}]},{"question":"What does a valid digital signature alone fail to establish?","options":["That it verifies for the supplied key","A trusted human/site identity for an otherwise unverified public key","A relation to the signed message","Use of the matching private key under secure-scheme assumptions"],"answer":1,"explanation":"Certificate or other trusted binding is needed to know whose key it is.","refs":[{"sourceId":"src30","from":17,"to":22}]},{"question":"Why is sending a copied server certificate insufficient for impersonation in properly validated TLS?","options":["Certificates are secret","The certificate automatically reveals the private key","The server must also prove possession of the matching private key","No browser checks certificates"],"answer":2,"explanation":"CertificateVerify authenticates possession in the certificate-based TLS 1.3 handshake.","refs":[{"sourceId":"src30","from":27,"to":38}]},{"question":"What makes a root CA an accepted trust anchor?","options":["Its self-signature alone proves its owner is honest","It has the longest name","It always uses a password","The relying party’s trust policy/store accepts it"],"answer":3,"explanation":"A self-signature is not an independent identity endorsement; root trust is provisioned by policy.","refs":[{"sourceId":"src30","from":31,"to":32}]},{"question":"Which statement about revocation is correct?","options":["A certificate cannot be revoked before expiry","OCSP always blocks access whenever unavailable","A currently dated certificate may be revoked; actual client policy and availability affect checks","CRLs contain private keys"],"answer":2,"explanation":"Expiry and revocation are separate, and fail-open/skip behaviour can weaken practical checking.","refs":[{"sourceId":"src30","from":33,"to":34}]},{"question":"Which primitive protects TLS 1.3 application records in the lecture example?","options":["Raw RSA encryption","A plain unprotected digest","AES-GCM or ChaCha20-Poly1305 AEAD","A copied public certificate alone"],"answer":2,"explanation":"Symmetric AEAD protects data after key agreement and authentication.","refs":[{"sourceId":"src30","from":38,"to":39}]},{"question":"Which Cisco PKI order is correct?","options":["Enrol, then generate key, then authenticate","Generate key, define trustpoint, authenticate CA, enrol","Disable all revocation, then accept any key","Define trustpoint, share private key with CA, enrol"],"answer":1,"explanation":"Generate keys locally; establish CA trust before obtaining/trusting the device certificate.","refs":[{"sourceId":"src30","from":40,"to":41}]}],"tutorialAnswers":[{"sourceId":"src31","question":"Q1. Explain the difference between second-preimage resistance and collision resistance, and give a short example scenario in which an attacker would need to defeat each one.   [LO3]","answerHtml":"\u003cp>\u003cstrong>Second preimage:\u003c/strong> given one fixed message m, find m′≠m with the same digest; an attacker replacing an already recorded evidence file needs this. \u003cstrong>Collision:\u003c/strong> choose any two different inputs with the same digest; an attacker may prepare benign and malicious contract twins, obtain a signature on the benign one, then substitute the malicious twin. The freedom to choose both inputs makes the collision goal different.\u003c/p>","refs":[{"sourceId":"src31","from":8,"to":8},{"sourceId":"src30","from":5,"to":8}]},{"sourceId":"src31","question":"Q2. A website stores its users' passwords as unsalted SHA-256 digests. Describe two attacks that this design is vulnerable to, and recommend a better design, naming the two specific changes you would make.   [LO3, LO4]","answerHtml":"\u003cp>Unsalted fast SHA-256 permits dictionary/brute-force guessing at high speed and reuse of precomputed rainbow tables; equal passwords also have equal digests. Make two changes: store a unique random salt for every password, and use a deliberately expensive password-hashing/KDF such as Argon2/scrypt/bcrypt/PBKDF2 with appropriate parameters. Salt defeats reusable precomputation; work/memory cost slows each guess. Neither replaces strong passwords or breach controls.\u003c/p>","refs":[{"sourceId":"src31","from":9,"to":9},{"sourceId":"src30","from":8,"to":9}]},{"sourceId":"src31","question":"Q3. A software vendor publishes a download link and the file's SHA-256 digest on the same web page. Evaluate how much assurance this gives a user, and describe what would improve it.   [LO4]","answerHtml":"\u003cp>A matching SHA-256 reference detects accidental damage and changes when that reference is trustworthy. If the attacker controls the page/file, both can be replaced and the match proves no vendor origin. Deliver the digest over an independently authenticated/trusted channel or, preferably for publisher verification, validate a vendor signature using an independently trusted public key/certificate. HTTPS helps authenticate delivery but a compromised publisher page remains a separate risk.\u003c/p>","refs":[{"sourceId":"src31","from":10,"to":10},{"sourceId":"src30","from":9,"to":10}]},{"sourceId":"src31","question":"Q4. Explain why an attacker can defeat a plain hash used to protect a message in transit, but cannot defeat an HMAC. Use a short example.   [LO3]","answerHtml":"\u003cp>Alice sends “Pay Carol 100” plus H(message). Mallory replaces it with “Pay Mallory 9000” and computes the public hash of the replacement, so comparison passes. With a secure HMAC, producing the correct replacement tag requires the secret key Mallory does not hold, so alteration is rejected. Protect freshness separately: replaying an unchanged valid message/tag is not a forgery prevented by HMAC alone.\u003c/p>","refs":[{"sourceId":"src31","from":12,"to":12},{"sourceId":"src30","from":12,"to":14}]},{"sourceId":"src31","question":"Q5. Alice and Bob protect their messages with an HMAC using a shared key. Explain why this cannot provide non-repudiation, and what Alice could claim if she later wanted to deny sending a message.   [LO4]","answerHtml":"\u003cp>Alice and Bob both hold the same secret and can generate every valid tag. Alice can claim Bob created the disputed message/tag; an independent third party cannot distinguish them cryptographically. Use a digital signature from Alice’s private key, with a trusted public-key binding and secure key custody, for publicly verifiable evidence supporting non-repudiation.\u003c/p>","refs":[{"sourceId":"src31","from":13,"to":13},{"sourceId":"src30","from":14,"to":19}]},{"sourceId":"src31","question":"Q6. Describe the steps a sender follows to sign a message and the steps a receiver follows to verify it. Explain why the sender signs the digest rather than the whole message, and state what a successful verification does and does not prove.   [LO3, LO4]","answerHtml":"\u003cp>The sender feeds the message through the chosen signature scheme, normally hashing it and applying the scheme’s encoding/mathematics with the private key, then sends message/signature. The receiver obtains the authentic public key and verifies the signature against the received message, recomputing its hash as required. Hashing avoids expensive public-key processing of every byte directly. Valid verification supports message integrity and private-key-holder origin; it does not encrypt the message or by itself identify whose public key was used, prove human intent or rule out key theft. Signing is not generic private-key encryption.\u003c/p>","refs":[{"sourceId":"src31","from":15,"to":15},{"sourceId":"src30","from":16,"to":20}]},{"sourceId":"src31","question":"Q7. Compare a hash, a MAC, and a digital signature, and recommend which one to use for each of the following, justifying each choice: (a) checking a downloaded file against a published digest, (b) protecting the integrity of IPsec packets between two routers, (c) proving that a software update came from the vendor.   [LO3, LO4]","answerHtml":"\u003cp>A hash has no key and needs a trusted reference; a MAC has a shared secret for efficient integrity/origin among holders; a signature has private signing/public verification keys and supports independent signer evidence. (a) Compare the download’s hash with a securely obtained published digest. (b) Use an agreed secure MAC/integrity algorithm or ESP AEAD between routers, with replay protection. (c) Use a vendor digital signature verified against its trusted key: users can verify without being able to forge the vendor signature.\u003c/p>","refs":[{"sourceId":"src31","from":16,"to":16},{"sourceId":"src30","from":13,"to":21}]},{"sourceId":"src31","question":"Q8. Explain how a man in the middle can defeat both encryption and digital signatures when the receiver has no way to check whose public key it holds, and explain how a certificate removes this weakness.   [LO3]","answerHtml":"\u003cp>Mallory substitutes her own public key while claiming it is the bank’s. A client can then encrypt to Mallory or accept her signatures, and she relays a separate protected exchange to the real bank. The mathematics works but the identity binding is false. Validate a certificate for the intended service under a trusted CA chain and require the matching private-key proof in the authenticated handshake. That rejects Mallory’s unrelated key unless trust itself has been compromised.\u003c/p>","refs":[{"sourceId":"src31","from":18,"to":18},{"sourceId":"src30","from":22,"to":27}]},{"sourceId":"src31","question":"Q9. List at least five checks a browser performs when verifying a server's certificate, and for each, say what attack or error it protects against.   [LO3, LO4]","answerHtml":"\u003cul>\u003cli>Validity window: rejects expired/not-yet-valid credentials.\u003c/li>\u003cli>Intended hostname/SAN: rejects another service’s valid certificate.\u003c/li>\u003cli>Issuer signature: detects altered or forged certificate data.\u003c/li>\u003cli>Chain/trust and CA/usage constraints: rejects unknown/unauthorised issuance.\u003c/li>\u003cli>Revocation status according to policy: catches credentials invalidated before expiry.\u003c/li>\u003cli>Handshake private-key possession: rejects someone merely replaying a copied public certificate.\u003c/li>\u003c/ul>\u003cp>Client policies and revocation behaviour vary; practical assurance depends on completing the relevant checks.\u003c/p>","refs":[{"sourceId":"src31","from":19,"to":19},{"sourceId":"src30","from":26,"to":27}]},{"sourceId":"src31","question":"Q10. Compare a domain validated (DV) certificate with a self-signed certificate. Recommend which is appropriate for (a) a public online shop and (b) an internal lab device, and justify each choice.   [LO4]","answerHtml":"\u003cp>DV means an accepted CA checked control of the domain and signed the public-key binding; it does not promise the business is trustworthy. A self-signed certificate has no independent CA endorsement and needs securely provisioned/manual trust. (a) A public shop needs a publicly accepted CA certificate with correct name, so a suitable DV certificate can supply standard domain authentication. (b) A controlled lab can use self-signed credentials if the fingerprint/key is independently checked or trust is provisioned; do not teach users to bypass arbitrary warnings. An internal CA scales better for many devices.\u003c/p>","refs":[{"sourceId":"src31","from":20,"to":20},{"sourceId":"src30","from":28,"to":32}]},{"sourceId":"src31","question":"Q11. Explain why a PKI uses a root CA and intermediate CAs, rather than having the root sign every certificate directly. What would be the consequence of the root's private key being compromised, compared with an intermediate's?   [LO4]","answerHtml":"\u003cp>An offline, rarely used root signs intermediates, which perform day-to-day issuance. This limits root exposure and lets an affected intermediate be revoked/replaced. Intermediate compromise can undermine certificates beneath it, subject to chain constraints; root compromise threatens trust in its dependent hierarchy and may require root-store removal/replacement and reissuance. Trust anchors are provisioned by policy, so a root’s self-signature cannot rescue a compromised anchor.\u003c/p>","refs":[{"sourceId":"src31","from":22,"to":22},{"sourceId":"src30","from":31,"to":32}]},{"sourceId":"src31","question":"Q12. Compare CRL and OCSP as methods of checking revocation, and explain why revocation checking is often described as the weak point of PKI in practice.   [LO4]","answerHtml":"\u003cp>A CRL is a CA-signed published list of revoked serial numbers: cacheable but potentially large/stale until updated. OCSP supplies a signed per-certificate status response: smaller/fresher queries but responder load, outages and privacy concerns. Stapling lets the server supply a recent signed response. Revocation is weak in practice when clients skip checks, use stale information or fail open on network failure; expiry alone does not address an emergency stolen key.\u003c/p>","refs":[{"sourceId":"src31","from":23,"to":23},{"sourceId":"src30","from":33,"to":36}]},{"sourceId":"src31","question":"Q13. Describe what happened in the 2011 DigiNotar incident, explain what it shows about the PKI trust model, and name one defence that was introduced as a result.   [LO4]","answerHtml":"\u003cp>Attackers compromised DigiNotar in 2011 and issued fraudulent certificates, including google.com, that chained to a then-trusted CA and were used for interception, especially affecting Iranian Gmail users. Genuine CA signatures did not mean the identity checks were honest. Vendors distrusted the CA. The incident illustrates concentrated trust in any broadly accepted issuer; Certificate Transparency logs provide public issuance visibility so domain owners can detect suspicious certificates, alongside stricter audits and root-store governance.\u003c/p>","refs":[{"sourceId":"src31","from":24,"to":24},{"sourceId":"src30","from":35,"to":36}]},{"sourceId":"src31","question":"Q14. In a TLS 1.3 handshake, identify which cryptographic primitive (key agreement, certificate, digital signature, MAC, or symmetric encryption) is responsible for each of the following: agreeing the session key, proving the server's identity, proving the server holds the certificate's private key, confirming the handshake was not altered, and protecting the application data.   [LO3]","answerHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Task\u003c/th>\u003cth>Primitive\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Agree shared secret/session key material\u003c/td>\u003ctd>Ephemeral ECDHE key agreement, then key derivation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bind server identity to key\u003c/td>\u003ctd>Validated X.509 certificate chain/PKI for intended name.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prove certificate private-key possession\u003c/td>\u003ctd>Digital signature in CertificateVerify.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Confirm handshake integrity/key possession\u003c/td>\u003ctd>HMAC-based Finished over the transcript with a derived finished key.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protect application data\u003c/td>\u003ctd>Symmetric AEAD: AES-GCM or ChaCha20-Poly1305.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>This is the certificate-authenticated TLS 1.3 path; certificate and other post-ServerHello handshake content are encrypted with derived handshake keys.\u003c/p>","refs":[{"sourceId":"src31","from":26,"to":26},{"sourceId":"src30","from":38,"to":39}]},{"sourceId":"src31","question":"Q15. Router R1 needs a certificate so it can authenticate IPsec peers. Put these steps in the correct order and explain each one: create the trustpoint, generate the RSA key pair, enrol with the CA, authenticate the CA. Explain why authentication must come before enrolment, and why revocation-check none should only be used in a lab.   [LO5]","answerHtml":"\u003cp>Correct order: \u003cstrong>generate RSA pair → create/configure trustpoint → authenticate CA → enrol\u003c/strong>. The router creates/retains its private key; the trustpoint names the CA/enrolment method and local key; authentication downloads the CA certificate and verifies its fingerprint independently; enrolment sends the CSR/public identity and obtains the router certificate. Authenticate first to establish the issuer’s trust before relying on enrolment results. \u003ccode>revocation-check none\u003c/code> disables emergency status rejection and is for the lecture’s lab only; production needs appropriate supported checking. Inspect the installed certificate afterward.\u003c/p>","refs":[{"sourceId":"src31","from":27,"to":27},{"sourceId":"src30","from":40,"to":41}]}]}},"sources":{"src01":{"filename":"IE3122_Week1_ModuleAndLectureIntro_Slides.pptx","type":"pptx","label":"Week1 ModuleAndLectureIntro Slides"},"src02":{"filename":"IE3122_Week1_NetworkingRevision_Slides.pptx","type":"pptx","label":"Week1 NetworkingRevision Slides"},"src03":{"filename":"IE3122_Week2_NetworkingAndSecurityRevision_Slides.pptx","type":"pptx","label":"Week2 NetworkingAndSecurityRevision Slides"},"src04":{"filename":"IE3122_Week2_NetworkingAndSecurityRevision_Tutorial.docx","type":"docx","label":"Week2 NetworkingAndSecurityRevision Tutorial"},"src05":{"filename":"IE3122_Week3_Layer2Attacks_Slides.pptx","type":"pptx","label":"Week3 Layer2Attacks Slides"},"src06":{"filename":"IE3122_Week3_Layer2Attacks_Tutorial.docx","type":"docx","label":"Week3 Layer2Attacks Tutorial"},"src07":{"filename":"IE3122_Week4_Layer3Attacks_Slides.pptx","type":"pptx","label":"Week4 Layer3Attacks Slides"},"src08":{"filename":"IE3122_Week4_Layer3Attacks_Tutorial.docx","type":"docx","label":"Week4 Layer3Attacks Tutorial"},"src09":{"filename":"IE3122_Week4_STPAttacks_Lab.docx","type":"docx","label":"Week4 STPAttacks Lab"},"src10":{"filename":"IE3122_Week4_STPAttacks_Slides.pptx","type":"pptx","label":"Week4 STPAttacks Slides"},"src11":{"filename":"IE3122_Week4_STPAttacks_Tutorial.docx","type":"docx","label":"Week4 STPAttacks Tutorial"},"src12":{"filename":"IE3122_Week5_RoutingAttacks_Slides_1.pptx","type":"pptx","label":"Week5 RoutingAttacks Slides"},"src13":{"filename":"IE3122_Week5_RoutingAttacks_Tutorial.docx","type":"docx","label":"Week5 RoutingAttacks Tutorial"},"src14":{"filename":"IE3122_Week6_Layer4Attacks_Slides.pptx","type":"pptx","label":"Week6 Layer4Attacks Slides"},"src15":{"filename":"IE3122_Week6_Layer4Attacks_Tutorial.docx","type":"docx","label":"Week6 Layer4Attacks Tutorial"},"src16":{"filename":"IE3122_Week7_FirewallFundamentals_Slides.pptx","type":"pptx","label":"Week7 FirewallFundamentals Slides"},"src17":{"filename":"IE3122_Week7_FirewallFundamentals_Tutorial.docx","type":"docx","label":"Week7 FirewallFundamentals Tutorial"},"src18":{"filename":"IE3122_Week7_FirewallPlacementACLs_Slides.pptx","type":"pptx","label":"Week7 FirewallPlacementACLs Slides"},"src19":{"filename":"IE3122_Week7_FirewallPlacementACLs_Tutorial.docx","type":"docx","label":"Week7 FirewallPlacementACLs Tutorial"},"src20":{"filename":"IE3122_Week9_VPNFoundations_Slides.pptx","type":"pptx","label":"Week9 VPNFoundations Slides"},"src21":{"filename":"IE3122_Week9_VPNFoundations_Tutorial.docx","type":"docx","label":"Week9 VPNFoundations Tutorial"},"src22":{"filename":"IE3122_Week9_VPNTechnologies_Slides.pptx","type":"pptx","label":"Week9 VPNTechnologies Slides"},"src23":{"filename":"IE3122_Week9_VPNTechnologies_Tutorial.docx","type":"docx","label":"Week9 VPNTechnologies Tutorial"},"src24":{"filename":"IE3122_Week10_AAADeploymentConfig_Slides.pptx","type":"pptx","label":"Week10 AAADeploymentConfig Slides"},"src25":{"filename":"IE3122_Week10_AAADeploymentConfig_Tutorial.docx","type":"docx","label":"Week10 AAADeploymentConfig Tutorial"},"src26":{"filename":"IE3122_Week10_AAAFoundations_Slides.pptx","type":"pptx","label":"Week10 AAAFoundations Slides"},"src27":{"filename":"IE3122_Week10_AAAFoundations_Tutorial.docx","type":"docx","label":"Week10 AAAFoundations Tutorial"},"src28":{"filename":"IE3122_Week12_CryptographyFundamentals_Slides.pptx","type":"pptx","label":"Week12 CryptographyFundamentals Slides"},"src29":{"filename":"IE3122_Week12_CryptographyFundamentals_Tutorial.docx","type":"docx","label":"Week12 CryptographyFundamentals Tutorial"},"src30":{"filename":"IE3122_Week12_IntegritySignaturesPKI_Slides.pptx","type":"pptx","label":"Week12 IntegritySignaturesPKI Slides"},"src31":{"filename":"IE3122_Week12_IntegritySignaturesPKI_Tutorial.docx","type":"docx","label":"Week12 IntegritySignaturesPKI Tutorial"}},"calculationQuestions":{"m02":[{"id":"calc-subnet","prompt":"For 192.168.1.77/26, what is the network address?","options":["192.168.1.64","192.168.1.0","192.168.1.128"],"answer":0,"explanation":"A /26 has blocks of 64. Address 77 is in the 64–127 block; its network is .64."}],"m06":[{"id":"calc-stp","prompt":"Direct path costs 19; an indirect path costs 4 + 19. Which wins?","options":["Direct, cost 19","Indirect, because one link is faster","Both must forward"],"answer":0,"explanation":"Compare summed path costs: 19 \u003c 23."}],"m15":[{"id":"calc-keys","prompt":"How many unique symmetric pairwise keys do 200 users need?","options":["200","39,800","19,900"],"answer":2,"explanation":"200 × 199 counts each pair twice; divide by 2 to obtain 19,900."},{"id":"calc-dh","prompt":"For p=13, g=6, a=5 and b=4, what shared DH value results?","options":["2","9","3"],"answer":2,"explanation":"A=2, B=9; 9^5 mod 13 = 2^4 mod 13 = 3."},{"id":"calc-caesar","prompt":"NETWORK encrypted with Caesar shift +5 is…","options":["SJYBTWP","QHWZRUN","NETWORK"],"answer":0,"explanation":"N→S, E→J, T→Y, W→B, O→T, R→W, K→P."}],"m16":[{"id":"calc-hash","prompt":"What is the approximate generic collision work for ideal SHA-256?","options":["2^256","2^128","256 operations"],"answer":1,"explanation":"The birthday bound gives about 2^(n/2) = 2^128 for any-pair collisions."}]}}</script>
<script>/* Guided conceptual simulations, grounded in the supplied IE3122 material. */
const TOPICS = [
 ['m02','Networking foundations','01','Week 1','Packet ekata letter ekak wage layers ekathu wenawa.','subnet'],
 ['m03','Security & threat thinking','02','Week 2','Watina de → durwalakama → attack → balapema → control.','risk'],
 ['m04','Layer 2 attacks','03','Week 3','MAC eka identity card ekak newei. Switch ekata kiyapu de verify karanna.','cam'],
 ['m06','STP & switching loops','04','Week 4','Lowest ID = root. Lowest total cost = root port.','stp'],
 ['m05','Layer 3 attacks','05','Week 4','IP address eka claim ekak; ICMP eka message ekak. Dekama verify/limit karanna.','amplification'],
 ['m07','Routing attacks','06','Week 5','Trusted neighbour kenek kiwwath route eka hari kiyala guarantee ne.','routing'],
 ['m08','TCP & UDP attacks','07','Week 6','SYN = seat reserve. ACK enakan seat eka hold wenawa.','syn'],
 ['m09','Firewalls, IDS & IPS','08','Week 7','Gatekeeper, CCTV, security guard — roles thunak.','firewall'],
 ['m10','ACLs, zones & DMZ','09','Week 7','Top to bottom. First match. No match = deny.','acl'],
 ['m11','VPN foundations','10','Week 9','Tunnel = envelope. Secure VPN = locked, verified envelope.','vpn'],
 ['m12','IPsec & TLS VPN','11','Week 9','AH verifies. ESP can encrypt. IKE agrees protection.','ipsec'],
 ['m13','AAA foundations','12','Week 10','Who are you? What can you do? What did you do?','aaa'],
 ['m14','AAA deployment','13','Week 10','Server unavailable nam fallback. Wrong password nam reject.','fallback'],
 ['m15','Cryptography','14','Week 12','Public method + secret key. Fast data encryption + trusted key exchange.','caesar'],
 ['m16','Integrity, signatures & PKI','15','Week 12','Hash = fingerprint. HMAC = shared stamp. Signature = personal proof.','hash']
].map(([id,title,number,week,hook,calculator])=>({id,title,number,week,hook,calculator}));

const SCENARIOS=[];
// Every tuple is a visible packet/state transition, not a live network action.
function add(topic,id,title,labels,hook,weak,attack,defence,protectedSteps,limit,quiz,impact='C / I / A'){
 SCENARIOS.push({topic,id,title,labels,hook,weak,attack,defence,protected:protectedSteps,limit,quiz,impact});
}
const S=(title,text,from=0,to=1,packet='Packet',state='')=>({title,text,from,to,packet,state});
const Q=(prompt,options,answer,explanation)=>({prompt,options,answer,explanation});

add('m02','packet','Follow a packet to a remote network',['Your PC','Gateway','Remote server','Wrong next hop'],
 'IP eka final address; MAC eka next bus stop.','A host must distinguish local delivery from routing.',
 [S('Compare the destination','The destination is outside the local subnet. The PC must use its default gateway.',0,1,'Subnet check','Destination: remote'),S('Resolve the next hop','ARP resolves the gateway IP to its MAC. Do not ARP for a remote Internet host.',0,1,'ARP request','ARP entry: gateway IP → gateway MAC'),S('Forward to the server','The Ethernet destination changes at each routed hop; the remote destination IP remains the same, absent translation.',1,2,'IP packet','L2 changes; L3 destination remains')],
 'Choose the correct next hop',
 [S('Local or remote?','Use IP AND mask to compare network addresses.',0,1,'Subnet check'),S('Use the gateway MAC','Send a frame to the gateway while retaining the remote destination IP.',0,1,'Frame'),S('Deliver and decapsulate','The receiver removes Ethernet, IP and transport wrappers.',1,2,'Application data')],
 'ARP is a local IPv4 resolution mechanism. NAT can change IP addresses at a translating boundary.',
 Q('For a remote server, whose MAC goes in the first Ethernet frame?',['Remote server MAC','Default gateway MAC','DNS server MAC'],1,'The frame reaches the local gateway; the IP packet still names the remote server.'),'Correct delivery');

add('m02','dora','DHCP: DORA in four steps',['New laptop','DHCP server','Configured laptop','Rogue server'],
 'Discover → Offer → Request → ACK. D-O-R-A.','A new client needs an address, mask, gateway and DNS settings.',
 [S('Discover','Client broadcasts to discover available DHCP servers.',0,1,'Discover'),S('Offer','Server offers a lease and network settings.',1,0,'Offer'),S('Request','Client requests the chosen offer.',0,1,'Request'),S('Acknowledge','Server confirms the lease; the client can use the configuration.',1,2,'ACK','Lease: IP + mask + gateway + DNS')],
 'DHCP snooping trust boundary',
 [S('Client asks normally','Client requests are permitted on an untrusted user port, subject to limits.',0,1,'Discover'),S('Rogue reply arrives','An Offer from a user-facing untrusted port is rejected.',3,1,'Blocked Offer','Untrusted server reply: DROP'),S('Real server replies','A legitimate Offer/ACK arrives from the trusted server path.',1,2,'Valid lease','Trusted server reply: ALLOW')],
 'Snooping trust must follow the legitimate server path. Rate limits, not trust flags alone, address request floods.',
 Q('What does the final A stand for?',['Authentication','Acknowledgement','Address translation'],1,'ACK confirms the chosen lease.'),'Availability / integrity');

add('m02','switch','Switch learning and ARP',['Host A','Switch','Host B','Other VLAN'],
 'Learn SOURCE; look up DESTINATION.','A switch learns addresses from source fields; ARP learns local IP-to-MAC mappings.',
 [S('Learn the sender','The switch learns Host A source MAC on the ingress port.',0,1,'Ethernet frame','CAM: A → port 1'),S('Unknown destination','If B is unknown, flood eligible ports in this VLAN, excluding ingress.',1,2,'Unknown unicast','Flood boundary: this VLAN'),S('Learn the reply','B replies; the switch learns B and future A→B frames use that port.',2,1,'Reply','CAM: A → p1; B → p2')],
 'VLAN boundaries and verified identities',
 [S('Keep broadcasts local','VLAN boundaries prevent ordinary L2 flooding into other VLANs.',0,1,'Broadcast','Same VLAN only'),S('Route between VLANs','Cross-VLAN access requires a router and its policy.',1,2,'Permitted route'),S('Authenticate devices','802.1X strengthens admission beyond a spoofable MAC address.',3,1,'Credential check','Address ≠ identity')],
 'A VLAN is neither encryption nor complete access control without correct trunks and routing policy.',
 Q('Which address is learned from a received frame?',['Source MAC','Destination MAC','Remote IP'],0,'The switch associates the frame source MAC with its incoming port.'),'Correct delivery');

add('m03','threat-model','Threat model: protect student records',['Records server','Access boundary','Student records','Threat actor'],
 'Asset → threat → weakness → risk → controls.','An exposed, unpatched server stores valuable records.',
 [S('Identify the asset','Student records require confidentiality, integrity and availability.',0,2,'Asset','Value: sensitive records'),S('Find the weakness','A known unpatched service is exposed to an attacker.',3,1,'Exploit attempt','Vulnerability: unpatched service'),S('Connect the impact','Successful exploitation can steal records, modify them or interrupt service.',1,2,'Unauthorised access','Impact: C + I + A')],
 'Patch + least privilege + MFA + monitoring + backup',
 [S('Reduce entry risk','Patch the weakness and restrict the exposed service.',3,1,'Blocked attempt','Likelihood reduced'),S('Limit the damage','Separate privileges and protect administrator login.',1,2,'Authorised access','Blast radius reduced'),S('Detect and recover','Monitor activity and restore from tested protected backups if needed.',0,2,'Recovery','Impact reduced')],
 'Risk ratings depend on actual exposure and business impact; this is a qualitative decision walkthrough.',
 Q('Which is the vulnerability?',['Student records','Unpatched software','Financial loss'],1,'The asset is the records; the weakness is unpatched software; loss is an impact.'));

add('m03','malware','Virus, worm, Trojan & ransomware',['User/device','Execution boundary','Other systems','Malware'],
 'Virus attaches. Worm spreads itself. Trojan pretends. Ransomware is the damage.',
 'Different propagation methods need different controls.',
 [S('Entry','A Trojan disguises itself as useful software; a virus attaches to a host file.',3,0,'Untrusted file'),S('Spread','A worm can self-propagate through vulnerable services, without users copying infected files.',0,2,'Self-spread','Propagation ≠ payload'),S('Payload','Ransomware encrypts/extorts; spyware/keyloggers collect data; bots receive remote commands; rootkits hide.',3,2,'Malicious action','Categories can overlap')],
 'Patch, segment, allowlist and keep isolated backups',
 [S('Block unsafe execution','Trusted sources, allowlisting and endpoint controls reduce initial execution.',3,1,'Blocked file'),S('Limit propagation','Patch network services and segment systems.',1,2,'Contained traffic'),S('Recover','Restore verified clean data from protected backups after containment.',0,2,'Clean recovery')],
 'Backups address recovery, not theft of data. A single malware sample can belong to multiple categories.',
 Q('Which can spread itself across a network?',['Worm','Only a virus','Only adware'],0,'Self-propagation is the distinguishing worm behaviour.'));

add('m03','social','Phishing, pretexting and baiting',['Employee','Verification desk','Account/data','Impersonator'],
 'Urgent kiyala verification skip karanna epa.','People may trust an urgent message, identity claim or attractive offer.',
 [S('Create a story','A caller pretends to be a manager needing an urgent password reset: pretexting/vishing.',3,0,'Urgent request'),S('Exploit trust','Phishing uses deceptive messages; spear phishing targets someone; whaling targets leaders; baiting offers a lure.',0,1,'Verification skipped'),S('Gain access','A reset or credential disclosure gives the attacker control.',3,2,'Stolen credentials')],
 'Independent verification + MFA + training',
 [S('Pause the request','Do not let urgency override the reset policy.',3,0,'Unverified claim'),S('Verify independently','Call an established contact number, not one supplied by the caller.',0,1,'Known contact'),S('Enforce access controls','Reject unverified resets and use appropriate MFA.',1,2,'Verified identity','No unauthorised reset')],
 'SMS and ordinary OTP can still be phished; MFA does not replace careful recovery procedures.',
 Q('An invented executive story is primarily what?',['Pretexting','ARP poisoning','Packet fragmentation'],0,'The attacker manufactures a plausible identity and situation.'));

add('m03','ddos','Reconnaissance, DoS and DDoS',['Legitimate user','Service boundary','Server','Botnet'],
 'One tap overload = DoS; many taps together = DDoS.','Bandwidth, CPU and connection state are finite.',
 [S('Reconnaissance','An attacker discovers live services before selecting an attack.',3,1,'Probes'),S('Overload','Many distributed bots send traffic at the same service.',3,2,'Distributed flood','Demand exceeds capacity'),S('Legitimate user loses access','The user competes for already exhausted resources.',0,2,'Timeout','Availability lost')],
 'Layered limits + upstream filtering + resilience',
 [S('Reduce exposed services','Close unnecessary services and limit costly operations.',3,1,'Filtered requests'),S('Filter upstream','Upstream scrubbing can reduce volume before the access link fills.',3,1,'Scrubbed flood'),S('Preserve service','Monitor, distribute load and plan recovery.',0,2,'Valid request','Availability improved')],
 'Blocking one source is insufficient for DDoS. A local firewall cannot restore an already saturated upstream link.',
 Q('Why is DDoS harder to block than one-source DoS?',['It always encrypts packets','It uses distributed sources','It needs no network'],1,'Many sources defeat a simple single-address block.'),'Availability');

add('m04','mac-spoof','MAC spoofing',['Real PC','Access switch','Protected LAN','Cloned MAC'],
 'Same number plate ≠ same driver.','A MAC address is a changeable claim, not proof of identity.',
 [S('Copy an allowed address','The attacker learns or copies a permitted device MAC.',3,0,'Copied MAC'),S('Impersonate','When the legitimate device is absent, the copied MAC passes a MAC-only rule.',3,1,'Allowed MAC','Sticky MAC matches'),S('Gain access','The switch cannot distinguish the device using only that address.',1,2,'Unauthorised device')],
 '802.1X credentials/certificates plus port security',
 [S('Claim the MAC','The attacker presents the allowed address.',3,1,'Copied MAC'),S('Demand identity proof','802.1X requires valid credentials or a certificate.',3,1,'Failed authentication','Admission denied'),S('Allow the real user','The genuine endpoint proves its identity.',0,2,'Authenticated access')],
 'Sticky learning still helps manage ports, but it does not defeat copying an allowed MAC.',
 Q('Why can sticky MAC fail here?',['MAC addresses are spoofable','It checks public-key signatures','It encrypts all frames'],0,'An attacker can copy the allowed address.'),'Confidentiality / integrity');

add('m04','cam-flood','CAM table flooding',['Legitimate PC','Switch CAM','Other same-VLAN PC','Fake MAC sources'],
 'Address book eka fake names walin pirunama unknown letters flood wenawa.','The MAC learning table has finite capacity.',

const CRYPTO=[
 ['classical','Caesar and Vigenere','Letters shift karala pattern eka hide karanawa; key space eka podi.','Classical ciphers retain exploitable structure.','Caesar has only 25 nontrivial shifts; repeated Vigenere keys allow period/frequency analysis.','Use the calculators to learn the arithmetic; use vetted modern cryptography for real protection.','These are educational ciphers, not secure alternatives to AES or modern stream ciphers.'],
 ['ecb','ECB, CBC, CTR, GCM & XTS','Same blocks same picture → ECB leak.','The mode controls how a block cipher protects more than one block.','ECB repeats reveal patterns. CBC chains blocks; CTR creates a keystream; GCM adds authentication; XTS suits storage sectors.','Choose a mode appropriate to the data and authenticate it where required.','CBC needs an appropriate IV and secure authentication; CTR/GCM require nonce uniqueness. XTS does not authenticate data.'],
 ['keystream','Keystream reuse and WEP','Same mask eka twice use kalama mask eka cancel wenawa.','XOR with the same keystream twice leaks plaintext relationships.','C1=P1 XOR K; C2=P2 XOR K; C1 XOR C2=P1 XOR P2. Known P1 reveals P2.','Never reuse a nonce/keystream with a key; use suitable AEAD.','WEP has short-IV and RC4-design problems. A truly random one-time pad must be message-length and used only once.'],
 ['dh-mitm','Diffie–Hellman and MITM','Secret agree karanna puluwan; opposite side kawda kiyala DH thaniyama danne ne.','Unauthenticated public key shares can be substituted.','An attacker agrees one secret with Alice and another with Bob, relaying messages between them.','Authenticate ephemeral DH/ECDH shares using trusted signatures/certificates or a PSK.','Ephemeral exchange plus erased secrets can provide forward secrecy; DH itself is key agreement, not encryption.'],
 ['hybrid','Symmetric, asymmetric and hybrid','Asymmetric key eka arrange karanawa; symmetric data eka carry karanawa.','Symmetric key distribution is hard; asymmetric operations are too costly for bulk traffic.','A pairwise symmetric network needs n(n−1)/2 secrets; public keys still need identity binding.','Use authenticated asymmetric agreement, then symmetric AEAD for bulk data.','RSA has message-size and performance limits; ECC offers smaller keys for comparable classical security.']
];
for(const [id,title,hook,weak,effect,control,limit] of CRYPTO){
 add('m15',id,title,['Alice','Cipher / key exchange','Bob','Observer / MITM'],hook,weak,
 [S('Start with the design',weak,0,1,'Input / key'),S('See the weakness',effect,1,3,'Observable result'),S('Consider what leaks','A strong primitive does not repair an inappropriate mode, reused nonce or untrusted identity.',3,2,'Lost assurance')],control,
 [S('Match the requirement',control,0,1,'Chosen construction'),S('Protect keys and identity','Use appropriate keys, authenticated identity and correct nonce/IV handling.',0,2,'Authenticated exchange'),S('Protect the data','Use the selected construction and reject invalid authentication tags.',1,2,'Protected data')],limit,

}

<script>const labInputs={};

<script>'use strict';
const COURSE=JSON.parse(document.getElementById('course-data').textContent);

let storageOK=true,activeTopic=TOPICS[0],activeTab='sim',currentScenario=null,currentCalc='',step=0,protectedMode=false,playTimer=null,recallIndex=0,recallAnswer=null,search='',toastTimer;

function normalizeProgress(raw){if(!raw||raw.version!==1||typeof raw.confidence!=='object'||Array.isArray(raw.confidence)||!raw.confidence)throw Error('This is not a valid Network Security Lab progress file.');const out={version:1,confidence:{},notes:{},hints:raw.hints!==false};for(const [k,v] of Object.entries(raw.confidence)){if(validQuestions.has(k)&&typeof v==='boolean')out.confidence[k]=v}if(raw.notes&&typeof raw.notes==='object'&&!Array.isArray(raw.notes)){for(const t of TOPICS){if(typeof raw.notes[t.id]==='string')out.notes[t.id]=raw.notes[t.id].slice(0,5000)}}return out}

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));storageOK=true}catch(e){storageOK=false}paintProgress()}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4500)}
function pause(){if(playTimer){clearInterval(playTimer);playTimer=null}const b=document.querySelector('[data-action="play"]');if(b)b.textContent='▷ Auto-play'}
function paintProgress(){const n=Object.values(progress.confidence).filter(Boolean).length,total=validQuestions.size;document.getElementById('progressText').textContent=Math.round(n/total*100)+'%';document.getElementById('progressBar').style.width=n/total*100+'%';document.getElementById('progressDetail').textContent=storageOK?`${n} / ${total} answers checked · saved here`:'Storage unavailable — export before closing';}

function closeMenu(){document.getElementById('rail').classList.remove('open');document.getElementById('scrim').classList.remove('visible');document.getElementById('menu').setAttribute('aria-expanded','false')}

function route(){pause();++calcRunToken;const parts=location.hash.replace(/^#\/?/,'').split('/');const next=TOPICS.find(t=>t.id===parts[0])||TOPICS[0];if(next.id!==activeTopic.id){recallIndex=0;recallAnswer=null}activeTopic=next;activeTab=['lab','sim','calc','recall','notes'].includes(parts[1])?parts[1]:'lab';step=0;const sims=SCENARIOS.filter(s=>s.topic===activeTopic.id);currentScenario=sims.find(s=>s.id===parts[2])||sims[0];document.title=`${activeTopic.title} · Network Security Lab`;document.getElementById('main').innerHTML=`<section class="lesson-heading"><div><div class="eyebrow">LESSON ${activeTopic.number} / 15 · ${activeTopic.week}</div><h1>${esc(activeTopic.title)}</h1><p class="singlish">${esc(activeTopic.hook)}</p><p>Start with a real situation. Change one condition. Explain the result.</p></div><div class="lesson-number" aria-hidden="true">${activeTopic.number}</div></section><nav class="tabs" aria-label="Learning mode">${[['lab','01 · Real-world lab'],['sim','02 · Watch & compare'],['calc','03 · Calculate'],['recall','04 · Recall'],['notes','05 · Notes & tutorials']].map(([tab,label])=>`<a href="#${activeTopic.id}/${tab}" class="${activeTab===tab?'active':''}" ${activeTab===tab?'aria-current="page"':''}>${label}</a>`).join('')}</nav><div id="view">${activeTab==='lab'?realLabView(activeTopic):activeTab==='sim'?simulationView():activeTab==='calc'?calculatorView(activeTopic,parts[2]):activeTab==='recall'?recallView():notesView()}</div>${topicBottom()}`;nav();setHints();closeMenu();if(activeTab==='sim')paintStage();if(activeTab==='lab')paintLab();document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}

function simulationView(){const s=currentScenario,sims=SCENARIOS.filter(x=>x.topic===s.topic);return `<div class="sim-layout"><div><section class="card"><div class="sim-top"><label class="field-label" for="scenarioSelect">Choose a walkthrough</label><div class="sim-select-row"><select id="scenarioSelect">${sims.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><span class="scenario-count">${sims.indexOf(s)+1} / ${sims.length}</span></div><p class="walkthrough-intro">This is a guided mechanism, not a physical wiring diagram. Follow the named actors and read each step. For adjustable device behavior, open the Real-world lab.</p><div class="mode-switch" role="group" aria-label="Compare protection"><button class="${!protectedMode?'selected bad':''}" data-action="unprotected" aria-pressed="${!protectedMode}">Mechanism / without control</button><button class="${protectedMode?'selected good':''}" data-action="protected" aria-pressed="${protectedMode}">With defence / verified</button></div></div><div id="stage" class="stage ${protectedMode?'protected':''}"></div><div class="step-area"><div id="stepCounter" class="step-counter"></div><div id="stepText" aria-live="polite"></div><div id="stepProgress" class="step-progress"></div><div class="controls"><button data-action="prev" aria-label="Previous simulation step">← Back</button><button data-action="next" class="primary">Next step →</button><button data-action="restart" aria-label="Restart simulation">↺ Restart</button><button data-action="play" class="play">▷ Auto-play</button></div><details class="timeline-log"><summary>Read the whole sequence</summary><ol id="sequenceLog"></ol></details></div></section><div class="under-sim"><section class="card explain-card"><div class="eyebrow">THE WEAKNESS / REQUIREMENT</div><p>${esc(s.weak)}</p></section><section class="card explain-card"><div class="eyebrow">THE CONTROL & WHY</div><p>${esc(s.defence)}</p></section></div></div><aside class="sim-aside"><section class="memory-card"><div class="eyebrow">MAKE IT STICK</div><h3 class="singlish">${esc(s.hook)}</h3><p>Say the chain aloud: <strong>weakness → mechanism → impact → defence → limitation.</strong></p><a class="action-link" href="#${s.topic}/recall">Try a recall question →</a></section><section class="side-card"><h3>What is affected?</h3><p>${esc(s.impact)}</p></section><section class="side-card warning"><h3>The exam distinction</h3><p>${esc(s.limit)}</p></section>${s.refs?`<section class="side-card"><h3>Lecture reference</h3><p>${esc(sourceRefs(s.refs))}</p></section>`:""}</aside></div>`}
function networkSVG(s,frame){const nodes=[[120,100],[370,100],[620,100],[370,260]],from=nodes[frame.from],to=nodes[frame.to],color=protectedMode?'#2d7563':'#ce6c47';const blocked=protectedMode&&/drop|reject|block|disable|fail|mismatch|unavailable/i.test(frame.title+' '+frame.packet+' '+frame.state);const end=blocked?[(from[0]+to[0])/2,(from[1]+to[1])/2]:to;const path=`M ${from[0]} ${from[1]} L ${end[0]} ${end[1]}`;const animate=!matchMedia('(prefers-reduced-motion: reduce)').matches;return `<svg viewBox="0 0 740 320" role="img" aria-label="${esc(frame.title+'. '+s.labels[frame.from]+' to '+s.labels[frame.to]+'. '+frame.text)}"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="${color}"/></marker></defs><path class="network-line" d="M120 100 H620 M370 100 V260 M120 100 L370 260 L620 100"/><path class="packet-line" d="${path}" marker-end="url(#arrowhead)" opacity=".9"/>${nodes.map(([x,y],i)=>`<g transform="translate(${x-81},${y-42})"><rect width="162" height="84" rx="12" class="node-box ${frame.from===i||frame.to===i?'current':''}"/><g class="node-icon" transform="translate(69,10)">${i===1?'<rect x="0" y="1" width="24" height="17" rx="3"/><path d="M5 7h3m4 0h3m4 0h1M5 13h15"/>':i===3?'<path d="M12 0 24 21H0Z"/><path d="M12 7v6m0 3v2"/>':'<rect x="0" y="0" width="25" height="17" rx="2"/><path d="M12 17v5m-6 0h12"/>'}</g><text x="81" y="48" text-anchor="middle" class="node-title">${esc(s.labels[i])}</text><text x="81" y="66" text-anchor="middle" class="node-role">${i===3?'CONDITION / OTHER ACTOR':i===1?'BOUNDARY / PROCESS':i===0?'SOURCE':'DESTINATION'}</text></g>`).join('')}<circle r="6" fill="${color}" stroke="#fff" stroke-width="2">${animate?`<animateMotion dur="1.9s" repeatCount="indefinite" path="${path}"/>`:''}${!animate?`<set attributeName="cx" to="${end[0]}"/><set attributeName="cy" to="${end[1]}"/>`:''}</circle>${blocked?`<g transform="translate(${end[0]},${end[1]})"><circle r="10" fill="#fff" stroke="${color}" stroke-width="2"/><path d="M-4 -4L4 4M-4 4L4 -4" stroke="${color}" stroke-width="2"/></g>`:''}</svg>`}
function paintStage(){const s=currentScenario,frames=protectedMode?s.protected:s.attack;step=Math.max(0,Math.min(step,frames.length-1));const frame=frames[step];const stage=document.getElementById('stage');if(!stage)return;stage.className='stage '+(protectedMode?'protected':'');stage.innerHTML=`<span class="stage-label">${protectedMode?'PROTECTED / VERIFIED FLOW':'FOLLOW THE MECHANISM'}</span>${networkSVG(s,frame)}<div class="stage-caption"><span>Moving item: <strong>${esc(frame.packet)}</strong></span><span>${esc(frame.state||'Illustrative flow')}</span></div>`;document.getElementById('stepCounter').textContent=`STEP ${step+1} OF ${frames.length}`;document.getElementById('stepText').innerHTML=`<h2>${esc(frame.title)}</h2><p>${esc(frame.text)}</p>`;document.getElementById('stepProgress').innerHTML=frames.map((_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('');document.querySelector('[data-action="prev"]').disabled=step===0;document.querySelector('[data-action="next"]').disabled=step===frames.length-1;document.getElementById('sequenceLog').innerHTML=frames.map(x=>`<li><strong>${esc(x.title)}.</strong> ${esc(x.text)}</li>`).join('');if(step===frames.length-1)pause();}

r="Weakness → mechanism → impact → defence → limitation">${esc(progress.notes[activeTopic.id]||'')}</textarea><p style="margin-top:9px">Saved in this browser. Use Export progress to keep a backup.</p></section></aside></div>`}

 }});
document.addEventListener('submit',event=>{if(event.target.id==='calcForm'){event.preventDefault();runCalculation(event.target)}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='scenarioSelect'){location.hash=`${activeTopic.id}/sim/${el.value}`}if(el.id==='calcSelect'){const [topic,id]=el.value.split('/');location.hash=`${topic}/calc/${id}`}if(el.id==='language'){progress.hints=el.checked;setHints();save()}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='search'){search=el.value.toLowerCase().trim();nav()}if(el.id==='myRecall'){progress.notes[activeTopic.id]=el.value;save()}if(el.closest('#calcForm')){++calcRunToken;const box=document.getElementById('calcResult');if(box)box.innerHTML='<div class="eyebrow">INPUTS CHANGED</div><h2>Update the working.</h2><p>Press “Show the working” to calculate with your new values.</p>'}});
document.getElementById('menu').addEventListener('click',()=>{const open=!document.getElementById('rail').classList.contains('open');document.getElementById('rail').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('visible',open);document.getElementById('menu').setAttribute('aria-expanded',String(open))});
document.getElementById('scrim').addEventListener('click',closeMenu);
document.getElementById('skip').addEventListener('click',e=>{e.preventDefault();document.getElementById('main').focus()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.getElementById('exportProgress').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NS_Simulation_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Progress exported. Keep this file as a backup.')});
document.getElementById('importProgress').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('Progress file is too large.');const restored=normalizeProgress(JSON.parse(await f.text()));progress=restored;save();recallAnswer=null;route();toast('Progress imported into this browser.')}catch(error){toast(error.message||'Could not read this progress file.')}finally{e.target.value=''}});
window.addEventListener('hashchange',route);
route();
if(!storageOK)toast('Browser storage is unavailable or previous progress could not be read. Export your progress before closing.');
</script>
</body></html>
