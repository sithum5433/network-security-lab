3ctd>OSPF\u003c/td>\u003ctd>Link-state\u003c/td>\u003ctd>Summed bandwidth-derived cost; topology per area\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EIGRP\u003c/td>\u003ctd>Advanced distance-vector\u003c/td>\u003ctd>Composite bandwidth and delay by default; DUAL convergence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BGP\u003c/td>\u003ctd>Path-vector\u003c/td>\u003ctd>Ordered attributes, including local preference and AS-path length; policy driven\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","refs":[{"sourceId":"src13","from":8,"to":8}]},{"sourceId":"src13","question":"Q2. Describe the message types OSPF uses to form and maintain a neighbor relationship, and explain which specific message type MD5 authentication actually has to protect.   [LO1]","answerHtml":"\u003cp>Hello discovers/maintains neighbours; DBD summarises the LSDB; LSR requests missing detail; LSU carries LSAs; LSAck acknowledges delivery. Authentication must protect Hello before adjacency is accepted, and it also authenticates the routing exchanges rather than protecting Hello alone.\u003c/p>","refs":[{"sourceId":"src13","from":9,"to":9}]},{"sourceId":"src13","question":"Q3. Explain why BGP's transport (TCP, port 179) is fundamentally different from the other three protocols covered this week, and what that difference means for how BGP's own authentication actually works.   [LO1]","answerHtml":"\u003cp>BGP uses a stateful TCP connection on port 179. RIP uses UDP 520; OSPF and EIGRP run directly over IP protocols 89 and 88. The lecture's BGP MD5 mechanism is a TCP-header option authenticating the session's TCP segments, not an OSPF/EIGRP-style routing-protocol field. It does not prove prefix ownership.\u003c/p>","refs":[{"sourceId":"src13","from":10,"to":10}]},{"sourceId":"src13","question":"Q4. Explain how Routing Table Poisoning works, and describe how the exact technique differs between a distance-vector protocol like RIP and a link-state protocol like OSPF.   [LO1]","answerHtml":"\u003cp>An attacker supplies a false attractive route and legitimate routers select/propagate it. RIP accepts neighbour distance claims, so a forged Response claiming a low hop count can poison reachability. OSPF uses a topology database, so the analogue is forged/rogue LSAs altering advertised links or reachability and causing SPF recalculation. OSPF is not a distance-vector protocol, even though false routing information can poison its resulting table.\u003c/p>","refs":[{"sourceId":"src13","from":12,"to":12}]},{"sourceId":"src13","question":"Q5. Distinguish Unauthorised Route Injection from Routing Table Poisoning. What does the attacker actually gain in each case that's different from the other?   [LO1]","answerHtml":"\u003cp>Poisoning focuses on incorrect information entering routing decisions; it need not establish a persistent adjacency, especially with RIP. Unauthorised injection focuses on a rogue continuing routing participant: it can learn topology and keep submitting updates. One rogue participant can repeatedly perform poisoning, so the attacks overlap.\u003c/p>","refs":[{"sourceId":"src13","from":13,"to":13}]},{"sourceId":"src13","question":"Q6. Explain why Route/Prefix Hijacking is considered a BGP-specific attack, using the 2008 YouTube hijack to illustrate your answer.   [LO1, LO3]","answerHtml":"\u003cp>Internet prefix ownership/origination is communicated between ASes through BGP. In 2008 AS17557 announced YouTube's 208.65.153.0/24 inside the legitimate 208.65.152.0/22, and AS3491 propagated it. The more-specific route attracted global traffic, causing an approximately two-hour outage. Internal protocols can misroute local reachability, but do not provide this inter-AS origin-claim role.\u003c/p>","refs":[{"sourceId":"src13","from":14,"to":14}]},{"sourceId":"src13","question":"Q7. Explain the difference between a blackhole outcome and a sinkhole outcome, and why both share the same underlying vulnerability as the injection and poisoning attacks.   [LO1]","answerHtml":"\u003cp>Blackhole means diverted traffic is dropped; sinkhole means it reaches a controlled receiver that can inspect, alter or optionally forward it. Both rely on accepting manipulated next-hop information, commonly through poisoning or rogue route injection. Their distinction is the outcome after misdirection.\u003c/p>","refs":[{"sourceId":"src13","from":15,"to":15}]},{"sourceId":"src13","question":"Q8. A network administrator asks you which single defense would do the most to reduce risk across this week's five attacks. Evaluate neighbor authentication (MD5) against this question, including what it does not protect against.   [LO2]","answerHtml":"\u003cp>Neighbour authentication is the strongest single broad control here: it rejects updates from devices without the shared key and reduces poisoning, rogue participation, blackhole/sinkhole setup and update flooding. It neither proves an authenticated advertisement true nor validates BGP origin ownership; compromised peers, key theft and volume still require filtering, passive interfaces, control-plane protection, monitoring and RPKI for BGP.\u003c/p>","refs":[{"sourceId":"src13","from":17,"to":17}]},{"sourceId":"src13","question":"Q9. Explain why this week's lab only covers OSPF and EIGRP authentication, not all four protocols covered in the lecture.   [LO2]","answerHtml":"\u003cp>The supplied lab chooses protocols with reliable MD5 implementation in Packet Tracer: OSPF and EIGRP. RIPv2 support varies with Packet Tracer version and BGP support is limited. RIP and BGP remain examinable theory; the simulator restriction is not a general protocol restriction.\u003c/p>","refs":[{"sourceId":"src13","from":18,"to":18}]},{"sourceId":"src13","question":"Q10. Compare how MD5 authentication is actually configured on OSPF versus EIGRP, and explain the practical trade-off between the two approaches.   [LO2]","answerHtml":"\u003cp>OSPF enables message-digest authentication per area or interface and places a message-digest key on the interface. EIGRP first defines a key chain and keys, then applies authentication mode MD5 and that chain to the interface. The lecture contrasts OSPF's simpler active-key setup with EIGRP's extra setup that enables multiple keys/lifetimes and planned rotation. Match keys/mode on both peers and verify adjacency.\u003c/p>\u003cp>Qualification: Cisco IOS also supports OSPF MD5 key rollover with multiple key IDs, so do not claim OSPF can never rotate without downtime. The tutorial comparison describes the supplied simplified configuration model.\u003c/p>","refs":[{"sourceId":"src13","from":19,"to":19}]},{"sourceId":"src13","question":"Q11. A colleague says: ‘We've applied a distribute-list on our OSPF network, so we're now confident no unauthorised route can propagate to other routers.’ Evaluate this claim. Is it accurate? Why or why not?   [LO2]","answerHtml":"\u003cp>The claim is inaccurate. OSPF routers in an area must share a consistent LSDB; an ordinary distribute-list limits which routes enter this router's routing table, not which LSAs flood to peers. Therefore other routers can still receive the information. Use suitable area-boundary filtering where applicable, plus authentication and a design suited to the required control.\u003c/p>","refs":[{"sourceId":"src13","from":20,"to":20}]},{"sourceId":"src13","question":"Q12. Explain what RPKI does, and why it directly addresses the specific weakness that caused the 2008 YouTube hijack.   [LO1, LO2]","answerHtml":"\u003cp>RPKI binds resource holders to address space using a certificate hierarchy; the holder signs a ROA authorising an origin AS and maximum prefix length. Origin validation would flag AS17557's YouTube origin as Invalid if a covering ROA authorised the real origin (lecture example AS36561), and an upstream configured to reject Invalid announcements would stop its propagation. It does not validate the full AS path, and NotFound means no covering ROA rather than proven legitimacy.\u003c/p>","refs":[{"sourceId":"src13","from":21,"to":21}]}]},"m08":{"id":"m08","title":"Layer 4 attacks and defences","sections":[{"title":"Transport duties, TCP guarantees and sockets","html":"\u003cp>Layer 4 delivers between processes: port-based multiplexing/demultiplexing identifies applications on a host, transport units carry application data, and checksums detect transmission errors. The lecture lists segmentation, multiplexing, demultiplexing, process-to-process delivery and error detection as common tasks. UDP preserves application datagrams rather than segmenting/reassembling a reliable byte stream; applications must respect message-size limits.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>TCP\u003c/th>\u003cth>UDP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Setup/state\u003c/td>\u003ctd>Three-way handshake; stateful\u003c/td>\u003ctd>No handshake or protocol connection state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reliability/order\u003c/td>\u003ctd>Acknowledgements, retransmissions and sequence-ordered byte delivery while connection operates\u003c/td>\u003ctd>Best-effort datagrams; no delivery or order guarantee\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flow control\u003c/td>\u003ctd>Receiver window protects receiver capacity\u003c/td>\u003ctd>None built into UDP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Congestion control\u003c/td>\u003ctd>Adjusts sending rate for path congestion\u003c/td>\u003ctd>None built into UDP; responsible applications implement suitable control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Header\u003c/td>\u003ctd>20 bytes minimum\u003c/td>\u003ctd>8 bytes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical uses\u003c/td>\u003ctd>Web, email, file transfer\u003c/td>\u003ctd>DNS, VoIP, games, live media; some modern applications add reliability above UDP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>A socket endpoint is an IP address plus port. A TCP connection is identified by source IP/port and destination IP/port (with protocol distinguishing transport namespaces). Many connections to one web server coexist because source endpoints differ. It is not required that every browser tab have its own TCP connection; tabs may share connections.\u003c/p>\u003cp>Checksum qualification: IPv4 UDP can use a zero checksum; IPv6 ordinarily requires one, with specific tunnel exceptions. A checksum is not a MAC. See \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8095.html\">RFC 8095, transport services\u003c/a>.\u003c/p>","refs":[{"sourceId":"src14","from":5,"to":8}]},{"title":"Handshake resources and orderly close","html":"\u003cpre>\u003ccode>Client → Server: SYN, seq=x\nServer → Client: SYN-ACK, seq=y, ack=x+1\nClient → Server: ACK, seq=x+1, ack=y+1\u003c/code>\u003c/pre>\u003cp>A conventional server receiving SYN allocates a half-open backlog entry/Transmission Control Block before it knows the source is reachable. It sends SYN-ACK and waits for final ACK or timeout. On completion, it becomes established and obtains the buffers/resources needed for data transfer. Exact allocation varies by operating system and SYN-cookie use; the examinable asymmetry is state allocated before return-path verification.\u003c/p>\u003cpre>\u003ccode>Active closer → Peer: FIN\nPeer → Active closer: ACK\nPeer → Active closer: FIN (when its own sending is finished)\nActive closer → Peer: ACK; enters TIME_WAIT\u003c/code>\u003c/pre>\u003cp>FIN closes one sending direction, so the peer may still send data before its FIN. ACK and FIN can combine. The active closer holds TIME_WAIT state to handle delayed duplicates and retransmit a final ACK when needed; traditional duration is twice maximum segment lifetime, with implementation-specific timing. Rapid connection churn can consume tuple/state resources even after application data has ended.\u003c/p>","refs":[{"sourceId":"src14","from":10,"to":12}]},{"title":"TCP reconnaissance: ports, hosts and OS","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Probe and interpretation\u003c/th>\u003cth>Value to attacker\u003c/th>\u003cth>Defence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TCP port scan\u003c/td>\u003ctd>SYN to many ports on one host: SYN-ACK suggests open, RST closed; silence/ICMP may indicate filtering. SYN scan avoids completing the connection; connect scan completes it.\u003c/td>\u003ctd>Find listening services for later attacks\u003c/td>\u003ctd>Disable unnecessary services; consistent filtering; detect vertical scans; rate-limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FIN / Xmas / NULL scan\u003c/td>\u003ctd>FIN only; FIN+PSH+URG; no flags. Some stacks RST closed ports but silently drop probes at open ports; firewalls/OS differ.\u003c/td>\u003ctd>May evade simplistic SYN-only rules; open-or-filtered ambiguity\u003c/td>\u003ctd>Stateful validation and scan detection; do not rely only on SYN flag signatures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TCP host sweep\u003c/td>\u003ctd>Probe one common port across many IP addresses; either SYN-ACK or RST proves a responding host.\u003c/td>\u003ctd>Discover live addresses despite blocked ICMP echo\u003c/td>\u003ctd>Detect horizontal scan patterns; segmentation; minimise exposure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OS fingerprinting\u003c/td>\u003ctd>Compare TTL, TCP windows/options and responses to unusual packets with known patterns.\u003c/td>\u003ctd>Choose likely OS/version-specific vulnerabilities\u003c/td>\u003ctd>Patch; optional stack normalisation; defence in depth\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Reconnaissance is not itself successful compromise. SYN scans remain visible to network monitoring even without a completed application connection. No response does not uniquely identify host/port state.\u003c/p>","refs":[{"sourceId":"src14","from":14,"to":20}]},{"title":"TCP hijacking, reset injection and SYN floods","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Mechanism and outcome\u003c/th>\u003cth>Defence and limitations\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TCP hijacking\u003c/td>\u003ctd>Spoof established flow identifiers and acceptable sequence numbers to inject data as a peer. On-path capture can reveal numbers; historical predictable ISNs made blind injection easier.\u003c/td>\u003ctd>TLS record authentication rejects forged content. Random ISNs reduce off-path guessing; monitor abnormal sequence/ACK behaviour.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TCP RST injection\u003c/td>\u003ctd>Forge an acceptable reset for a live flow to terminate it; disruption rather than content takeover.\u003c/td>\u003ctd>Random ISNs and stronger TCP reset validation make blind attacks harder; monitor resets and reconnect where appropriate. TLS does not authenticate RST.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TCP SYN flood\u003c/td>\u003ctd>Many SYNs without final ACK fill half-open backlog faster than timeout releases it, often with spoofed sources. New clients cannot connect.\u003c/td>\u003ctd>SYN cookies encode recoverable state in SYN-ACK sequence values until ACK returns. Backlog/timeout tuning only increases tolerance. SYN-rate filtering and upstream DDoS mitigation address remaining processing/link limits.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>RST qualification: the lecture describes the older “in-window reset” model. RFC 5961 strengthens it: an exact expected sequence can reset; an in-window non-exact value triggers a challenge ACK. See \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5961.html\">RFC 5961\u003c/a>. TLS cannot stop an otherwise acceptable forged TCP reset because TCP headers are outside its record authentication. IPsec or TCP-level authentication may protect that layer when correctly deployed.\u003c/p>","refs":[{"sourceId":"src14","from":21,"to":26}]},{"title":"UDP: four attacks from a minimal protocol","html":"\u003cp>UDP sends immediately, without setup, retransmission, ordering, receiver flow control or built-in congestion control. A high-rate sender can cheaply generate traffic and spoof source addresses unless the network filters them. The victim still spends bandwidth, processing and sometimes ICMP response work.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Mechanism / response\u003c/th>\u003cth>Mitigation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>UDP port scan\u003c/td>\u003ctd>Many ports on one host. ICMP Port Unreachable normally indicates closed; a service-specific reply indicates open; silence may mean open, filtered, loss or response throttling.\u003c/td>\u003ctd>Minimise exposed UDP services; detect scans; rate-limit ICMP responses while preserving necessary network functions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UDP host sweep\u003c/td>\u003ctd>Probe one service across many IPs; application replies or ICMP errors reveal live hosts even when ICMP echo is blocked.\u003c/td>\u003ctd>Horizontal scan detection, segmentation, exposure reduction and rate limits.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UDP bomb\u003c/td>\u003ctd>Malformed length/header relationships crash a vulnerable stack; a legacy implementation defect, not inherent to every UDP receiver.\u003c/td>\u003ctd>Patch OS/firmware, validate packets at firewall/IPS; pay attention to long-lived embedded systems.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UDP flood\u003c/td>\u003ctd>High packet volume consumes bandwidth/CPU; closed-port ICMP generation can add extra work.\u003c/td>\u003ctd>Filter unnecessary ports, rate-limit UDP/ICMP, filter spoofed sources; upstream protection for link-saturating floods.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>DNS, NTP or memcached amplification combines UDP source spoofing with an application that sends a larger response to a spoofed victim address. This is application-protocol amplification on UDP, not UDP automatically multiplying packets.\u003c/p>","refs":[{"sourceId":"src14","from":28,"to":36}]},{"title":"Proportionate layered mitigation","html":"\u003cp>Start with configuration controls: remove unused services, enable SYN cookies where supported, patch stacks and filter spoofed sources at network boundaries. Add firewall/IDS scan detection and sensible per-source or aggregate rate limits. Segment hosts to reduce what a compromised machine can discover. Use authenticated encryption for application content and protect critical transport/control traffic at appropriate layers. Add dedicated upstream DDoS capacity where availability risk justifies it.\u003c/p>\u003cp>ICMP echo blocking alone cannot stop TCP/UDP sweeps. Blocking all ICMP can also interfere with legitimate error reporting and path diagnostics. An on-site firewall cannot recover bandwidth already saturated upstream. For exam answers, identify which resource is exhausted: SYN backlog, connection state, CPU, response generation or incoming link capacity.\u003c/p>","refs":[{"sourceId":"src14","from":38,"to":42}]}],"quiz":[{"question":"A server receives SYN but never gets the final ACK. Which resource is the classic target?","options":["DNS cache","Half-open connection backlog","ARP VLAN identifier","TLS certificate serial"],"answer":1,"explanation":"A conventional SYN-RECEIVED entry holds resources until completion or timeout.","refs":[{"sourceId":"src14","from":11,"to":25}]},{"question":"A SYN probe receives RST. Best interpretation?","options":["The host is necessarily offline","The target port is closed and a responding host exists","The application authenticated the client","UDP is enabled"],"answer":1,"explanation":"RST is the normal closed-port TCP response and is also evidence of a live responder.","refs":[{"sourceId":"src14","from":15,"to":17}]},{"question":"UDP probe receives no reply. What can safely be concluded?","options":["Definitely open","Definitely closed","Open or filtered/lost; more evidence needed","A connection has been established"],"answer":2,"explanation":"UDP has no handshake and silence is ambiguous.","refs":[{"sourceId":"src14","from":30,"to":30}]},{"question":"Which control changes the SYN state-allocation asymmetry?","options":["Increasing backlog only","SYN cookies","Blocking web payloads only","Longer SYN timeout"],"answer":1,"explanation":"SYN cookies postpone stored half-open state until the final ACK validates the return path.","refs":[{"sourceId":"src14","from":26,"to":26}]},{"question":"An attacker forges a valid TCP reset against a TLS session. What can occur?","options":["TLS authenticates the RST and rejects it automatically","The TCP connection can terminate despite protected content","The attacker learns the TLS key automatically","RST becomes an encrypted HTTP request"],"answer":1,"explanation":"TLS record integrity does not cover underlying TCP control headers.","refs":[{"sourceId":"src14","from":23,"to":24}]},{"question":"One source probes destination port 80 on every IP in a subnet. This is primarily:","options":["A horizontal host sweep","A vertical port scan","An IPsec transform set","A UDP bomb"],"answer":0,"explanation":"Host sweeps probe across hosts rather than many ports on one host.","refs":[{"sourceId":"src14","from":17,"to":18}]},{"question":"Which attack relies on malformed UDP fields against a vulnerable parser?","options":["UDP bomb","SYN flood","OSPF LSA flood","TCP connect scan"],"answer":0,"explanation":"UDP bomb targets header validation defects, commonly mitigated by patches and packet validation.","refs":[{"sourceId":"src14","from":33,"to":34}]},{"question":"Why might a local firewall be insufficient during a huge UDP flood?","options":["It cannot compare port numbers","The upstream access link may already be saturated","UDP has no destination address","It must accept every packet"],"answer":1,"explanation":"Upstream absorption/filtering is needed when traffic volume exhausts the incoming link before local inspection.","refs":[{"sourceId":"src14","from":35,"to":40}]}],"tutorialAnswers":[{"sourceId":"src15","question":"Q1. List Layer 4's mandatory tasks, common to both TCP and UDP, and then list what TCP adds on top of them. For each item TCP adds, explain in one sentence why UDP deliberately leaves it out.   [LO1]","answerHtml":"\u003cp>Shared duties in the lecture: segmentation/transport units, multiplexing, demultiplexing, process-to-process delivery and basic checksum error detection. TCP additionally establishes/terminates connections (UDP avoids setup latency), retransmits for reliability (UDP leaves loss handling to the application), orders bytes (UDP avoids waiting for missing data), controls receiver flow (UDP leaves pacing to the application), and controls congestion (UDP supplies no built-in algorithm). UDP datagrams are message oriented; it does not provide TCP-style reliable stream segmentation/reassembly. UDP is suitable where low delay or application-controlled recovery is preferred, not where correctness is unimportant.\u003c/p>","refs":[{"sourceId":"src15","from":8,"to":8}]},{"sourceId":"src15","question":"Q2. Explain what a socket is, and why the combination of source IP, source port, destination IP, and destination port matters more than the IP address alone.   [LO1]","answerHtml":"\u003cp>A socket endpoint combines IP address and port. The four TCP flow values distinguish simultaneous conversations between the same hosts and deliver each segment to its correct process/connection. One IP alone identifies a host, not which application or active conversation. Protocol also separates TCP from UDP namespaces.\u003c/p>","refs":[{"sourceId":"src15","from":9,"to":9}]},{"sourceId":"src15","question":"Q3. Describe the three-way handshake, and explain exactly what resource the server commits, and at which step, before it has any proof the client is genuine. Why does this detail matter for a later part of this worksheet?   [LO1]","answerHtml":"\u003cp>Client sends SYN with sequence x; server replies SYN-ACK with sequence y and ACK x+1; client sends ACK y+1. Conventionally the server allocates a half-open backlog/TCB entry on receiving SYN, before final ACK proves reachability. That finite pre-verification allocation is precisely what a SYN flood exhausts. SYN cookies are an exception that avoids keeping that half-open state.\u003c/p>","refs":[{"sourceId":"src15","from":11,"to":11}]},{"sourceId":"src15","question":"Q4. Describe how a TCP connection is torn down, and explain what the TIME_WAIT state is holding onto and why that could matter operationally, not just academically.   [LO1]","answerHtml":"\u003cp>One side sends FIN, peer ACKs, peer eventually sends its own FIN, and the active closer ACKs; the middle ACK/FIN can combine. Each FIN closes one sending direction. The active closer enters TIME_WAIT, retaining protocol/tuple state to handle delayed duplicates and a repeated FIN needing another ACK. Many rapid closes can accumulate TIME_WAIT entries and reduce available local ports/state; exact timing is OS dependent.\u003c/p>","refs":[{"sourceId":"src15","from":12,"to":12}]},{"sourceId":"src15","question":"Q5. Explain how a SYN scan differs from a full connect scan, and why an attacker might prefer one over the other.   [LO1]","answerHtml":"\u003cp>A SYN scan sends SYN and reads SYN-ACK/RST without completing a full connection, usually requiring raw-packet privileges; it can reduce application-level logging but remains visible to network sensors. A connect scan completes the OS TCP handshake and is typically easier without special privilege, but produces a full connection and more obvious logging. Both reveal service exposure.\u003c/p>","refs":[{"sourceId":"src15","from":14,"to":14}]},{"sourceId":"src15","question":"Q6. Explain why FIN, Xmas, and NULL scans can sometimes get past a firewall that a normal SYN scan would be caught by.   [LO1]","answerHtml":"\u003cp>A simplistic firewall that watches only new SYN attempts may overlook probes with FIN, FIN+PSH+URG (Xmas), or no flags (NULL). Some stacks RST closed ports but silently drop these probes at open ports, giving the scanner information. Results depend on OS/firewall behaviour, and silence remains open-or-filtered; stateful inspection and abnormal-flag detection reduce this gap.\u003c/p>","refs":[{"sourceId":"src15","from":15,"to":15}]},{"sourceId":"src15","question":"Q7. Explain what OS fingerprinting actually identifies, and why simply knowing a target's operating system is valuable to an attacker even before any vulnerability is confirmed.   [LO1]","answerHtml":"\u003cp>Fingerprinting estimates the operating system and sometimes version from TTLs, TCP window/options ordering and crafted-probe responses. It narrows the attacker's search to likely exploits/defaults and increases targeting efficiency. The identification alone is neither proof of a vulnerability nor a compromise; patching and layered controls still matter.\u003c/p>","refs":[{"sourceId":"src15","from":16,"to":16}]},{"sourceId":"src15","question":"Q8. TCP Hijacking and TCP RST Injection exploit almost exactly the same vulnerability. Explain what that shared vulnerability is, and then explain what actually distinguishes the two attacks from each other in terms of what the attacker is trying to achieve.   [LO1]","answerHtml":"\u003cp>Both exploit TCP's lack of cryptographic origin authentication for control/state, using spoofed flow identifiers and acceptable sequence numbers. Hijacking aims to inject attacker data or take over the session. RST injection aims to kill an existing flow with a reset. Random ISNs and modern reset validation hinder off-path guessing; TLS rejects injected content but cannot authenticate a TCP reset.\u003c/p>","refs":[{"sourceId":"src15","from":17,"to":17}]},{"sourceId":"src15","question":"Q9. Using what you learned about resource reservation during the handshake, explain step by step how a SYN flood actually exhausts a server, and why spoofed source addresses make the attack more effective rather than less.   [LO1]","answerHtml":"\u003cp>Attacker sends many SYNs; server allocates half-open entries and sends SYN-ACK; attacker never returns final ACK; entries survive until timeout; arrival rate exceeds expiry, so the backlog fills and new legitimate clients fail. Spoofed addresses hide/disperse sources and send SYN-ACKs to parties that did not request them, preventing intended completion. Valid established sessions may continue, though extreme network/CPU overload can affect everything.\u003c/p>","refs":[{"sourceId":"src15","from":18,"to":18}]},{"sourceId":"src15","question":"Q10. Evaluate SYN cookies as a mitigation. Why is this described as removing the vulnerability rather than just tolerating it, compared to simply increasing the backlog size?   [LO2]","answerHtml":"\u003cp>SYN cookies encode enough recoverable state in the SYN-ACK sequence number, so final ACK can be validated before normal connection state is allocated. This removes the particular stored half-open backlog asymmetry. A bigger backlog merely lets more fake entries coexist and still eventually fills. Cookies do not eliminate packet-processing costs or link-capacity limits, so rate limits and upstream DDoS measures may still be required.\u003c/p>","refs":[{"sourceId":"src15","from":19,"to":19}]},{"sourceId":"src15","question":"Q11. Explain why UDP port scanning is inherently harder and less reliable for an attacker than TCP port scanning, referencing what a UDP response (or lack of one) actually tells the scanner.   [LO1]","answerHtml":"\u003cp>TCP normally offers clear SYN-ACK/open and RST/closed responses. UDP has no handshake: ICMP Port Unreachable suggests closed, an application reply suggests open, and silence can mean open, firewall filtering, packet loss or ICMP throttling. A valid application-specific query such as DNS helps, but broad UDP scans remain slower and ambiguous.\u003c/p>","refs":[{"sourceId":"src15","from":21,"to":21}]},{"sourceId":"src15","question":"Q12. A network administrator argues that disabling ICMP entirely would stop most reconnaissance against their network. Evaluate this claim using at least two of today's attacks in your answer.   [LO2, LO3]","answerHtml":"\u003cp>The claim is false. A TCP host sweep still learns from SYN-ACK or RST even when ICMP echo is disabled; a TCP port scan can still identify listening ports. UDP sweeps may also reveal live services via application replies. Suppressing all ICMP removes some signals but also damages useful error/diagnostic behaviour. Prefer restricted exposure, segmentation, pattern detection and selective rate limiting.\u003c/p>","refs":[{"sourceId":"src15","from":22,"to":22}]},{"sourceId":"src15","question":"Q13. Explain why UDP floods do not need to establish anything before they can start doing damage, and why this makes UDP flooding cheaper for an attacker than an equivalent TCP-based flood would be.   [LO1]","answerHtml":"\u003cp>UDP needs no handshake or established state before a receiver processes incoming packets. Attackers can emit packets immediately, possibly with spoofed sources, consuming victim bandwidth/CPU; closed ports may also cause costly ICMP responses. This avoids connection-setup overhead. TCP SYN floods can themselves be cheap, so the useful comparison is UDP's absence of required setup, not a claim that every UDP flood is cheaper than every TCP attack.\u003c/p>","refs":[{"sourceId":"src15","from":23,"to":23}]},{"sourceId":"src15","question":"Q14. Both TCP's weaknesses and UDP's weaknesses trace back to the same underlying design assumption. State that assumption in your own words, and explain how it shows up differently in a TCP attack versus a UDP attack of your choosing.   [LO1, LO2]","answerHtml":"\u003cp>The underlying assumption is that the network and apparent senders are trustworthy enough to process packets without cryptographic proof at transport level. TCP tracks state but does not authenticate packet origin: a forged acceptable-sequence RST can disrupt a connection. UDP has no protocol handshake/state, so a spoofed datagram flood can make the victim spend resources immediately. Checksums do not solve either sender-authentication problem.\u003c/p>","refs":[{"sourceId":"src15","from":25,"to":25}]},{"sourceId":"src15","question":"Q15. A small business has almost no security budget this year. Using this week's mitigations, recommend three that could realistically be implemented at little to no cost, and justify why each one still meaningfully reduces risk despite costing so little.   [LO2, LO3]","answerHtml":"\u003cp>First, disable unused services and close their ports using existing host/router firewalls: fewer targets remain available. Second, enable supported SYN cookies: reduce classic backlog exhaustion using configuration rather than new appliances. Third, configure appropriate ingress/egress anti-spoofing and sensible existing-device rate limits: reduce forged-source abuse and unwanted load. Patch systems too. These cost administrator time, and a truly link-saturating flood can still require provider assistance.\u003c/p>","refs":[{"sourceId":"src15","from":26,"to":26}]}]},"m09":{"id":"m09","title":"Firewall fundamentals, types and evolution","sections":[{"title":"Firewall, IDS and IPS: what action follows a match?","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Decision basis\u003c/th>\u003cth>Action\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Firewall\u003c/td>\u003ctd>Configured access policy: addresses, ports, protocols; advanced models add application/user/content context\u003c/td>\u003ctd>Permit or deny traffic\u003c/td>\u003ctd>Preventive access enforcement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IDS\u003c/td>\u003ctd>Signatures, anomalies or suspicious activity\u003c/td>\u003ctd>Generate alerts; a passive sensor does not itself drop traffic\u003c/td>\u003ctd>Detective visibility\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IPS\u003c/td>\u003ctd>Detection logic similar to IDS, deployed in traffic path\u003c/td>\u003ctd>Drop/block or otherwise prevent detected traffic\u003c/td>\u003ctd>Active prevention\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>A firewall is hardware or software enforcing traffic policy between trust boundaries. Its protection depends on rules and placement. These controls overlap in modern products and work together in a layered design. A passive IDS typically receives mirrored traffic, whereas an IPS is inline. The lecture phrase that “both can be inline” should be read as a broad product/deployment comparison, not a claim that a passive IDS inherently blocks.\u003c/p>","refs":[{"sourceId":"src16","from":5,"to":7}]},{"title":"Deployment form and inspection state","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Choice\u003c/th>\u003cth>Strengths\u003c/th>\u003cth>Limits and fit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hardware firewall\u003c/td>\u003ctd>Central policy for a network segment; dedicated resources and often accelerated throughput\u003c/td>\u003ctd>Upfront appliance cost; perimeter-only placement does not see all internal east-west traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Software/host firewall\u003c/td>\u003ctd>Granular protection per host; low software cost; follows endpoint\u003c/td>\u003ctd>Uses host resources; host compromise may disable/bypass it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stateless inspection\u003c/td>\u003ctd>Each packet independently checked against header rules; fast and inexpensive\u003c/td>\u003ctd>No memory of legitimate initiation; reply-looking spoofed packets may match broad return rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stateful inspection\u003c/td>\u003ctd>State table tracks addresses, ports, protocol and connection stage; allows valid return traffic of permitted sessions\u003c/td>\u003ctd>Consumes memory/CPU; floods can exhaust state; encrypted payload remains opaque without decryption\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Use hardware boundaries and endpoint software together: one protects shared paths, the other controls each host including internal traffic. State tracking is context, not proof of sender identity or a guarantee against valid-sequence on-path injection.\u003c/p>","refs":[{"sourceId":"src16","from":8,"to":10}]},{"title":"Types 1–3: header, connection and session","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Advantages\u003c/th>\u003cth>Limitations\u003c/th>\u003cth>Use case\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Packet filtering\u003c/td>\u003ctd>L3/L4 header ACL; top-to-bottom first match; stateless\u003c/td>\u003ctd>Fastest classic type, low cost and overhead; suitable on routers\u003c/td>\u003ctd>No payload or state inspection; complex rule sets; fragment handling can create gaps\u003c/td>\u003ctd>Basic perimeter filtering, router ACLs, high-throughput simple policies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stateful inspection\u003c/td>\u003ctd>L3/L4 plus connection-state table; permitted new connection enables matching replies\u003c/td>\u003ctd>Stronger context, simpler reply rules, rejects out-of-state traffic\u003c/td>\u003ctd>State exhaustion and troubleshooting complexity; no inherent TLS payload visibility\u003c/td>\u003ctd>Ordinary enterprise perimeter and context-aware filtering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Circuit-level gateway\u003c/td>\u003ctd>Lecture L5 model; verifies session establishment/legitimacy then relays traffic; SOCKS is classic example\u003c/td>\u003ctd>Lighter than protocol-specific content inspection; hides internal addressing\u003c/td>\u003ctd>Approved session can carry malicious content; limited standalone modern use\u003c/td>\u003ctd>SOCKS-based proxying and conceptual building block\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Return-traffic example: a stateless ACL allowing packets from source port 443 cannot tell whether an internal client previously initiated the conversation. A stateful firewall checks its connection table before accepting a reply. The state table is itself a resource requiring protection.\u003c/p>","refs":[{"sourceId":"src16","from":12,"to":21}]},{"title":"Types 4–7: protocol, application, web specialism and bundles","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Strength / scenario\u003c/th>\u003cth>Cost or limitation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Application-layer/proxy\u003c/td>\u003ctd>L7 intermediary terminates client connection, inspects protocol requests and opens a separate server connection\u003c/td>\u003ctd>Fine HTTP-method/FTP-command/content policies, response sanitisation and masking internal client IPs; corporate web/email proxies\u003c/td>\u003ctd>High classic-type overhead; per-protocol support; possible bottleneck/failure point\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NGFW\u003c/td>\u003ctd>Stateful inspection + DPI + application recognition + integrated IPS; often user/group policy\u003c/td>\u003ctd>Enterprise application-aware control even when many applications share 443; may inspect TLS when properly configured\u003c/td>\u003ctd>Expense, management complexity, decryption throughput cost and concentrated responsibility\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WAF\u003c/td>\u003ctd>L7 HTTP/HTTPS inspection in front of a web application; signatures and/or positive allowed-request model\u003c/td>\u003ctd>Specialised defence against SQL injection, XSS and related web patterns; e-commerce portals, cloud reverse proxies\u003c/td>\u003ctd>Web-only scope; tuning creates false positives/negatives; cannot replace application controls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UTM\u003c/td>\u003ctd>Firewall, antivirus, IPS/IDS, content/URL filtering, VPN and sometimes anti-spam bundled in one appliance\u003c/td>\u003ctd>SMBs/branches get one vendor/interface and simpler deployment at lower integration cost\u003c/td>\u003ctd>Shared bottleneck and failure point; scaling and individual feature depth may be limited\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>NGFW versus UTM in this lecture: integrated, often single-pass engine versus separately bundled security modules. Actual products can overlap, so evaluate measured throughput with required features enabled, management effort and failure handling. A WAF must see HTTP plaintext through TLS termination/decryption or an equivalent integration; an encrypted stream cannot simply be inspected by naming it HTTPS.\u003c/p>","refs":[{"sourceId":"src16","from":22,"to":33}]},{"title":"Why each generation emerged","html":"\u003cul>\u003cli>Late 1980s packet filters met basic access-control needs with limited processing power.\u003c/li>\u003cli>1994 Check Point FireWall-1 is the lecture milestone for stateful inspection: track conversations to close context gaps.\u003c/li>\u003cli>1990s circuit gateways and application proxies explored session validation versus deeper protocol interpretation.\u003c/li>\u003cli>2000s UTM reduced the burden of integrating many separate products.\u003c/li>\u003cli>Roughly 2007–2010 onward, NGFW application awareness/integrated prevention addressed applications sharing common ports, particularly HTTPS. WAF developed as specialised web protection.\u003c/li>\u003c/ul>\u003cp>The analytical arc is header → connection → protocol → application/user and sometimes decrypted content. More context can improve precision and visibility, but consumes processing, configuration effort and budget. WAF goes narrower/deeper; UTM goes wider across functions. These are capability trade-offs rather than a strict ranking in which every later device replaces all earlier ones.\u003c/p>","refs":[{"sourceId":"src16","from":9,"to":35}]},{"title":"Recommendation method for structured answers","html":"\u003cp>State the requirement and choose the control that inspects the relevant information. A router ACL cannot distinguish SQL code inside an allowed HTTP request. A WAF can inspect that application pattern, while the network firewall still controls reachability. For content sanitisation and hidden client addressing, choose an application proxy; for a small branch needing multiple manageable functions, consider UTM; for enterprise application/user policy, consider NGFW.\u003c/p>\u003cp>Then state one benefit, one cost and a complementary measure. Performance must be considered with real features enabled. Keep systems/apps patched, apply least privilege and monitor alerts; buying a firewall does not make an unsafe application safe.\u003c/p>","refs":[{"sourceId":"src16","from":35,"to":38}]}],"quiz":[{"question":"A sensor sees malicious traffic and sends an alert but cannot block it. It is acting as:","options":["IDS","IPS","NAT gateway only","SYN cookie"],"answer":0,"explanation":"An IDS is detective; an IPS adds inline prevention.","refs":[{"sourceId":"src16","from":6,"to":7}]},{"question":"Which firewall automatically associates allowed outbound sessions with return traffic?","options":["Stateless ACL only","Stateful inspection firewall","An unauthenticated GRE tunnel","A passive tap"],"answer":1,"explanation":"The state table supplies connection context for permitted replies.","refs":[{"sourceId":"src16","from":10,"to":16}]},{"question":"Which classic type terminates the client connection and creates a separate connection to the destination?","options":["Packet filter","Application proxy","Pure stateless router","Passive IDS"],"answer":1,"explanation":"The proxy understands the application protocol and acts as an intermediary.","refs":[{"sourceId":"src16","from":22,"to":24}]},{"question":"A firewall allows TCP 443, and SQL injection passes inside HTTPS after decryption at the server. Best additional specialist control?","options":["WAF at the web application boundary","A RIP Response","A larger wildcard mask","Disable TCP sequence numbers"],"answer":0,"explanation":"A WAF inspects web request/response patterns; L3/L4 permission alone does not assess SQL injection.","refs":[{"sourceId":"src16","from":28,"to":30}]},{"question":"Which statement best reflects the lecture NGFW/UTM contrast?","options":["UTM always has no firewall","NGFW emphasises integrated inspection; UTM emphasises bundled functions","NGFW only sees TCP port 23","UTM replaces endpoint patching"],"answer":1,"explanation":"This is a conceptual architectural distinction; actual vendor capabilities overlap.","refs":[{"sourceId":"src16","from":25,"to":33}]},{"question":"What can pass through a circuit-level gateway after a valid session is approved?","options":["No application data","Malicious content it does not inspect","Only signed JavaScript","Only ICMP"],"answer":1,"explanation":"It verifies sessions, not payload safety.","refs":[{"sourceId":"src16","from":19,"to":20}]},{"question":"For a small branch with limited budget and no dedicated security staff, what is a strong lecture-based choice?","options":["UTM, after checking performance and failure risks","Maximum separate vendors regardless of staffing","Only a public DNS server","No firewall because traffic is encrypted"],"answer":0,"explanation":"UTM offers broad functions and one management interface, with bottleneck/depth trade-offs.","refs":[{"sourceId":"src16","from":31,"to":33}]},{"question":"What is a resource-exhaustion risk introduced by stateful inspection?","options":["State-table memory exhaustion","A reduction to zero header fields","Automatic proof of user identity","Disappearance of all return traffic"],"answer":0,"explanation":"Tracking flows consumes finite state; connection floods can exhaust it.","refs":[{"sourceId":"src16","from":16,"to":17}]}],"tutorialAnswers":[{"sourceId":"src17","question":"Q1. Explain the difference between a firewall, an IDS, and an IPS, specifically in terms of what each one actually does once it identifies something suspicious.   [LO4]","answerHtml":"\u003cp>A firewall permits or denies according to configured access policy. An IDS recognises suspicious signatures/anomalies and alerts without directly blocking in its passive role. An IPS is inline and can drop/block the detected attack. Modern NGFW/UTM products may combine these functions, but the action distinction remains important.\u003c/p>","refs":[{"sourceId":"src17","from":8,"to":8}]},{"sourceId":"src17","question":"Q2. Explain the difference between a software firewall and a hardware firewall, and why most real networks deploy both together rather than choosing one over the other.   [LO4]","answerHtml":"\u003cp>A hardware firewall is a network appliance providing central, often accelerated enforcement without using endpoint CPU; it costs more and sees traffic that traverses it. A software firewall protects a host with granular local rules and often little software cost, but uses host resources and may be undermined by host compromise. Combining them protects perimeter paths and endpoint/internal traffic.\u003c/p>","refs":[{"sourceId":"src17","from":9,"to":9}]},{"sourceId":"src17","question":"Q3. Explain the difference between stateless and stateful inspection, and describe one specific scenario where a stateless firewall's lack of context becomes a genuine vulnerability.   [LO4]","answerHtml":"\u003cp>Stateless inspection compares isolated packet headers to static rules. Stateful inspection maintains connection context and permits valid returns to allowed sessions. A stateless rule permitting inbound packets merely because their source port is 443 could accept a spoofed unsolicited packet from that port; the firewall has no prior-connection record to distinguish it from a real web reply.\u003c/p>","refs":[{"sourceId":"src17","from":10,"to":10}]},{"sourceId":"src17","question":"Q4. Distinguish Packet Filtering from Stateful Inspection specifically in terms of how each treats return traffic for a connection that was originally initiated from inside the network.   [LO4]","answerHtml":"\u003cp>A packet filter needs static rules for both directions and cannot prove an inbound reply belongs to a session initiated internally. A stateful firewall checks the initiating packet against policy, records the flow and automatically allows valid return packets matching that state, reducing the need for broad return-direction rules.\u003c/p>","refs":[{"sourceId":"src17","from":12,"to":12}]},{"sourceId":"src17","question":"Q5. Explain what a Circuit-Level Gateway actually validates, and why it provides no protection against malicious content once a session has already been approved.   [LO3]","answerHtml":"\u003cp>It validates a legitimate session setup, such as the TCP handshake in the lecture's circuit-gateway model, then relays without understanding later payload content. Therefore an attacker communicating over an approved session can send malicious content unless another control inspects the application. Address hiding does not imply payload safety.\u003c/p>","refs":[{"sourceId":"src17","from":13,"to":13}]},{"sourceId":"src17","question":"Q6. A company wants deep content filtering, such as blocking specific content inside an HTTP request, and strong anonymisation of its internal users' identities. Evaluate whether an Application-Layer/Proxy firewall or a simple Stateful Inspection firewall is the better fit, and justify your answer.   [LO4]","answerHtml":"\u003cp>Choose an application-layer/proxy firewall. It terminates the internal connection, interprets HTTP requests, applies fine content policies and opens a separate external connection, masking the internal client IP. A basic stateful firewall knows connection context but not request-body semantics. The proxy needs protocol support and incurs higher processing/latency costs; its masking is not a guarantee of total user anonymity.\u003c/p>","refs":[{"sourceId":"src17","from":14,"to":14}]},{"sourceId":"src17","question":"Q7. Distinguish NGFW from UTM. Both bundle multiple security functions together, so what is the key architectural difference between them, and what trade-off does that difference actually create?   [LO4]","answerHtml":"\u003cp>The lecture describes NGFW as a tightly integrated application-aware inspection/IPS architecture, often processing traffic in a coordinated engine; UTM packages several distinct security modules under one appliance/interface. NGFW can provide deeper contextual integration but at higher cost and management complexity. UTM simplifies broad deployment, often for SMBs, with potential shared bottlenecks and less specialist depth. Real product boundaries overlap.\u003c/p>","refs":[{"sourceId":"src17","from":15,"to":15}]},{"sourceId":"src17","question":"Q8. A small business wants comprehensive security, firewall, antivirus, and content filtering, but has no dedicated security staff and a limited budget. Recommend either an NGFW or a UTM for this business, and justify your recommendation using each option's genuine trade-offs.   [LO3, LO4]","answerHtml":"\u003cp>Recommend a UTM sized for the business's real traffic with required functions enabled. It consolidates firewall, antivirus and content filtering into one manageable interface/vendor and often costs less than separate integration. NGFW may supply stronger application/user integration but cost/complexity can exceed the staff and budget. UTM still needs updates, sensible rules, backups and awareness of its single failure point.\u003c/p>","refs":[{"sourceId":"src17","from":16,"to":16}]},{"sourceId":"src17","question":"Q9. An e-commerce company already has a stateful inspection firewall at its perimeter but has recently suffered a SQL injection attack against its public web application. Evaluate why the existing firewall failed to stop this, and recommend a specific additional firewall type that would address it.   [LO3, LO4]","answerHtml":"\u003cp>A basic stateful perimeter firewall allows a legitimate web connection and tracks its state; it generally does not interpret SQL syntax inside an allowed request. Add a WAF in front of the web application with visibility into HTTP after suitable TLS termination. It can detect/block SQL-injection patterns or enforce expected request formats, but the application must also use parameterised queries, validation and patching.\u003c/p>","refs":[{"sourceId":"src17","from":17,"to":17}]},{"sourceId":"src17","question":"Q10. Explain why NGFW emerged specifically once port-based rules stopped meaningfully reflecting real traffic. What actually changed about real-world network traffic that made this true?   [LO4]","answerHtml":"\u003cp>As diverse applications converged on HTTP/HTTPS, port 443 stopped meaning one safely defined activity. A rule allowing 443 permits many applications with different risks. NGFW adds application recognition, user context and integrated prevention so policy can distinguish these activities, with TLS inspection where properly configured rather than assuming all encryption can be read.\u003c/p>","refs":[{"sourceId":"src17","from":19,"to":19}]},{"sourceId":"src17","question":"Q11. WAF and UTM both emerged as responses to increasing complexity and more specialised threats, but they represent opposite strategies. Explain what these two strategies are, and give an example of an organisation that would be better served by each one.   [LO4]","answerHtml":"\u003cp>WAF narrows its scope and goes deep into web application requests; an e-commerce company with a public customer/payment portal is a natural fit alongside broader network defence. UTM broadens across security functions in one managed appliance; a small branch without security specialists benefits from consolidated firewall, antimalware and filtering. Neither strategy universally replaces the other.\u003c/p>","refs":[{"sourceId":"src17","from":20,"to":20}]},{"sourceId":"src17","question":"Q12. Using the full arc of firewall evolution covered this week, from packet filtering through to NGFW, explain what is being traded for what at every step. What consistently goes down, and what consistently goes up in return for it?   [LO4]","answerHtml":"\u003cp>From headers to state to protocol/application/user context, the system generally trades raw processing efficiency and simplicity for richer visibility and more precise decisions. Resource use, cost and management demands tend to rise, and maximum throughput may fall when deeper features are enabled. This is an architectural tendency, not a universal benchmark: newer hardware can outperform older devices, and WAF/UTM represent specialisation/bundling rather than one straight ladder.\u003c/p>","refs":[{"sourceId":"src17","from":21,"to":21}]}]},"m10":{"id":"m10","title":"Firewall placement, zones and ACL configuration","sections":[{"title":"DMZ containment and the zone model","html":"\u003cp>A DMZ is a separate buffer segment for services that must be reachable externally, such as web, DNS or email servers. If one is compromised, a separate restrictive DMZ-to-inside boundary limits lateral movement. A DMZ contains exposure; it does not make public services unhackable.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Direction\u003c/th>\u003cth>Typical intent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OUTSIDE → DMZ\u003c/td>\u003ctd>Permit only required public services to specific servers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OUTSIDE → INSIDE\u003c/td>\u003ctd>Deny unsolicited access by default\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DMZ → INSIDE\u003c/td>\u003ctd>Deny or allow only narrowly justified dependencies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INSIDE → OUTSIDE / DMZ\u003c/td>\u003ctd>Permit only authorised business access; replies depend on inspection/policy\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Zone-Based Firewall organises interfaces into logical zones and assigns directional policies between zone pairs. Different-zone traffic is denied unless an explicit policy permits it; same-zone traffic is typically permitted by default in the lecture model. INSIDE→OUTSIDE need not equal OUTSIDE→INSIDE. Inspection state can permit replies without a broad reverse initiation policy. ZBF is an organisation/configuration model, not an eighth inspection technology; implementation capabilities vary.\u003c/p>","refs":[{"sourceId":"src18","from":5,"to":7}]},{"title":"Four firewall placement architectures","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Architecture and path\u003c/th>\u003cth>Advantages\u003c/th>\u003cth>Weakness / evaluation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. Internet → border router → single firewall → internal / DMZ segments\u003c/td>\u003ctd>Low cost, simple central management\u003c/td>\u003ctd>Single firewall failure/policy bottleneck; router remains internet-facing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. Internet → single firewall → border router → internal\u003c/td>\u003ctd>Firewall directly shields router from permitted/denied inbound flows\u003c/td>\u003ctd>Less common in the lecture; router routing/management traffic must be explicitly handled by firewall policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. Internet → router → firewall 1 → DMZ → firewall 2 → internal\u003c/td>\u003ctd>Screened subnet; two distinct boundaries isolate the DMZ; independent tailored policy\u003c/td>\u003ctd>Two purchases/licenses/management sets; consistency and redundancy require care\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4. Internet → firewall 1 → router/DMZ → firewall 2 → internal\u003c/td>\u003ctd>Outer firewall shields router; router handles DMZ routing/NAT\u003c/td>\u003ctd>Router depends on outer protection and may be a chokepoint; less common pattern in lecture\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>For a funded high-value public DMZ, the screened subnet (3) gives clear defence in depth. A small network may prefer (1) for cost and manageability. Two firewalls do not automatically create high availability, and an attacker may abuse an allowed path or policy defect without literally compromising both appliances.\u003c/p>\u003cp>Topology qualification: the lecture calls the router in (4) exposed if firewall 1 is bypassed. In (3), the border router is already internet-facing; therefore this is not a unique claim that (3) protects its router better. State the actual boundary placement when evaluating the tutorial wording.\u003c/p>","refs":[{"sourceId":"src18","from":9,"to":13}]},{"title":"ACL logic, types and placement","html":"\u003cp>An ACL is an ordered permit/deny list. Evaluate top to bottom; first match stops processing; an invisible final deny drops any unmatched traffic. It is applied per interface and direction: \u003cstrong>in\u003c/strong> evaluates packets entering that interface, \u003cstrong>out\u003c/strong> evaluates packets leaving it.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Matches\u003c/th>\u003cth>Number range\u003c/th>\u003cth>Placement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>Source IPv4 address only\u003c/td>\u003ctd>1–99; 1300–1999\u003c/td>\u003ctd>Close to destination, to avoid blocking this source from unrelated destinations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extended\u003c/td>\u003ctd>Source, destination, IP protocol and TCP/UDP ports; optional TCP flag test\u003c/td>\u003ctd>100–199; 2000–2699\u003c/td>\u003ctd>Close to source, because it can match the unwanted destination/service precisely\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Named\u003c/td>\u003ctd>Either Standard or Extended matching beneath a descriptive name\u003c/td>\u003ctd>Name instead of number\u003c/td>\u003ctd>Follow its underlying type\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Placement is a rule of thumb guided by topology and policy. “Close to source” means on an interface/direction actually traversed by those packets, not a randomly selected port. The lecture named format starts with a letter, has no spaces and uses meaningful names; sequence numbers help insert or remove entries.\u003c/p>","refs":[{"sourceId":"src18","from":15,"to":18}]},{"title":"Wildcard masks and command grammar","html":"\u003cp>A wildcard 0 bit requires an address bit to match; a wildcard 1 bit ignores it. For ordinary contiguous subnets, subtract each subnet-mask octet from 255. \u003ccode>host 192.168.100.5\u003c/code> means exact address with wildcard 0.0.0.0; \u003ccode>any\u003c/code> matches all addresses.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Prefix\u003c/th>\u003cth>Subnet mask\u003c/th>\u003cth>Wildcard\u003c/th>\u003cth>Range example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>/24\u003c/td>\u003ctd>255.255.255.0\u003c/td>\u003ctd>0.0.0.255\u003c/td>\u003ctd>192.168.10.0–192.168.10.255\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/28\u003c/td>\u003ctd>255.255.255.240\u003c/td>\u003ctd>0.0.0.15\u003c/td>\u003ctd>192.168.50.0–192.168.50.15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/27\u003c/td>\u003ctd>255.255.255.224\u003c/td>\u003ctd>0.0.0.31\u003c/td>\u003ctd>192.168.100.0–192.168.100.31\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cpre>\u003ccode>access-list 10 permit 192.168.100.0 0.0.0.31\naccess-list 10 permit host 192.168.100.5\n\naccess-list 101 deny tcp 192.168.10.0 0.0.0.255 host 192.168.20.5 eq 23\naccess-list 101 permit ip any any\ninterface GigabitEthernet0/1\n ip access-group 101 in\u003c/code>\u003c/pre>\u003cp>Extended syntax: action, protocol, source plus optional wildcard/source port, destination plus optional wildcard/destination port, optional established/log. Port operators include eq, gt, lt, neq and range; ports apply to TCP/UDP, not generic ip or icmp. In the example, \u003ccode>eq 23\u003c/code> after destination matches destination Telnet, not the client's ephemeral source port. Optional \u003ccode>log\u003c/code> records matching activity.\u003c/p>","refs":[{"sourceId":"src18","from":19,"to":23}]},{"title":"Named ACL and first-match packet tracing","html":"\u003cpre>\u003ccode>ip access-list extended BLOCK_TELNET_TO_SERVER\n 10 deny tcp 192.168.10.0 0.0.0.255 host 192.168.20.5 eq 23\n 20 permit ip any any\ninterface GigabitEthernet0/1\n ip access-group BLOCK_TELNET_TO_SERVER in\u003c/code>\u003c/pre>\u003cp>Assume GigabitEthernet0/1 is the source subnet's gateway interface. A packet from 192.168.10.7 to 192.168.20.5 TCP destination 23 matches line 10 and drops. The same source to destination 443 misses line 10 and matches line 20. A different destination also reaches line 20. If line 20 is removed, all these non-Telnet packets hit implicit deny; if line 20 is moved above line 10, the Telnet packet is permitted before the deny is reached.\u003c/p>\u003cp>A list permitting only one management subnet should deliberately rely on implicit deny for all other sources. Do not mechanically add \u003ccode>permit ip any any\u003c/code> when the policy says only a particular source is allowed. Build rules from the wording, then test allowed, denied and unrelated examples.\u003c/p>","refs":[{"sourceId":"src18","from":21,"to":25}]},{"title":"The established keyword: the exam trap","html":"\u003cp>\u003ccode>established\u003c/code> is a TCP-only ACL test for ACK or RST set. It allows normal replies (including SYN-ACK) to pass a stateless rule, while an initial SYN lacking ACK/RST fails that permit. It does not consult a connection table and a forged ACK can still pass. See \u003ca href=\"https://www.cisco.com/c/en/us/support/docs/ip/access-lists/26448-ACLsamples.html\">Cisco, commonly used IP ACLs\u003c/a>.\u003c/p>\u003cpre>\u003ccode>ip access-list extended LIMIT_77_NEW_TCP\n 10 permit tcp 192.168.77.0 0.0.0.255 host 10.1.1.100 established\n 20 deny tcp 192.168.77.0 0.0.0.255 host 10.1.1.100\n 30 permit ip any any\ninterface GigabitEthernet0/1\n ip access-group LIMIT_77_NEW_TCP in\u003c/code>\u003c/pre>\u003cp>Apply where subnet 192.168.77.0/24 enters its gateway, assuming that interface name. A normal reply to a connection initiated by server 10.1.1.100 has ACK/RST and matches 10. A new plain SYN from subnet 77 misses 10 and is denied by 20. Line 30 leaves unrelated traffic allowed. A stateful firewall is needed if the requirement is to prove traffic actually belongs to an allowed established flow.\u003c/p>","refs":[{"sourceId":"src18","from":20,"to":24}]}],"quiz":[{"question":"Which ACL line is checked after a packet matches a permit at sequence 10?","options":["Sequence 20","All deny lines only","None; processing stops","Only implicit deny"],"answer":2,"explanation":"ACLs stop at the first match, so ordering determines policy.","refs":[{"sourceId":"src18","from":15,"to":15}]},{"question":"Which type is sufficient to allow only a source subnet through an interface?","options":["Standard ACL","WAF rule only","GRE header","BGP ROA"],"answer":0,"explanation":"When destination/protocol/port distinctions are unnecessary, source-only Standard matching is sufficient.","refs":[{"sourceId":"src18","from":16,"to":16}]},{"question":"Wildcard for 192.168.50.0/28?","options":["255.255.255.240","0.0.0.15","0.0.0.240","255.255.255.15"],"answer":1,"explanation":"Invert 255.255.255.240 to get 0.0.0.15.","refs":[{"sourceId":"src18","from":19,"to":19}]},{"question":"An Extended ACL denies Telnet then has no other permit. What happens to HTTP that misses the deny?","options":["Allowed automatically","Dropped by implicit deny","Converted to Telnet","Allowed if source is local"],"answer":1,"explanation":"An explicit selective deny needs additional permits if the policy allows unrelated traffic.","refs":[{"sourceId":"src18","from":15,"to":23}]},{"question":"What does TCP established actually check?","options":["A live state-table entry","ACK or RST flag","A valid TLS signature","The SYN flag alone"],"answer":1,"explanation":"It is a TCP flag match, not true stateful validation.","refs":[{"sourceId":"src18","from":20,"to":20}]},{"question":"Why place an Extended ACL near the source?","options":["It cannot match destinations","It precisely matches unwanted traffic and avoids carrying it further","Its numbers are below 100","All ACLs only work inbound"],"answer":1,"explanation":"Source/destination/protocol/port matching avoids Standard ACL over-blocking concerns.","refs":[{"sourceId":"src18","from":17,"to":22}]},{"question":"Which zone policy pair must necessarily be identical?","options":["INSIDE→OUTSIDE and OUTSIDE→INSIDE","DMZ→INSIDE and INSIDE→DMZ","No such symmetry is required","Every pair must permit every packet"],"answer":2,"explanation":"Zone-pair policies are directional and can have different initiation rights.","refs":[{"sourceId":"src18","from":6,"to":7}]},{"question":"A public server is compromised in a correctly segmented DMZ. What does the DMZ chiefly provide?","options":["Automatic removal of the attacker","Restricted direct reachability into the internal network","Guaranteed clean application content","A replacement for all host patching"],"answer":1,"explanation":"The DMZ limits impact using a separate policy boundary; it does not prevent every compromise.","refs":[{"sourceId":"src18","from":5,"to":5}]}],"tutorialAnswers":[{"sourceId":"src19","question":"Q1. Explain what a DMZ is for, and why a compromised DMZ server does not automatically give an attacker access to the internal network.   [LO3]","answerHtml":"\u003cp>A DMZ hosts required public services in a buffer segment separated from the trusted internal network. Internet users can reach allowed DMZ services without general inside access. If a server is compromised, restrictive DMZ-to-inside rules and a separate trust boundary constrain lateral movement. This depends on correct routing and firewall policy; a DMZ label alone provides no protection.\u003c/p>","refs":[{"sourceId":"src19","from":8,"to":8}]},{"sourceId":"src19","question":"Q2. Explain why Zone-Based Firewall is described as a configuration model rather than a new firewall technology. Could a Packet Filtering firewall be configured using zones? Justify your answer.   [LO4]","answerHtml":"\u003cp>ZBF describes how policy is organised: interfaces belong to zones and policies control directional zone-pairs. Packet filtering describes how packets are inspected, so a zone-organised design can use header-based permit/deny filtering conceptually. The supported feature set depends on the specific product; the lecture is distinguishing model from mechanism.\u003c/p>","refs":[{"sourceId":"src19","from":9,"to":9}]},{"sourceId":"src19","question":"Q3. A company configures ZBF with three zones: INSIDE, OUTSIDE, and DMZ. Explain why the OUTSIDE-to-INSIDE zone-pair policy and the INSIDE-to-OUTSIDE zone-pair policy, for the same two zones, would typically not be identical or symmetric.   [LO3, LO4]","answerHtml":"\u003cp>Internal users may be authorised to initiate browsing or business access outward, but internet hosts generally should not initiate arbitrary access to inside systems. Thus INSIDE-to-OUTSIDE can permit selected initiation while OUTSIDE-to-INSIDE denies unsolicited traffic. Stateful inspection may allow legitimate replies without granting reverse initiation. The zones' trust and exposure differ, so symmetry would undermine least privilege.\u003c/p>","refs":[{"sourceId":"src19","from":10,"to":10}]},{"sourceId":"src19","question":"Q4. Describe the difference between a single firewall placed behind the border router and a single firewall placed in front of it, and identify which one directly protects the router itself from internet-facing attacks.   [LO4]","answerHtml":"\u003cp>Behind-router design: Internet → border router → firewall → protected internal/DMZ networks; simple but the border router faces external traffic first. In-front design: Internet → firewall → router → internal network; the firewall filters traffic before the router and therefore directly shields it, but must accommodate legitimate routing and management traffic.\u003c/p>","refs":[{"sourceId":"src19","from":12,"to":12}]},{"sourceId":"src19","question":"Q5. A financial services company wants the strongest possible defence in depth for its public-facing DMZ, and has the budget to support it. Recommend one of the four placement architectures covered this week, and justify your choice against at least one alternative.   [LO3, LO4]","answerHtml":"\u003cp>Recommend the dual-firewall screened subnet with router before both: Internet → router → outer firewall → DMZ → inner firewall → internal. It creates distinct outer/inner policy boundaries and separates public exposure from inside access. Compared with one firewall, it gives more independently enforceable containment but costs more and requires consistent management. It is defence in depth, not an automatic guarantee against allowed-path abuse or a high-availability design.\u003c/p>","refs":[{"sourceId":"src19","from":13,"to":13}]},{"sourceId":"src19","question":"Q6. A small business has a limited budget and a single IT administrator managing everything. Evaluate which placement architecture is most appropriate, referencing both cost and management complexity in your answer.   [LO3, LO4]","answerHtml":"\u003cp>For a budget-limited small business with one administrator, a single firewall behind the border router is the supplied lecture's straightforward choice: one purchase/license and one coherent rule set. Use separate interfaces/VLANs for any DMZ, keep policy narrow and protect the router's own management plane. Two appliances increase cost and coordination burden. Acknowledge the single point of failure and plan recoverability.\u003c/p>","refs":[{"sourceId":"src19","from":14,"to":14}]},{"sourceId":"src19","question":"Q7. Explain the specific weakness that the dual-firewall architecture with the router positioned between the two firewalls has, that the dual-firewall architecture with the router positioned before both firewalls does not.   [LO4]","answerHtml":"\u003cp>The lecture identifies that in Internet → firewall 1 → router/DMZ → firewall 2 → inside, bypassing firewall 1 leaves the router exposed at an intermediate chokepoint and threatens the routing/DMZ dependency. Important qualification: in the router-before-both design the router is itself already internet-facing, so it is inaccurate to claim it is intrinsically immune to router exposure. The structural benefit of the screened subnet is clear DMZ isolation between two firewall boundaries; explain actual traffic paths rather than overclaiming a unique weakness.\u003c/p>","refs":[{"sourceId":"src19","from":15,"to":15}]},{"sourceId":"src19","question":"Q8. Explain the implicit deny rule in an ACL, and why forgetting to include an explicit permit statement at the end of an Extended ACL can silently break far more traffic than intended.   [LO5]","answerHtml":"\u003cp>Every IPv4 ACL ends with an invisible deny for packets that did not match an earlier entry. If the intended policy is “deny this Telnet flow, allow everything else,” the final explicit permit ip any any is necessary; otherwise web, DNS and other unmatched traffic also drop. For a strict allowlist, implicit deny is deliberate and permit-any would instead violate policy.\u003c/p>","refs":[{"sourceId":"src19","from":17,"to":17}]},{"sourceId":"src19","question":"Q9. Explain why Standard ACLs are best placed close to the destination, while Extended ACLs are best placed close to the source. What is it about what each type can actually match that leads to this difference?   [LO4, LO5]","answerHtml":"\u003cp>Standard ACL knows only source address, so near-source placement could block that source from all destinations; near the target it limits collateral impact. Extended ACL can identify exact source/destination/protocol/service, so near-source placement rejects only unwanted traffic and saves downstream resources. The correct interface direction must still be determined from the topology.\u003c/p>","refs":[{"sourceId":"src19","from":18,"to":18}]},{"sourceId":"src19","question":"Q10. A network administrator needs to block only Telnet traffic (port 23) originating from the 10.10.30.0/24 subnet, destined specifically for the server at 172.16.5.10, while allowing all other traffic. Identify the correct ACL type for this policy, and write out the complete ACL statement(s) needed, including where in the network you would apply it and why.   [LO5]","answerHtml":"\u003cp>Use Extended ACL because the policy distinguishes destination server and TCP destination port 23. Assuming GigabitEthernet0/1 faces 10.10.30.0/24, apply inbound there, near source.\u003c/p>\u003cpre>\u003ccode>access-list 101 deny tcp 10.10.30.0 0.0.0.255 host 172.16.5.10 eq 23\naccess-list 101 permit ip any any\ninterface GigabitEthernet0/1\n ip access-group 101 in\u003c/code>\u003c/pre>\u003cp>The first line denies only the specified Telnet traffic; the second allows unrelated traffic. Adjust the interface name to the actual topology.\u003c/p>","refs":[{"sourceId":"src19","from":19,"to":19}]},{"sourceId":"src19","question":"Q11. A company wants to permit only the management subnet 192.168.50.0/28 to have any access at all through a specific router interface, denying every other source. Identify which ACL type best fits this policy, and write out the complete ACL statement(s) needed. Explain why this type is sufficient here even though it cannot check destination address or port.   [LO5]","answerHtml":"\u003cp>Use a Standard ACL because every packet is allowed or denied solely by source. /28 has subnet mask 255.255.255.240 and wildcard 0.0.0.15. Assuming this interface receives the sources to be filtered:\u003c/p>\u003cpre>\u003ccode>access-list 10 permit 192.168.50.0 0.0.0.15\ninterface GigabitEthernet0/1\n ip access-group 10 in\u003c/code>\u003c/pre>\u003cp>The implicit deny blocks all other sources. An optional explicit deny any log can make drops visible. Do not add permit any: that would defeat “only management subnet.” If the policy instead means outbound through that interface, use out; the unspecified topology determines direction.\u003c/p>","refs":[{"sourceId":"src19","from":20,"to":20}]},{"sourceId":"src19","question":"Q12. Convert the following numbered Extended ACL into an equivalent Named ACL called DENY_FTP_ADMIN: access-list 110 deny tcp 192.168.40.0 0.0.0.255 host 10.0.0.50 eq 21, followed by access-list 110 permit ip any any. Show the complete named version, including how you would apply it to an interface.   [LO5]","answerHtml":"\u003cpre>\u003ccode>ip access-list extended DENY_FTP_ADMIN\n 10 deny tcp 192.168.40.0 0.0.0.255 host 10.0.0.50 eq 21\n 20 permit ip any any\ninterface GigabitEthernet0/1\n ip access-group DENY_FTP_ADMIN in\u003c/code>\u003c/pre>\u003cp>Assume the interface is the source LAN gateway, so inbound is near source. It preserves the original numbered policy exactly. Port 21 is the FTP control connection; blocking it is the stated policy, not a complete account of every possible FTP data-channel scenario.\u003c/p>","refs":[{"sourceId":"src19","from":21,"to":21}]},{"sourceId":"src19","question":"Q13. A company's policy states: devices on the 192.168.77.0/24 subnet must not be able to establish new TCP connections to the internal server at 10.1.1.100, but replies to connections that the server itself initiates outward should still be allowed through. Identify the ACL type and the specific keyword needed to implement this policy correctly, and write the ACL statement(s) that would do it.   [LO5]","answerHtml":"\u003cp>Use an Extended ACL and place the TCP established permit before the deny. Assuming the interface receives subnet 192.168.77.0/24 traffic:\u003c/p>\u003cpre>\u003ccode>ip access-list extended LIMIT_77_NEW_TCP\n 10 permit tcp 192.168.77.0 0.0.0.255 host 10.1.1.100 established\n 20 deny tcp 192.168.77.0 0.0.0.255 host 10.1.1.100\n 30 permit ip any any\ninterface GigabitEthernet0/1\n ip access-group LIMIT_77_NEW_TCP in\u003c/code>\u003c/pre>\u003cp>Normal replies contain ACK/RST and pass line 10; a new initial SYN fails line 10 and drops at 20. Line 30 preserves unrelated traffic. Established only tests ACK/RST, so forged flags can pass: for genuine connection-state assurance deploy a stateful firewall.\u003c/p>","refs":[{"sourceId":"src19","from":22,"to":22}]}]},"m11":{"id":"m11","title":"VPN foundations and connection types","sections":[{"title":"Why a secure overlay is needed","html":"\u003cp>The internet is a public packet-switched network of networks. Packets cross infrastructure controlled by home networks, ISPs, exchanges and other organisations; reachability does not imply confidentiality, integrity or sender verification. Sniffing, ARP-based interception and transport attacks demonstrate the gap. Branches, remote staff and cloud systems still need to communicate over that infrastructure.\u003c/p>\u003cp>In this module, a VPN means a \u003cstrong>secure internet VPN\u003c/strong> combining tunneling/encapsulation, encryption and authentication, usually with integrity protection too. Confidentiality limits who can read data; integrity detects modification; authentication verifies the peer/user. These are distinct guarantees and depend on correct configuration and algorithms.\u003c/p>","refs":[{"sourceId":"src20","from":5,"to":7}]},{"title":"Packet path: tunnel versus secure VPN","html":"\u003cul>\u003cli>Authenticate a peer and negotiate compatible algorithms/session keys using an appropriate key exchange.\u003c/li>\u003cli>Encapsulate protected traffic so it can cross the public path; a tunnel outer header identifies tunnel endpoints.\u003c/li>\u003cli>Apply encryption and integrity protection according to the chosen protocol/mode; enough outer information remains visible for forwarding.\u003c/li>\u003cli>At the far endpoint, verify/decrypt, remove encapsulation and deliver the original traffic.\u003c/li>\u003c/ul>\u003ctable>\u003cthead>\u003ctr>\u003cth>Mechanism\u003c/th>\u003cth>Contribution\u003c/th>\u003cth>Missing if used alone\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u00
