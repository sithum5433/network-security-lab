3ctd>Plain GRE tunnel\u003c/td>\u003ctd>Wraps one network-layer payload in GRE/IP; can carry multicast, routing traffic and multiple protocol types\u003c/td>\u003ctd>No encryption, cryptographic integrity or peer authentication\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IPsec/TLS secure VPN\u003c/td>\u003ctd>Adds negotiated cryptographic protection and authenticated endpoints\u003c/td>\u003ctd>Still depends on endpoint security, allowed routes and policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GRE over IPsec\u003c/td>\u003ctd>GRE provides flexible transport; IPsec protects the resulting GRE traffic\u003c/td>\u003ctd>Additional headers/processing; must correctly select endpoint traffic for protection\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The lecture phrase “every VPN is a tunnel plus encryption” describes its secure-internet-VPN scope. Broader industry uses of VPN can include private provider isolation without encryption; do not let the broad label substitute for checking the actual security properties. Tunnel protection ends at the VPN endpoint: a VPN is not automatically end-to-end application encryption.\u003c/p>","refs":[{"sourceId":"src20","from":8,"to":12}]},{"title":"Two independent classification axes","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Axis\u003c/th>\u003cth>Choices\u003c/th>\u003cth>What to evaluate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Deployment form\u003c/td>\u003ctd>Software on a general-purpose endpoint/server; dedicated hardware/appliance/accelerated gateway\u003c/td>\u003ctd>CPU and sustained throughput, management location, upfront cost and scale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connection purpose\u003c/td>\u003ctd>Remote Access (user→network); Site-to-Site (network→network)\u003c/td>\u003ctd>Which endpoints connect, whether users initiate access, required persistence and scope\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Variants\u003c/td>\u003ctd>Personal and Mobile build on Remote Access; Cloud usually builds on Site-to-Site\u003c/td>\u003ctd>Provider trust, roaming persistence or managed cloud endpoint\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Software examples: OpenVPN clients, built-in OS clients, Cisco AnyConnect and ordinary server VPN applications. Hardware examples: VPN concentrators, Cisco ISR/ASR routers and ASA firewalls. Software is flexible and inexpensive but shares CPU with the host; hardware centralises aggregate encryption and may accelerate it, at higher purchase cost. A software client can connect to a hardware gateway: the axes are not mutually exclusive.\u003c/p>","refs":[{"sourceId":"src20","from":14,"to":17}]},{"title":"Remote Access and Site-to-Site: the two main purposes","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Dimension\u003c/th>\u003cth>Remote Access\u003c/th>\u003cth>Site-to-Site\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Connects\u003c/td>\u003ctd>One user/device to an organisation\u003c/td>\u003ctd>Whole networks via gateways\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Operation\u003c/td>\u003ctd>User authenticates to central gateway; client commonly required\u003c/td>\u003ctd>Persistent gateway-managed tunnel; ordinary end devices need no VPN client\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Traffic choice\u003c/td>\u003ctd>Full tunnel routes all chosen internet traffic through gateway; split tunnel sends only selected/private destinations\u003c/td>\u003ctd>Gateway selects networks/traffic between sites\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Capacity\u003c/td>\u003ctd>Modest per user but total concurrent-user gateway load matters\u003c/td>\u003ctd>Sustained aggregate traffic for an entire site\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Limits\u003c/td>\u003ctd>User internet quality, client updates, unmanaged/compromised endpoint risk\u003c/td>\u003ctd>Per-site setup, gateway/routing dependency, redundancy needed for resilience\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cost\u003c/td>\u003ctd>Relatively low per user; scales with concurrent sessions\u003c/td>\u003ctd>More per-site upfront cost; efficient per user at scale and often cheaper than leased lines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>Accounting staff working from home reach file/practice applications\u003c/td>\u003ctd>Retail chain with 15 stores accesses HQ inventory/POS automatically\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Site-to-Site often uses hardware but software gateways can fit smaller workloads. Remote Access gateways can likewise be software or appliances. Split tunneling improves some performance/routing needs but changes which traffic receives organisational inspection; choose deliberately against the requirements.\u003c/p>","refs":[{"sourceId":"src20","from":19,"to":24}]},{"title":"Personal, Mobile and Cloud variants","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>What it connects / why\u003c/th>\u003cth>Deployment, throughput and cost\u003c/th>\u003cth>Limits and scenario\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Personal\u003c/td>\u003ctd>Individual to commercial provider exit, for public-path privacy/apparent location rather than employer resources\u003c/td>\u003ctd>Provider app; variable capacity/server load; consumer subscription or free-service trade-offs\u003c/td>\u003ctd>Trust provider with exit visibility; HTTPS still protects beyond exit. Journalist on café/airport WiFi needing provider exits in different countries.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile\u003c/td>\u003ctd>Roaming individual to organisation while switching WiFi/cellular paths\u003c/td>\u003ctd>Software client plus gateway with mobility support; variable access-network speed; remote-access-like licensing plus possible gateway cost\u003c/td>\u003ctd>Persistence/virtual identity across changes adds complexity/battery use. Home-visit nursing tablets or delivery/dispatch tablets should not repeatedly log in.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud\u003c/td>\u003ctd>On-premises network to a public cloud virtual network through managed cloud gateway\u003c/td>\u003ctd>On-premises hardware/software gateway; provider-managed virtual gateway, commonly IPsec; tier-dependent throughput; fixed gateway and transfer charges\u003c/td>\u003ctd>Provider-specific configuration/limits; manufacturer sends factory analytics to cloud, or disaster-recovery replication.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>A personal VPN does not establish a corporate trust relationship; it encrypts to the service provider, who then forwards traffic. A mobile VPN must specifically support path changes; an ordinary VPN app running on a phone does not automatically supply seamless mobility. Cloud VPN is network-to-network even though one gateway is virtual and managed.\u003c/p>","refs":[{"sourceId":"src20","from":25,"to":34}]},{"title":"Scenario recommendation checklist","html":"\u003cp>Identify endpoints first (one roaming user, fixed network or on-premises/cloud network). Then match persistence and applications, peak aggregate throughput, client-management capacity, gateway redundancy, cost model and which party must be trusted. Give a recommendation before listing trade-offs.\u003c/p>\u003cul>\u003cli>Home workers with full internal resource access: Remote Access, centrally authenticated clients and a gateway sized for concurrent users.\u003c/li>\u003cli>High-volume permanent branch transactions without user action: Site-to-Site gateways, suitably sized and redundant.\u003c/li>\u003cli>Drivers switching WiFi/cellular while keeping dispatch sessions: Mobile VPN with supported gateway mobility.\u003c/li>\u003cli>Factory-to-cloud automatic analytics: Cloud VPN, a managed cloud endpoint and on-premises gateway.\u003c/li>\u003cli>Consumer public-WiFi privacy through a chosen provider: Personal VPN, while retaining HTTPS and assessing provider trust.\u003c/li>\u003c/ul>","refs":[{"sourceId":"src20","from":34,"to":36}]}],"quiz":[{"question":"Which property does GRE alone supply?","options":["Confidentiality","Cryptographic peer identity","Encapsulation","Guaranteed integrity"],"answer":2,"explanation":"GRE carries packets across another network but does not add cryptographic protection by itself.","refs":[{"sourceId":"src20","from":10,"to":12}]},{"question":"Hardware versus software VPN is primarily classification by:","options":["Connection purpose","Deployment form","Certificate revocation","Routing metric"],"answer":1,"explanation":"This axis describes implementation and resource use, independent of who connects.","refs":[{"sourceId":"src20","from":14,"to":17}]},{"question":"Which design best fits 15 branch stores with always-on aggregate POS traffic?","options":["Personal VPN subscription per cashier","Site-to-Site gateways","Clientless timesheet portal only","Plain GRE for confidentiality"],"answer":1,"explanation":"Network-to-network gateways operate transparently and can handle aggregate site traffic.","refs":[{"sourceId":"src20","from":22,"to":24}]},{"question":"A driver must retain dispatch access while moving between cellular and WiFi. Best type?","options":["Mobile VPN","RIPv1","WAF","Static software firewall alone"],"answer":0,"explanation":"Mobile VPN specifically adds session persistence across underlying network changes.","refs":[{"sourceId":"src20","from":28,"to":30}]},{"question":"Which is a key Personal VPN limitation?","options":["It necessarily reveals TLS plaintext to everyone","The provider becomes a trust/visibility point at the exit","It connects every branch automatically","It uses no software"],"answer":1,"explanation":"It protects the path to the provider; independent destination encryption still matters.","refs":[{"sourceId":"src20","from":25,"to":27}]},{"question":"Which VPN is chiefly a Site-to-Site variant?","options":["Mobile","Personal","Cloud","A browser tab"],"answer":2,"explanation":"Cloud VPN links on-premises and cloud virtual networks through gateways.","refs":[{"sourceId":"src20","from":31,"to":33}]},{"question":"For Remote Access gateway sizing, what matters beyond one user's modest traffic?","options":["Aggregate concurrent users and traffic","Only the smallest source port","The number of routing areas alone","Whether client monitors are large"],"answer":0,"explanation":"Gateway resources must support the simultaneous users' combined load.","refs":[{"sourceId":"src20","from":20,"to":21}]},{"question":"Which statement about a VPN endpoint is correct?","options":["It guarantees that an infected device is clean","Security depends on endpoints as well as the tunnel","It makes every application anonymous","It validates all BGP origins"],"answer":1,"explanation":"A compromised endpoint may carry its existing risks into an authenticated private network.","refs":[{"sourceId":"src20","from":20,"to":20}]}],"tutorialAnswers":[{"sourceId":"src21","question":"Q1. Explain why the internet's fundamental design creates a need for VPNs, rather than confidentiality being an inherent property of the network itself.   [LO3]","answerHtml":"\u003cp>The internet prioritises packet delivery across independently run networks. A packet may traverse many operators and untrusted local segments, so a routable path does not itself prevent sniffing, modification or spoofing. A secure VPN overlays encryption, integrity and authenticated endpoints when organisations must use that public infrastructure; confidentiality must be supplied explicitly.\u003c/p>","refs":[{"sourceId":"src21","from":8,"to":8}]},{"sourceId":"src21","question":"Q2. Explain what a VPN is, and describe the three things it combines to achieve confidentiality, integrity, and authentication.   [LO3]","answerHtml":"\u003cp>In the lecture's scope, a VPN is a secure encrypted connection over a public network that carries private communications. It combines tunneling to encapsulate traffic, encryption to keep payload confidential, and authentication to verify the peer/user. Integrity protection detects tampering; secure protocol choices make these mechanisms work together.\u003c/p>","refs":[{"sourceId":"src21","from":9,"to":9}]},{"sourceId":"src21","question":"Q3. Explain the difference between a tunnel and a VPN. Give a specific real-world example of a tunnel that is not a VPN, and explain why it fails to qualify as one.   [LO3, LO4]","answerHtml":"\u003cp>A tunnel encapsulates one protocol in another so traffic can be transported across a path; it need not provide any secrecy or identity checks. Plain GRE over the internet is the example: it wraps traffic but leaves it readable and lacks cryptographic authentication. A secure VPN adds actual security properties to its transport mechanism.\u003c/p>","refs":[{"sourceId":"src21","from":10,"to":10}]},{"sourceId":"src21","question":"Q4. GRE over IPsec combines a tunnel with a VPN technology. Explain what each component contributes to this combination, and why using GRE alone would not be sufficient for a security-conscious organisation.   [LO4]","answerHtml":"\u003cp>GRE carries flexible payloads, including multicast/dynamic-routing traffic in this course's conventional design. IPsec encrypts and authenticates the GRE packets across the public path. GRE alone would expose sensitive payload to observers and cannot detect deliberate modification. The combination separates the transport requirement from the security requirement.\u003c/p>","refs":[{"sourceId":"src21","from":11,"to":11}]},{"sourceId":"src21","question":"Q5. Explain the difference between the deployment form axis (software versus hardware) and the connection purpose axis used to classify VPNs this week. Why are these treated as independent questions rather than a single list of types?   [LO3, LO4]","answerHtml":"\u003cp>Deployment form asks how it is implemented and where cryptographic work runs: host/server software or dedicated/accelerated appliances. Connection purpose asks who it links: individual-to-network, network-to-network and the relevant variants. A hardware gateway can serve software Remote Access clients or another Site-to-Site gateway, so the questions are independent.\u003c/p>","refs":[{"sourceId":"src21","from":13,"to":13}]},{"sourceId":"src21","question":"Q6. A company is deciding between a software-based and a hardware-based VPN gateway for a site connecting hundreds of employees' traffic. Evaluate which deployment form is more appropriate, and justify your answer using at least two dimensions such as cost, performance, or scalability.   [LO3, LO4]","answerHtml":"\u003cp>A suitably sized hardware/accelerated gateway is a strong choice for hundreds of employees' sustained aggregate site traffic. It offloads cryptography and centralises capacity/management, usually giving more predictable high throughput, but has higher upfront cost and needs resilience planning. A software gateway may be cheaper/flexible and sufficient if benchmarked on capable hardware; choose using measured workload and feature requirements rather than the label alone.\u003c/p>","refs":[{"sourceId":"src21","from":14,"to":14}]},{"sourceId":"src21","question":"Q7. Explain why Personal VPN and Mobile VPN are both described as variants of Remote Access VPN, rather than being entirely separate categories.   [LO4]","answerHtml":"\u003cp>Both connect an individual through a remote endpoint. Personal VPN changes the destination/purpose to a commercial internet exit for general browsing privacy/location. Mobile VPN keeps the organisation-access model but adds continuity across changing access networks. They refine the Remote Access purpose rather than becoming whole-network gateway-to-gateway links.\u003c/p>","refs":[{"sourceId":"src21","from":16,"to":16}]},{"sourceId":"src21","question":"Q8. Explain why Cloud VPN is described as a variant of Site-to-Site VPN specifically, rather than Remote Access.   [LO4]","answerHtml":"\u003cp>Cloud VPN links the on-premises network to a cloud virtual network using local and cloud-managed gateways. That is network-to-network with continuous transparent traffic, like Site-to-Site; it is not fundamentally a single employee's client-initiated session. One endpoint being provider-managed changes deployment/administration, not the connection relationship.\u003c/p>","refs":[{"sourceId":"src21","from":17,"to":17}]},{"sourceId":"src21","question":"Q9. A logistics company has drivers using tablets that must remain connected to a central dispatch system while moving between cellular and WiFi networks throughout the day. Recommend the most appropriate VPN type for this scenario, and justify your recommendation using at least two specific requirements from the scenario.   [LO3, LO4]","answerHtml":"\u003cp>Recommend Mobile VPN supported by both tablets and the dispatch gateway. It preserves the logical secure session across WiFi/cellular changes and avoids repeated re-authentication while drivers move, matching the explicit uninterrupted-connectivity requirement. An ordinary static Remote Access setup may reconnect when the underlying address/path changes. Account for mobile bandwidth variability, battery and endpoint security.\u003c/p>","refs":[{"sourceId":"src21","from":18,"to":18}]},{"sourceId":"src21","question":"Q10. A financial services firm needs to connect its headquarters to three branch offices with a permanent, always-on connection carrying high transaction volumes, with no individual staff member managing their own VPN connection. Recommend the most appropriate VPN type, and explain what would go wrong if Remote Access VPN were used instead.   [LO3, LO4]","answerHtml":"\u003cp>Recommend Site-to-Site VPN between HQ and each branch, with gateways sized for aggregate transaction throughput and redundant paths/devices as required. It is persistent and transparent to staff. Per-user Remote Access would introduce client installation, user initiation/session management and scaling that do not match the automatic whole-branch requirement; multiple clients are unnecessary when the sites themselves are stable endpoints.\u003c/p>","refs":[{"sourceId":"src21","from":19,"to":19}]},{"sourceId":"src21","question":"Q11. Compare Personal VPN and Remote Access VPN. Both involve an individual user connecting through a tunnel, so what is the key difference in what each one is actually connecting to, and why does that difference change where the user's trust has to be placed?   [LO4]","answerHtml":"\u003cp>Organisational Remote Access connects a user to employer-controlled internal resources and central access policy. Personal VPN connects to a provider's internet exit, shifting trust for the exit path to that commercial provider. Both encrypt a path, but the provider can observe traffic not independently encrypted after exit; HTTPS remains useful. Neither guarantees a trustworthy endpoint or total anonymity.\u003c/p>","refs":[{"sourceId":"src21","from":20,"to":20}]},{"sourceId":"src21","question":"Q12. A manufacturing company wants to connect its on-premises factory network to a data analytics platform hosted by a cloud provider, with continuous automatic data flow and no physical VPN hardware to manage inside the cloud provider's own infrastructure. Identify the most appropriate VPN type and justify your answer against the other Site-to-Site option.   [LO3, LO4]","answerHtml":"\u003cp>Recommend Cloud VPN: an on-premises gateway connects persistently to the cloud provider's managed virtual gateway, normally using IPsec. It supports continuous network-to-network analytics transfer without the customer managing physical cloud hardware. It is still Site-to-Site in purpose, but the managed cloud endpoint and its charging/configuration model distinguish it from a conventional branch-to-branch deployment.\u003c/p>","refs":[{"sourceId":"src21","from":21,"to":21}]}]},"m12":{"id":"m12","title":"IPsec, TLS VPN and Cisco configuration","sections":[{"title":"IPsec framework: every row has a job","html":"\u003cp>IPsec is a network-layer framework for protecting selected IP traffic transparently to applications. AH and ESP provide data-plane security; IKE authenticates peers and negotiates keys/Security Associations. The lecture's image-only framework contains the following historical choices; they are not all suitable for modern deployments.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Lecture menu\u003c/th>\u003cth>Meaning / qualification\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>IPsec protocol\u003c/td>\u003ctd>AH; ESP; ESP + AH\u003c/td>\u003ctd>AH: integrity/data-origin authentication, no encryption. ESP: confidentiality and/or integrity/authentication depending on transforms; use an appropriate authenticated design.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>DES, 3DES, AES, SEAL\u003c/td>\u003ctd>DES: 56-bit key; 3DES applies DES three times; AES: 128/192/256-bit keys; diagram SEAL: 160-bit. DES/3DES are obsolete choices for new VPN design; SEAL is historical, not a modern recommendation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>MD5, SHA\u003c/td>\u003ctd>Diagram means MD5 128-bit digest and SHA-1 160-bit digest. These are digest lengths, not secret-key lengths; prefer supported SHA-2/AEAD designs rather than ranking solely by length.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Peer authentication\u003c/td>\u003ctd>PSK; RSA/certificates\u003c/td>\u003ctd>PSK proves shared-secret possession; certificate authentication verifies signatures and validates identity/key binding.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Diffie-Hellman key exchange\u003c/td>\u003ctd>DH1, DH2, DH5, DH…; diagram also 14/15/16/19/20/21/24\u003c/td>\u003ctd>Select compatible sufficiently strong groups; group IDs are identifiers, not a universal numeric security ladder.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Image examples include AH + no encryption + SHA + PSK + DH2 and ESP+AH + DES + SHA + RSA + DH2. They illustrate independent function choices, but neither is a modern secure template: the first lacks confidentiality and both use obsolete DH2. See \u003ca href=\"https://www.rfc-editor.org/rfc/rfc4301.html\">RFC 4301, IPsec architecture\u003c/a> for algorithm independence and security-service scope.\u003c/p>","refs":[{"sourceId":"src22","from":5,"to":9}]},{"title":"Correctly separate algorithms, keys and authentication","html":"\u003cp>Encryption hides data; an integrity MAC/AEAD detects forgery; peer authentication establishes identity/key possession; DH establishes a shared secret. Unauthenticated DH alone does not prove who is at the other end. The slide's “both sides hash their authentication key with identity” diagram is a conceptual shared-secret illustration, not a literal description of certificate/RSA authentication: certificate methods use digital signatures.\u003c/p>\u003cp>The lecture proposes DH14 as a realistic minimum on compatible lab equipment. DH2 is 1024-bit MODP and DH5 is 1536-bit MODP; DH14 is 2048-bit MODP. Equipment limited to group 5 cannot meet that requirement merely by selecting its highest offered value: upgrade/use capable equipment for the protected deployment, or clearly confine legacy choices to a simulation. Consider compatibility and security family, not largest group number. \u003ca href=\"https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_conn_vpnips/configuration/xe-3s/sec-sec-for-vpns-w-ipsec-xe-3s-book/sec-cfg-vpn-ipsec.html\">Cisco IPsec configuration guidance\u003c/a> advises against DES, 3DES, MD5 and DH groups 1/2/5.\u003c/p>\u003cp>RSA signatures and PSK authentication are separate methods; see \u003ca href=\"https://www.rfc-editor.org/rfc/rfc7296.html\">RFC 7296, IKEv2 authentication\u003c/a>. The old image's left-to-right security arrow cannot establish that SEAL is stronger than AES merely from a displayed bit count.\u003c/p>","refs":[{"sourceId":"src22","from":6,"to":9}]},{"title":"IKE phases, Security Associations and packet modes","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Concept\u003c/th>\u003cth>What is protected / negotiated\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>IKEv1 Phase 1\u003c/td>\u003ctd>Authenticate peers and create the ISAKMP/IKE SA, protecting subsequent negotiation traffic; agree IKE encryption, integrity, DH and lifetime.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IKEv1 Phase 2\u003c/td>\u003ctd>Use that protected channel to negotiate IPsec data SAs and transforms/selectors. Refresh data keys without repeating the full initial peer setup every time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transport mode\u003c/td>\u003ctd>Retain original IP header; ESP protects transport payload rather than encapsulating the whole original IP packet. Common host-to-host or GRE protection use.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tunnel mode\u003c/td>\u003ctd>Wrap the complete original IP packet within a new outer IP packet between gateways. ESP can conceal original internal addresses and payload.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AH mode qualification\u003c/td>\u003ctd>AH can operate in either mode but neither mode provides confidentiality; “encrypts in tunnel mode” applies to ESP encryption, not AH.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The lecture's two phases and \u003ccode>crypto isakmp\u003c/code> commands describe IKEv1. IKEv2 uses exchanges such as IKE_SA_INIT and IKE_AUTH and negotiates CHILD_SAs; do not present “two phases” as universal IKE syntax. AH authenticates selected IP-header fields and is incompatible with ordinary NAT modification. ESP crossing NAT commonly uses NAT Traversal. A secure tunnel still requires matching peer parameters and appropriate selectors.\u003c/p>","refs":[{"sourceId":"src22","from":10,"to":12}]},{"title":"TLS VPN: five functional blocks","html":"\u003cp>“SSL VPN” is the product/category name here; modern secure deployments use TLS rather than obsolete SSL protocols. Peers negotiate compatible algorithms instead of assuming one fixed cipher. A weak permitted option can undermine the resulting connection even when other functions are strong.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Block\u003c/th>\u003cth>Job\u003c/th>\u003cth>Historical / weak choices\u003c/th>\u003cth>Stronger choices / qualification\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Protocol version\u003c/td>\u003ctd>Rules governing the session\u003c/td>\u003ctd>SSLv3, TLS 1.0/1.1 deprecated\u003c/td>\u003ctd>TLS 1.3 preferred where supported; carefully configured TLS 1.2 remains in use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key exchange\u003c/td>\u003ctd>Establish shared secret\u003c/td>\u003ctd>Static RSA exchange has no forward secrecy\u003c/td>\u003ctd>DHE/ECDHE with suitable parameters; distinguish RSA certificate signature from static RSA key exchange\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bulk encryption\u003c/td>\u003ctd>Protect application records\u003c/td>\u003ctd>DES, RC4 insecure; 3DES deprecated; AES-CBC legacy compared with AEAD\u003c/td>\u003ctd>AES-GCM or ChaCha20-Poly1305; plain ChaCha20 alone needs an integrity design\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity / MAC\u003c/td>\u003ctd>Detect tampering\u003c/td>\u003ctd>Legacy MD5/SHA-1 choices\u003c/td>\u003ctd>SHA-256/384 where appropriate; AEAD integrates record integrity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Identity / PKI\u003c/td>\u003ctd>Bind expected peer identity to key\u003c/td>\u003ctd>Weak/invalid certificate signatures, keys or trust validation\u003c/td>\u003ctd>X.509 certificate with validated name, chain, validity and acceptable algorithms; optional client certificates\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>In TLS 1.2, a name such as TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 bundles several choices. TLS 1.3 suite TLS_AES_128_GCM_SHA256 selects AEAD and HKDF hash; group/key share and certificate/signature negotiation are separate. Its SHA256 is not a separate record MAC. See \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8446.html\">RFC 8446, TLS 1.3\u003c/a>. The lecture's “TLS 1.2 + RSA + AES-CBC + SHA-1” versus “TLS 1.3 + ECDHE + AES-GCM + integrated integrity” compares configurations, not complete universal suite syntax.\u003c/p>","refs":[{"sourceId":"src22","from":14,"to":18}]},{"title":"TLS VPN access modes and comparison with IPsec","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>Access / client\u003c/th>\u003cth>Best fit and limits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Clientless portal\u003c/td>\u003ctd>Browser accesses a limited set of published web applications\u003c/td>\u003ctd>Occasional contractor using one timesheet site; narrow privilege, no full agent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thin-client / port forwarding\u003c/td>\u003ctd>Small helper extends selected TCP applications\u003c/td>\u003ctd>Intermediate scope; the lecture's applet examples are legacy and support varies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Full-tunnel client\u003c/td>\u003ctd>Installed agent such as AnyConnect carries broad network access over secure transport\u003c/td>\u003ctd>Staff needing many internal applications; client management and gateway policy still required\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>IPsec\u003c/th>\u003cth>TLS VPN\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Layer/scope\u003c/td>\u003ctd>Protect selected IP traffic at L3; application transparent\u003c/td>\u003ctd>Uses TLS above transport; portal selective, full client can provide broad network access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client\u003c/td>\u003ctd>Gateway-to-gateway needs no user client; remote users often use client\u003c/td>\u003ctd>Browser in portal mode; agent for full tunnel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NAT/firewalls\u003c/td>\u003ctd>AH conflicts with NAT; ESP often needs NAT-T\u003c/td>\u003ctd>Typically uses HTTPS/TCP 443 and traverses common NAT/firewall policies more easily; not guaranteed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Access granularity\u003c/td>\u003ctd>Traffic selectors/firewall policy can restrict networks and services\u003c/td>\u003ctd>Portal may narrowly expose applications/URLs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical use\u003c/td>\u003ctd>Persistent site links and full-network remote access\u003c/td>\u003ctd>Individual remote access, especially application-specific portal access\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Avoid reading “IPsec = all-or-nothing” literally: selectors and filtering can be granular. Likewise a full TLS tunnel can reach broad networks. Recommend using the access requirement, deployment form and policy rather than a universal claim that one protocol is better.\u003c/p>","refs":[{"sourceId":"src22","from":19,"to":21}]},{"title":"Cisco GRE and the four-step IPsec template","html":"\u003cp>GRE is a logical Tunnel interface with its own link IP, a real source interface/address and a routable remote destination. This template alone is unencrypted:\u003c/p>\u003cpre>\u003ccode>interface Tunnel0\n ip address 10.10.10.1 255.255.255.252\n tunnel source GigabitEthernet0/0\n tunnel destination 203.0.113.10\u003c/code>\u003c/pre>\u003cp>\u003cstrong>1. IKEv1 Phase 1 policy and peer PSK:\u003c/strong> define negotiation protection, authentication method, DH and lifetime, then bind the shared key to the remote peer.\u003c/p>\u003cpre>\u003ccode>crypto isakmp policy 10\n encryption aes\n hash sha256\n authentication pre-share\n group 14\n lifetime 86400\nexit\ncrypto isakmp key MySharedKey address 203.0.113.10\u003c/code>\u003c/pre>\u003cp>\u003cstrong>2. Phase 2 transform set:\u003c/strong> selects ESP encryption/integrity for data traffic.\u003c/p>\u003cpre>\u003ccode>crypto ipsec transform-set MYSET esp-aes esp-sha256-hmac\u003c/code>\u003c/pre>\u003cp>\u003cstrong>3. Interesting traffic ACL:\u003c/strong> selects which local-to-remote traffic is protected, rather than serving as an interface permit/deny list.\u003c/p>\u003cpre>\u003ccode>access-list 100 permit ip 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255\u003c/code>\u003c/pre>\u003cp>\u003cstrong>4. Crypto map and interface:\u003c/strong> binds remote peer, transform set and ACL, then activates the map on the public egress interface.\u003c/p>\u003cpre>\u003ccode>crypto map MYMAP 10 ipsec-isakmp\n set peer 203.0.113.10\n set transform-set MYSET\n match address 100\nexit\ninterface GigabitEthernet0/0\n crypto map MYMAP\u003c/code>\u003c/pre>\u003cp>The supplied commands are conceptual IOS/IKEv1 templates; exact algorithm support varies by platform/Packet Tracer version. Configure the other peer with compatible parameters, reciprocal selectors, correct addressing/routing and appropriate NAT handling. Replace the illustrative PSK with the actual agreed secret. Nonmatching traffic follows ordinary routing/security policy; it is not encrypted merely because a crypto map exists.\u003c/p>","refs":[{"sourceId":"src22","from":23,"to":27}]},{"title":"GRE over IPsec: classify the outer GRE traffic","html":"\u003cp>First create a working GRE tunnel, then configure IPsec to protect the packets produced by GRE. The encryption selector therefore matches GRE between the real tunnel endpoint addresses, not just each individual inner subnet. GRE is IP protocol 47, not TCP/UDP port 47.\u003c/p>\u003cpre>\u003ccode>! Example real endpoints: local 198.51.100.1, remote 203.0.113.10\naccess-list 100 permit gre host 198.51.100.1 host 203.0.113.10\u003c/code>\u003c/pre>\u003cp>Use that selector in the crypto map. The remote peer uses reciprocal endpoints. Original data and routing/multicast payload are inside GRE, and IPsec protects the GRE packet over the public path. This conventional design provides flexible carriage plus security; it adds encapsulation overhead and requires attention to routes/MTU. Other modern route-based IPsec designs exist, so “IPsec cannot carry routing” should be read within the lecture's policy-based examples.\u003c/p>","refs":[{"sourceId":"src22","from":28,"to":30}]}],"quiz":[{"question":"An AH-only tunnel is configured. Which requirement remains unmet?","options":["Integrity","Origin authentication","Confidentiality","IP encapsulation capability"],"answer":2,"explanation":"AH never encrypts; use appropriate ESP encryption when secrecy is required.","refs":[{"sourceId":"src22","from":6,"to":11}]},{"question":"Which component in the supplied Cisco template protects actual data traffic?","options":["Phase 2 IPsec transform set/SAs","Only the router hostname","A RIP Request","The browser history"],"answer":0,"explanation":"Phase 1 protects negotiation; Phase 2 parameters define data protection.","refs":[{"sourceId":"src22","from":10,"to":25}]},{"question":"What remains visible with ESP transport mode?","options":["The original IP header","Every encrypted payload byte","The peer PSK","The AES key"],"answer":0,"explanation":"Transport mode retains original addressing; tunnel mode can hide the inner packet under an outer header.","refs":[{"sourceId":"src22","from":11,"to":11}]},{"question":"Which TLS VPN mode best fits a contractor needing only one web timesheet?","options":["Full unrestricted network access by default","Clientless portal with limited application access","Plain GRE only","RIPv1 authentication"],"answer":1,"explanation":"A browser portal can expose the one authorised web resource without a full installed tunnel agent.","refs":[{"sourceId":"src22","from":19,"to":19}]},{"question":"Which statement about TLS 1.3 suite names is accurate?","options":["They contain all certificate and key-exchange choices","They choose AEAD and hash; key agreement/authentication are negotiated separately","They require static RSA exchange","They always use separate MD5 record MACs"],"answer":1,"explanation":"TLS 1.3 separates the suite from group/key-share and signature/certificate choices.","refs":[{"sourceId":"src22","from":15,"to":18}]},{"question":"A packet does not match the VPN interesting-traffic ACL. What does this ACL alone normally do?","options":["Automatically encrypt it anyway","Classify it outside this VPN; ordinary routing/security policy applies","Automatically erase it from every interface","Convert it to AH"],"answer":1,"explanation":"The crypto selector controls protection, unlike an interface filter that drops unmatched traffic.","refs":[{"sourceId":"src22","from":26,"to":27}]},{"question":"GRE over IPsec's selector should normally match:","options":["TCP destination port 47","GRE IP protocol 47 between tunnel endpoints","Only the innermost application port","Every global address regardless of path"],"answer":1,"explanation":"IPsec protects the packet after GRE encapsulation, so match the outer GRE endpoints/protocol.","refs":[{"sourceId":"src22","from":28,"to":28}]},{"question":"Equipment only supports DH groups 1, 2 and 5. Best security evaluation?","options":["Group 5 becomes equivalent to DH14","The equipment cannot meet a requirement for stronger supported groups; upgrade or use a suitable alternative","Use DES to compensate","Disable peer authentication"],"answer":1,"explanation":"Choosing the highest supported legacy group does not make it sufficiently strong.","refs":[{"sourceId":"src22","from":9,"to":9}]}],"tutorialAnswers":[{"sourceId":"src23","question":"Q1. Explain why IPsec is described as a modular framework rather than a single fixed protocol. Use the IPsec Protocol row specifically (AH, ESP, ESP+AH) to illustrate your answer.   [LO3, LO4]","answerHtml":"\u003cp>IPsec specifies cooperating security functions with interchangeable algorithms rather than one fixed cipher. In the protocol row, AH supplies integrity/data-origin authentication without encryption; ESP can add confidentiality with appropriate transforms; historical designs may combine ESP and AH. The remaining rows choose encryption, integrity, peer authentication and DH parameters. Their compatibility and strength must be evaluated together.\u003c/p>","refs":[{"sourceId":"src23","from":8,"to":8}]},{"sourceId":"src23","question":"Q2. Explain the difference between AH and ESP, and explain why ESP or ESP+AH is used far more often than AH alone in real deployments.   [LO4]","answerHtml":"\u003cp>AH authenticates payload and selected IP-header fields but never encrypts. ESP encrypts when configured with an encryption transform and commonly provides integrity/authentication too. Secure internet deployments usually need confidentiality, so ESP is much more useful than AH alone; AH also interacts poorly with NAT. Combining ESP+AH is possible, but modern ESP authenticated designs commonly meet the needed goals without both.\u003c/p>","refs":[{"sourceId":"src23","from":9,"to":9}]},{"sourceId":"src23","question":"Q3. Explain the two phases of IKE negotiation, and explain why splitting negotiation into two phases is more efficient than negotiating everything at once, every time.   [LO4]","answerHtml":"\u003cp>In the lecture's IKEv1 model, Phase 1 authenticates peers and establishes the ISAKMP/IKE SA that protects negotiation. Phase 2 uses it to negotiate IPsec SAs protecting actual data, including transforms and selectors. Data keys can be refreshed without repeating all initial peer authentication each time. IKEv2 uses different named exchanges rather than this exact two-phase terminology.\u003c/p>","refs":[{"sourceId":"src23","from":10,"to":10}]},{"sourceId":"src23","question":"Q4. Explain the difference between IPsec transport mode and tunnel mode, and explain which mode a site-to-site VPN would use and why.   [LO4]","answerHtml":"\u003cp>ESP transport mode protects the original packet's payload while retaining its IP header. Tunnel mode encapsulates the whole original IP packet inside a new outer IP packet and can hide original internal addresses. A conventional gateway-to-gateway Site-to-Site VPN uses ESP tunnel mode because the public endpoints are gateways while the original communicating hosts use private network addresses. AH can also have transport/tunnel modes but never encrypts either.\u003c/p>","refs":[{"sourceId":"src23","from":11,"to":11}]},{"sourceId":"src23","question":"Q5. A network administrator has configured an IPsec tunnel using AH only, believing this protects the confidentiality of the data being sent. Evaluate this configuration and explain the security gap in the administrator's reasoning.   [LO3, LO4]","answerHtml":"\u003cp>The administrator confuses integrity with confidentiality. AH can detect unauthorised modification and authenticate packet origin, but captured payload remains readable. Tunnel encapsulation does not change this. Choose ESP with suitable encryption and integrity/authentication transforms, alongside authenticated key exchange, if confidentiality is required.\u003c/p>","refs":[{"sourceId":"src23","from":12,"to":12}]},{"sourceId":"src23","question":"Q6. Using the IPsec framework's Diffie-Hellman row, explain why choosing DH14 over DH2 is not simply a matter of preference. What would you tell an administrator who wanted to use the highest available Diffie-Hellman group on a piece of equipment that only supports up to Group 5?   [LO3, LO4]","answerHtml":"\u003cp>DH2 uses 1024-bit MODP, while DH14 uses 2048-bit MODP and provides stronger resistance to discrete-log attacks. The lecture identifies DH14 as a practical minimum. A device limited to DH5 cannot satisfy that requirement by picking its highest menu option; upgrade firmware/hardware or select a capable gateway. A simulator may demonstrate concepts with legacy options, but that is not a production recommendation. Group identifiers are not a universal ranking across all mathematical families.\u003c/p>","refs":[{"sourceId":"src23","from":13,"to":13}]},{"sourceId":"src23","question":"Q7. Explain what a cipher suite is, and explain why TLS 1.3's approach to negotiating cipher suites is considered more tightly separated than TLS 1.2's.   [LO4]","answerHtml":"\u003cp>A cipher suite names negotiated cryptographic record/handshake choices, with exact meaning dependent on TLS version. TLS 1.2 suite names commonly bundle key exchange/authentication, cipher and MAC/hash. TLS 1.3 suites identify AEAD plus HKDF hash; key-share/group and certificate/signature algorithms are negotiated separately. This separation avoids treating every function as one inseparable named combination.\u003c/p>","refs":[{"sourceId":"src23","from":15,"to":15}]},{"sourceId":"src23","question":"Q8. For each of the five functional blocks in SSL/TLS (protocol version, key exchange, bulk encryption, integrity/MAC, and identity/PKI), name one deprecated option and one currently recommended option.   [LO4]","answerHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Block\u003c/th>\u003cth>Deprecated/weak example\u003c/th>\u003cth>Suitable stronger example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Protocol version\u003c/td>\u003ctd>SSLv3 or TLS 1.0/1.1\u003c/td>\u003ctd>TLS 1.3; configured TLS 1.2 where needed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key exchange\u003c/td>\u003ctd>Static RSA exchange, no forward secrecy\u003c/td>\u003ctd>ECDHE or suitable DHE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bulk encryption\u003c/td>\u003ctd>DES/RC4/3DES\u003c/td>\u003ctd>AES-GCM or ChaCha20-Poly1305\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity/MAC\u003c/td>\u003ctd>MD5 or legacy SHA-1 choices\u003c/td>\u003ctd>SHA-256/384 as applicable, or AEAD record integrity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Identity/PKI\u003c/td>\u003ctd>A certificate using weak RSA-1024/obsolete signatures or invalid trust checks\u003c/td>\u003ctd>Valid X.509 chain with adequate RSA/ECDSA key, acceptable signature, expected name and validity checks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The question is overbroad for identity/PKI: X.509 itself is not deprecated, and the slide supplies only X.509, not a named deprecated PKI alternative. Identify weak algorithms/validation within certificates rather than inventing an obsolete certificate “type.”\u003c/p>","refs":[{"sourceId":"src23","from":16,"to":16}]},{"sourceId":"src23","question":"Q9. Explain the difference between clientless (portal) mode and full tunnel client mode in SSL VPN, and recommend which mode is more appropriate for a contractor who only needs to access one internal web-based timesheet application, briefly, twice a month.   [LO3, LO4]","answerHtml":"\u003cp>Clientless portal mode exposes selected web resources through an ordinary browser; full-tunnel mode installs an agent providing broad network access. Choose a clientless, least-privilege portal for the contractor's single web timesheet used twice monthly. It avoids unnecessary client management and network reach while matching the actual application requirement.\u003c/p>","refs":[{"sourceId":"src23","from":17,"to":17}]},{"sourceId":"src23","question":"Q10. Compare IPsec and SSL VPN specifically on NAT traversal and access granularity. Why does SSL VPN tend to have an easier time crossing NAT and firewalls than IPsec?   [LO4]","answerHtml":"\u003cp>AH struggles with NAT because header changes invalidate authentication. ESP often needs NAT Traversal to cross address translation reliably. TLS VPN commonly rides HTTPS/TCP 443 that many firewalls/NATs already handle, so traversal is usually simpler, though policy can still block it. A portal can restrict access to specific apps/URLs; IPsec selectors/firewall rules can also be granular, so it is not inherently unrestricted access.\u003c/p>","refs":[{"sourceId":"src23","from":19,"to":19}]},{"sourceId":"src23","question":"Q11. A company wants remote employees to have full network-layer access to internal resources, equivalent to being physically in the office, while a separate group of external contractors should only reach one specific internal web application. Recommend which technology, IPsec or SSL VPN, and which SSL VPN mode if applicable, best fits each group, and justify both recommendations.   [LO3, LO4]","answerHtml":"\u003cp>For employees needing full network access, IPsec Remote Access with an appropriate client is a strong match; a full-tunnel TLS VPN agent can also meet that requirement if supported. For contractors needing one web application, choose a clientless TLS portal exposing only that app. Justify scope and client needs: broad authenticated access for employees, narrow browser-based access for contractors.\u003c/p>","refs":[{"sourceId":"src23","from":20,"to":20}]},{"sourceId":"src23","question":"Q12. List the four configuration steps required to build a site-to-site IPsec VPN on a Cisco device, in the correct order, and briefly state what each step actually configures.   [LO1, LO5]","answerHtml":"\u003cul>\u003cli>1. Configure IKEv1 Phase 1 policy and peer authentication/key: negotiation encryption, integrity/hash, PSK/certificate method, DH group and lifetime.\u003c/li>\u003cli>2. Define Phase 2 IPsec transform set: ESP encryption and integrity parameters for real data.\u003c/li>\u003cli>3. Define interesting-traffic ACL: source/destination/protocol selectors for traffic to protect.\u003c/li>\u003cli>4. Build the crypto map tying peer, transform set and ACL together, then apply it to the public egress interface.\u003c/li>\u003c/ul>\u003cp>Both peers need compatible parameters, reciprocal traffic selection and working routing; exact platform commands/algorithm support vary.\u003c/p>","refs":[{"sourceId":"src23","from":22,"to":22}]},{"sourceId":"src23","question":"Q13. Explain what the interesting traffic ACL in an IPsec configuration actually controls, and what happens to legitimate traffic that does not match this ACL.   [LO5]","answerHtml":"\u003cp>The ACL referenced by match address identifies traffic eligible for protection by that IPsec policy, often local subnet to remote subnet. Matching traffic triggers/uses the negotiated tunnel. Legitimate nonmatching traffic is not protected by this selector and follows ordinary routing and other security policy; it is not automatically denied merely for missing a crypto ACL. An interface ACL has different filtering semantics.\u003c/p>","refs":[{"sourceId":"src23","from":23,"to":23}]},{"sourceId":"src23","question":"Q14. Explain what GRE over IPsec actually combines, and why the interesting-traffic ACL for a GRE-over-IPsec configuration matches the GRE traffic itself rather than the traffic riding inside the GRE tunnel.   [LO4, LO5]","answerHtml":"\u003cp>GRE transports flexible inner packets, including multicast/routing traffic in this design; IPsec supplies confidentiality/integrity/authenticated protection for the GRE packet. After GRE encapsulation, IPsec sees protocol 47 packets between the real tunnel endpoint addresses, so its interesting-traffic ACL matches that outer GRE traffic. Matching inner application/subnet traffic at that outer stage would fail to select the intended encapsulated packets.\u003c/p>","refs":[{"sourceId":"src23","from":24,"to":24}]}]},"m13":{"id":"m13","title":"AAA foundations: identity, permissions and audit","sections":[{"title":"Three functions, three questions","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Question and mechanism\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Authentication\u003c/td>\u003ctd>Who are you? Verify claimed identity using evidence.\u003c/td>\u003ctd>Alice proves her administrator identity with password plus security key.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization\u003c/td>\u003ctd>What may you do? Evaluate identity, policy and requested action.\u003c/td>\u003ctd>Alice can inspect interfaces but cannot shut down the core uplink.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Accounting\u003c/td>\u003ctd>What happened? Record attempted and completed activity.\u003c/td>\u003ctd>Record login, allowed show commands and denied shutdown attempts.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>A verified employee can still lack permission for payroll. Keep identity verification and permission decisions distinct. Accounting covers success, denial and failure; a pattern of denied requests can reveal misuse. In ordinary identity-based access, authentication precedes authorization. Some systems also authorize anonymous or guest identities according to explicit policy.\u003c/p>","refs":[{"sourceId":"src26","from":5,"to":6}]},{"title":"AAA as a modular framework","html":"\u003cp>AAA is a framework of independently chosen functions, rather than one fixed protocol or a single yes/no gate. Choose an authentication mechanism, an authorization model and an accounting mechanism. A campus could combine certificate authentication, role-based network permissions and central session/resource logs; device management could combine MFA, per-command authorization and command logs.\u003c/p>\u003cp>The parallel to IPsec is selection by function: IPsec separately selects encryption, integrity, peer authentication and a key-agreement group. Changing one AAA choice need not require replacing the others. RADIUS and TACACS+ carry decisions; DAC, MAC, RBAC and RuBAC describe how decisions are made.\u003c/p>","refs":[{"sourceId":"src26","from":7,"to":7}]},{"title":"Knowledge and possession factors","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Factor\u003c/th>\u003cth>Mechanism, examples and use\u003c/th>\u003cth>Strengths and limits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Something you know\u003c/td>\u003ctd>Check a secret against a stored verifier: password, passphrase, PIN or security answer. Website login, device unlock, initial setup.\u003c/td>\u003ctd>Cheap, familiar, no special hardware; changeable after compromise. Vulnerable to guessing, reuse, phishing, shoulder surfing and keylogging. Security answers are often predictable.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Something you have\u003c/td>\u003ctd>Prove possession: smart card, hardware security key, code token, authenticator app or SMS receiver. Banking, VPN, building access.\u003c/td>\u003ctd>Adds an independent item the attacker must obtain or defeat. Loss, theft, cloning and recovery logistics matter; SMS is vulnerable to SIM swapping.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cstrong>Technical clarification:\u003c/strong> the lecture’s claim that possession factors cannot be phished is too broad. Manually entered OTPs can be relayed by a phishing site. Phishing-resistant cryptographic authenticators bind authentication to the legitimate verifier. \u003ca href=\"https://pages.nist.gov/800-63-4/sp800-63b.html\" target=\"_blank\" rel=\"noopener\">NIST authentication guidance\u003c/a>.\u003c/p>","refs":[{"sourceId":"src26","from":9,"to":10}]},{"title":"Physical versus behavioural biometrics","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Physical\u003c/th>\u003cth>Behavioural\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Measures\u003c/td>\u003ctd>Relatively stable anatomy compared with an enrolled template.\u003c/td>\u003ctd>How an action is performed compared with an observed baseline.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>Fingerprint ridges, face geometry, iris, retina, hand geometry, DNA.\u003c/td>\u003ctd>Typing rhythm/pressure, gait, signature dynamics, speech cadence.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Uses\u003c/td>\u003ctd>Phone unlock, passport e-gates, facilities, forensic identification.\u003c/td>\u003ctd>Continuous workstation authentication and banking fraud detection.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Strength\u003c/td>\u003ctd>High distinctiveness and stability over time.\u003c/td>\u003ctd>Can check continuously without repeated explicit login; patterns are difficult to imitate precisely.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weakness\u003c/td>\u003ctd>Sensors cost money; cuts or eye conditions can interfere; a compromised trait cannot be reissued like a password.\u003c/td>\u003ctd>Stress, fatigue, injury and device changes cause legitimate variation; false acceptance/rejection and baseline drift require management.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Stability helps physical recognition but makes trait compromise persistent. Behavioural variation enables continuous observation of a living session while making accuracy and consistency harder. For a hospital seeking unobtrusive checks throughout a shift, recommend behavioural monitoring alongside a strong initial login, proportionate thresholds and a fallback when confidence drops.\u003c/p>","refs":[{"sourceId":"src26","from":11,"to":12}]},{"title":"Building effective MFA","html":"\u003cp>MFA combines at least two different categories: knowledge, possession and inherence. Password plus authenticator app is knowledge + possession; fingerprint plus PIN is inherence + knowledge; smart card plus biometric is possession + inherence. Password plus PIN repeats knowledge and is not MFA.\u003c/p>\u003cp>Independent factors reduce the chance that one compromised factor causes account takeover. MFA suits banking, corporate VPN, cloud accounts and high-value transactions. Recovery flows must also protect the factors. Usability matters: excessive friction hurts adoption. SMS interception/SIM swapping and repeated unexpected push requests (prompt bombing or fatigue) can defeat particular mechanisms. App-based OTP avoids SMS delivery risks but can still be phished; a hardware security key with an appropriate origin-bound protocol provides stronger phishing resistance.\u003c/p>","refs":[{"sourceId":"src26","from":13,"to":14}]},{"title":"Privilege and command authorization","html":"\u003cp>Cisco IOS privilege levels range from 0 to 15: level 0 has very limited commands, level 1 is basic user EXEC, and level 15 grants full privileged administration. A privilege level provides a broad command tier.\u003c/p>\u003cp>Command authorization evaluates specific requested commands and arguments. A junior technician may be allowed \u003ccode>show interfaces\u003c/code> and denied \u003ccode>configure terminal\u003c/code>. An organisation uses broad levels for usable roles and finer checks to enforce least privilege on sensitive actions. Simply authenticating an administrator is not permission to reconfigure every part of the network.\u003c/p>","refs":[{"sourceId":"src26","from":16,"to":17}]},{"title":"Choose an access control model","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Who decides?\u003c/th>\u003cth>Example\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DAC: Discretionary\u003c/td>\u003ctd>Resource owner grants/revokes permissions.\u003c/td>\u003ctd>Ordinary Windows/Linux file permissions.\u003c/td>\u003ctd>Flexible and locally informed; inconsistent owners make central audit/enforcement difficult.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAC: Mandatory\u003c/td>\u003ctd>Central policy applies labels and clearances; owners cannot override.\u003c/td>\u003ctd>Military classifications; SELinux mandatory policy.\u003c/td>\u003ctd>Consistent, resistant to discretionary weakening; rigid and costly to label/manage. SELinux is broader than a simple clearance hierarchy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RBAC: Role-Based\u003c/td>\u003ctd>Permissions belong to organisational roles; users receive roles.\u003c/td>\u003ctd>HR Manager accesses personnel files; Sales accesses CRM.\u003c/td>\u003ctd>Scales and simplifies joiners/movers/leavers; requires well-designed roles.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RuBAC: Rule-Based\u003c/td>\u003ctd>Evaluate conditions at request time.\u003c/td>\u003ctd>Business hours, source IP/location, device type; ACLs and firewalls.\u003c/td>\u003ctd>Context-aware and adaptable; rule order and maintenance matter.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>For a growing firm struggling with individual permissions, recommend RBAC and manage membership centrally. For classified information, recommend mandatory labels. For owner-controlled sharing, DAC fits. For time/location restrictions, RuBAC fits. Real deployments may combine models: role membership plus a business-hours rule. An ACL and RuBAC both evaluate policy conditions; an ACL’s first-match ordering is one specific implementation.\u003c/p>","refs":[{"sourceId":"src26","from":17,"to":22}]},{"title":"Session, command and resource accounting","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Records\u003c/th>\u003cth>Use\u003c/th>\u003cth>Cannot tell you alone\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Session\u003c/td>\u003ctd>User/device, login/start, logout/stop/timeout, duration.\u003c/td>\u003ctd>Basic audit, capacity planning, abnormal 03:00 login. Cisco \u003ccode>aaa accounting exec\u003c/code>.\u003c/td>\u003ctd>Which commands/actions occurred.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Command\u003c/td>\u003ctd>Each command and ideally arguments, identity, timestamp, device and result.\u003c/td>\u003ctd>Reconstruct configuration changes, compliance, insider investigation and deterrence. TACACS+ command accounting.\u003c/td>\u003ctd>Absolute human identity or unaltered evidence unless credentials and logs are protected.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resource\u003c/td>\u003ctd>Bytes, bandwidth, connection time and consumed services.\u003c/td>\u003ctd>ISP usage billing, VPN monitoring, capacity and exfiltration indicators.\u003c/td>\u003ctd>Whether a large transfer was a backup or theft.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Session accounting is low overhead; command accounting produces more data and requires retention/review. Resource accounting quantifies scale. Combine them: correlate an unusual transfer with session identity, time, device, commands and transfer destinations. Record authorized successes as well as denied attempts.\u003c/p>","refs":[{"sourceId":"src26","from":24,"to":27}]},{"title":"Accounting, accountability and non-repudiation","html":"\u003cp>Non-repudiation is evidence that resists a party’s later denial of an action. Command records connect specific actions to authenticated identities, so they support accountability more strongly than login/logout timestamps. A log that says Alice ran \u003ccode>shutdown\u003c/code> is more useful than one that merely says Alice was logged in.\u003c/p>\u003cp>\u003cstrong>Qualification:\u003c/strong> logging alone does not establish cryptographic non-repudiation. Shared/stolen accounts, weak clocks, an administrator editing logs or incomplete collection undermine attribution. Protect log transport/storage, use unique identities and reliable time, restrict alteration and consider signed audit records. Digital signatures add independently verifiable evidence, with their own key-custody assumptions. These limits connect this lecture to the Week 12 signature material.\u003c/p>","refs":[{"sourceId":"src26","from":25,"to":29}]}],"quiz":[{"question":"A valid employee login is denied access to payroll. Which function makes the denial?","options":["Authentication","Authorization","Accounting","Key agreement"],"answer":1,"explanation":"Identity was already verified; permissions decide payroll access.","refs":[{"sourceId":"src26","from":5,"to":6}]},{"question":"Which combination meets the lecture’s definition of MFA?","options":["Password and PIN","Two security answers","Password and authenticator app","Two different passwords"],"answer":2,"explanation":"Knowledge and possession are different categories.","refs":[{"sourceId":"src26","from":13,"to":13}]},{"question":"Which method best supports unobtrusive continuous workstation verification?","options":["A password every minute","Behavioural biometrics","A one-time fingerprint at login only","A static PIN"],"answer":1,"explanation":"Behavioural signals can be monitored during the session, with varying accuracy.","refs":[{"sourceId":"src26","from":12,"to":12}]},{"question":"Who can override a mandatory access label at personal discretion?","options":["Any file owner","Any authenticated employee","The requester","Ordinary users cannot override central policy"],"answer":3,"explanation":"Mandatory policy is centrally enforced.","refs":[{"sourceId":"src26","from":19,"to":19}]},{"question":"Which model best simplifies permission changes when employees change jobs?","options":["DAC","RBAC","A shared administrator account","No authorization"],"answer":1,"explanation":"Role membership changes replace repeated individual permission edits.","refs":[{"sourceId":"src26","from":20,"to":20}]},{"question":"A policy permits VPN access only during office hours from managed devices. What model is illustrated?","options":["RuBAC","DAC only","No access control","Physical biometrics"],"answer":0,"explanation":"It evaluates contextual conditions at request time.","refs":[{"sourceId":"src26","from":21,"to":21}]},{"question":"A log records login at 09:14 and logout at 09:47. Which accounting is this?","options":["Command","Resource","Session","Signature"],"answer":2,"explanation":"It records the session and duration, not its commands.","refs":[{"sourceId":"src26","from":24,"to":24}]},{"question":"Which evidence best helps reconstruct a malicious CLI configuration change?","options":["A successful login alone","The amount of bandwidth alone","A list of usernames alone","Timestamped command accounting tied to unique identities"],"answer":3,"explanation":"It identifies the actions executed; protect the records for credible attribution.","refs":[{"sourceId":"src26","from":25,"to":28}]},{"question":"Which statement correctly describes physical biometrics?","options":["They can be reissued as easily as a password","They are relatively stable but compromise of the trait is persistent","They never need special sensors","They cannot produce false decisions"],"answer":1,"explanation":"Stable anatomy aids recognition but cannot simply be replaced.","refs":[{"sourceId":"src26","from":11,"to":11}]},{"question":"Why should authorized actions also be accounted for?","options":["Authorization makes logging redundant","Only failures matter","Audits and investigations may need proof of successful actions","Accounting automatically encrypts user data"],"answer":2,"explanation":"Properly permitted actions still need attribution and audit history.","refs":[{"sourceId":"src26","from":28,"to":28}]}],"tutorialAnswers":[{"sourceId":"src27","question":"Q1. Explain why AAA is described as three separate functions rather than one unified security check. Use a specific example to illustrate why authentication alone is not sufficient.   [LO3]","answerHtml":"\u003cp>Authentication verifies a claimed identity, authorization decides permitted actions and accounting records outcomes. A hospital employee may log in successfully yet be denied payroll because their role has no payroll permission. Record the successful login and denied request. Collapsing these checks loses least privilege and an audit trail.\u003c/p>","refs":[{"sourceId":"src27","from":8,"to":8},{"sourceId":"src26","from":5,"to":6}]},{"sourceId":"src27","question":"Q2. Explain what it means to describe AAA as a modular framework, drawing the parallel to IPsec's framework from Week 9.   [LO4]","answerHtml":"\u003cp>AAA lets designers independently select the identity mechanism (for example MFA), permission model (RBAC) and records (central command/session logs). IPsec likewise selects encryption, integrity, authentication and key agreement separately. Neither name denotes one fixed algorithm; assemble choices that satisfy each requirement.\u003c/p>","refs":[{"sourceId":"src27","from":9,"to":9},{"sourceId":"src26","from":7,"to":7}]},{"sourceId":"src27","question":"Q3. Compare something you know and something you have specifically on what happens when each is compromised. Which is easier to recover from, and why?   [LO4]","answerHtml":"\u003cp>A compromised password can normally be reset quickly, without replacing hardware; revoke sessions and change reused passwords too. A lost/stolen possession factor must be revoked and replaced or re-enrolled, which costs time and logistics, while a copied digital factor needs new secrets. Knowledge is usually easier to reissue, but frequent password reuse can widen the damage. Possession alone is not immune to phishing or cloning.\u003c/p>","refs":[{"sourceId":"src27","from":11,"to":11},{"sourceId":"src26","from":9,"to":10}]},{"sourceId":"src27","question":"Q4. Explain the key difference between physical and behavioural biometrics in terms of stability over time, and explain why this difference creates opposite trade-offs for each.   [LO3, LO4]","answerHtml":"\u003cp>Physical biometrics measure relatively stable anatomy: this improves long-term recognition but means a leaked trait cannot be replaced like a secret. Behavioural biometrics measure patterns that naturally change with fatigue, stress, injury and devices: this supports continuous session observation but creates baseline drift and more false acceptance/rejection. Physical sensors can also fail with cuts or eye conditions.\u003c/p>","refs":[{"sourceId":"src27","from":12,"to":12},{"sourceId":"src26","from":11,"to":12}]},{"sourceId":"src27","question":"Q5. A hospital wants continuous confirmation that the person using a workstation throughout a shift is still the same person who originally logged in, without requiring them to repeatedly stop and re-authenticate. Recommend which specific authentication method, a physical biometric, a behavioural biometric, or MFA, best fits this requirement, and justify your answer.   [LO3, LO4]","answerHtml":"\u003cp>Recommend behavioural biometrics, such as typing rhythm or gait where appropriate, for continuous unobtrusive checks throughout the shift. They compare ongoing behaviour with the enrolled baseline and can flag a user change after initial login. A one-off fingerprint or MFA login confirms identity at that moment, not throughout the session. Combine strong initial authentication with proportionate behavioural thresholds and a fallback for legitimate variation.\u003c/p>","refs":[{"sourceId":"src27","from":13,"to":13},{"sourceId":"src26","from":11,"to":13}]},{"sourceId":"src27","question":"Q6. Explain why combining two passwords does not count as multi-factor authentication, and explain what property MFA actually depends on to be effective.   [LO4]","answerHtml":"\u003cp>Both passwords are something you know, so one phisher, keylogger or reuse attack may capture both. MFA depends on independent factor categories, such as knowledge plus possession or inherence. The attacker should need to defeat more than one type of evidence; recovery procedures must preserve that separation.\u003c/p>","refs":[{"sourceId":"src27","from":14,"to":14},{"sourceId":"src26","from":13,"to":14}]},{"sourceId":"src27","question":"Q7. Evaluate the claim that SMS-based one-time codes are just as secure as an authenticator app for multi-factor authentication.   [LO4]","answerHtml":"\u003cp>The claim is too broad. SMS codes are exposed to SIM swapping and telecom interception in addition to phishing; an authenticator app generates the code locally and avoids that delivery channel. Both manually entered OTP types can still be phished in real time, and device compromise/recovery matters. Prefer stronger phishing-resistant mechanisms where required; an app is generally preferable to SMS for the particular delivery risks discussed.\u003c/p>","refs":[{"sourceId":"src27","from":15,"to":15},{"sourceId":"src26","from":10,"to":14}]},{"sourceId":"src27","question":"Q8. Explain the difference between a privilege level and command authorization on a Cisco device. Why does an organisation need both, rather than just one?   [LO3]","answerHtml":"\u003cp>A privilege level assigns a broad Cisco command tier: 0 very limited, 1 user EXEC and 15 full privilege. Command authorization checks specific commands/arguments, allowing a technician to inspect an interface while denying configuration changes. Levels make role assignment manageable; per-command checks enforce precise least privilege and constrain sensitive actions within a session.\u003c/p>","refs":[{"sourceId":"src27","from":17,"to":17},{"sourceId":"src26","from":16,"to":16}]},{"sourceId":"src27","question":"Q9. Compare DAC and MAC specifically on who controls the access decision, and explain why MAC is preferred in military and government systems despite being less flexible.   [LO4]","answerHtml":"\u003cp>DAC lets a resource’s owner grant and revoke permissions. MAC applies central labels/clearances and users cannot override them even for their own files. Military/government systems value consistent, enforceable classification over owner convenience: a careless owner must not release Secret information. The price is rigidity and classification administration.\u003c/p>","refs":[{"sourceId":"src27","from":18,"to":18},{"sourceId":"src26","from":18,"to":19}]},{"sourceId":"src27","question":"Q10. A rapidly growing company currently manages file permissions individually per employee and finds this increasingly hard to keep consistent as staff join, leave, and change departments. Recommend which access control model would best address this specific problem, and justify your recommendation.   [LO3, LO4]","answerHtml":"\u003cp>Recommend RBAC. Define job roles with appropriate permissions, then assign employees to those roles. Joining staff receive a role; a department move changes membership; departure removes membership/access. This reduces inconsistent per-person edits and supports scalable review. Review role definitions and remove obsolete assignments to prevent privilege accumulation.\u003c/p>","refs":[{"sourceId":"src27","from":19,"to":19},{"sourceId":"src26","from":20,"to":20}]},{"sourceId":"src27","question":"Q11. Explain how RuBAC connects conceptually to an ACL from Week 7. What do they have in common in how they make a decision?   [LO4]","answerHtml":"\u003cp>Both evaluate explicit conditions against a request and choose a permit/deny outcome. An ACL checks packet attributes top to bottom; RuBAC may check time, location, device or other context for access generally. ACL first-match ordering illustrates how conditional rule order can affect the result, although not every rule-based system uses that exact algorithm.\u003c/p>","refs":[{"sourceId":"src27","from":20,"to":20},{"sourceId":"src26","from":21,"to":22}]},{"sourceId":"src27","question":"Q12. Explain the difference between session accounting and command accounting, and explain specifically why command accounting, not session accounting, is what actually enables non-repudiation.   [LO3, LO4]","answerHtml":"\u003cp>Session accounting records start/stop and duration, proving only that an account had a session. Command accounting records individual actions and timestamps, enabling attribution of a particular command. This supports evidence against denial much more directly. For high assurance, unique credentials, trusted time and protected or signed logs are required; ordinary editable logs alone do not guarantee cryptographic non-repudiation.\u003c/p>","refs":[{"sourceId":"src27","from":22,"to":22},{"sourceId":"src26","from":24,"to":28}]},{"sourceId":"src27","question":"Q13. A security team is investigating a data breach and needs to determine exactly what an insider did during a suspicious session. Explain which type of accounting would be most useful for this investigation, and explain what a purely session-based log would fail to reveal.   [LO3, LO4]","answerHtml":"\u003cp>Use command accounting to reconstruct the insider’s exact CLI actions, arguments, device and times, then correlate them with the suspicious session. A login/logout log cannot show whether the user inspected status, changed a route or disabled an interface. Protect central log integrity and compare with configuration/file/network records for the full incident picture.\u003c/p>","refs":[{"sourceId":"src27","from":23,"to":23},{"sourceId":"src26","from":24,"to":25}]},{"sourceId":"src27","question":"Q14. Resource accounting shows a single user account transferred an unusually large volume of data overnight. Evaluate why this observation alone cannot confirm malicious activity, and explain what additional accounting information would help clarify what actually happened.   [LO2, LO4]","answerHtml":"\u003cp>Resource accounting is an anomaly indicator: a large transfer could be an approved backup, a software image or theft. Add session identity/start/stop, command/action logs, authorization outcomes, transfer destinations and scheduled-job context. Correlation can show who initiated which action and whether the volume matched legitimate work; volume by itself cannot establish intent.\u003c/p>","refs":[{"sourceId":"src27","from":24,"to":24},{"sourceId":"src26","from":24,"to":27}]}]},"m14":{"id":"m14","title":"AAA deployment, RADIUS, TACACS+ and Cisco configuration","sections":[{"title":"Local versus server-based AAA","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Local\u003c/th>\u003cth>Central/server-based\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Decision location\u003c/td>\u003ctd>Each router/switch keeps a local user database and decides.\u003c/td>\u003ctd>Device submits requests to an AAA server using RADIUS or TACACS+.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consistency\u003c/td>\u003ctd>Update every device; separate users and logs can drift.\u003c/td>\u003ctd>One policy/user database and central audit collection.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scale/cost\u003c/td>\u003ctd>Simple and cheap for two or three devices; poor at scale.\u003c/td>\u003ctd>Server infrastructure and expertise cost more; scales to many devices/access points.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>No external server/network dependency.\u003c/td>\u003ctd>Unreachable server can prevent login unless resilience/fallback exists.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Use\u003c/td>\u003ctd>Small office and controlled emergency fallback.\u003c/td>\u003ctd>Enterprise administration, campus Wi-Fi and VPN admission.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>A central service is also a high-value target: compromise could affect access network-wide. Use redundancy, protected management transport and carefully controlled local emergency accounts. Local fallback preserves administration during an outage but requires its own secure lifecycle and testing.\u003c/p>","refs":[{"sourceId":"src24","from":5,"to":7}]},{"title":"What is protected: management or admission?","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Use case\u003c/th>\u003cth>Protected capability\u003c/th>\u003cth>Natural granularity\u003c/th>\u003cth>Traditional fit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Device administration\u003c/td>\u003ctd>Log in to infrastructure CLI and potentially reconfigure it.\u003c/td>\u003ctd>Commands and arguments, roles/privileges, detailed audit.\u003c/td>\u003ctd>TACACS+\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network access\u003c/td>\u003ctd>Join Wi-Fi, establish a remote-access VPN, or pass wired 802.1X admission.\u003c/td>\u003ctd>Connection/session admission and policy attributes, not router CLI commands.\u003c/td>\u003ctd>RADIUS\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>For 802.1X, the endpoint communicates with an authenticator such as a switch/AP; RADIUS commonly carries the authenticator’s exchange to the authentication server. Being admitted to Wi-Fi does not grant router administration. Select the protocol to fit equipment support and policy requirements.\u003c/p>","refs":[{"sourceId":"src24","from":9,"to":11}]},{"title":"RADIUS: mechanisms, advantages and limitations","html":"\u003cp>RADIUS means Remote Authentication Dial-In User Service. Classic RADIUS uses UDP 1812 for authentication/authorization and 1813 for accounting. Network admission examples include 802.1X Wi-Fi, VPN remote access and historical ISP dial-up/broadband.\u003c/p>\u003cp>An access response can carry both authentication outcome and authorization attributes. Its broad multi-vendor ecosystem and network-access integration suit large campuses. Classic RADIUS protects the User-Password value, while attributes such as User-Name are not thereby confidential. Exact credential protection depends on the authentication method; do not equate RADIUS/EAP universally with sending the original password.\u003c/p>\u003cp>\u003cstrong>Precision:\u003c/strong> UDP itself is unreliable, but RADIUS clients implement retry/failover logic; “no built-in retransmission” in the comparison means no TCP transport guarantee. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc2865.html\" target=\"_blank\" rel=\"noopener\">RFC 2865\u003c/a>. Protect the management path and select supported secure authentication/transport mechanisms; password-field hiding alone does not protect every attribute.\u003c/p>","refs":[{"sourceId":"src24","from":13,"to":14}]},{"title":"TACACS+: mechanisms and precision","html":"\u003cp>TACACS+ means Terminal Access Controller Access-Control System Plus. It uses TCP port 49 and separates authentication, authorization and accounting exchanges. This supports fine command/argument authorization and command accounting for routers, switches and other managed devices. TCP provides ordered reliable transport; server availability and application outcomes still need handling.\u003c/p>\u003cp>\u003cstrong>Course wording versus technical precision:\u003c/strong> the lecture calls it Cisco-proprietary and says the entire packet is encrypted. TACACS+ is publicly documented in informational RFC 8907 and has multiple implementations. Its header remains clear; classic protection obfuscates the body using a shared secret and does not provide modern authenticated encryption or
