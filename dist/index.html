ryptographic authentication is incompatible with diagnostics. ICMP is cheap to generate and processed below applications, so reconnaissance/DoS can target the network stack directly. The deck’s attacks include both ICMP abuse and distinct IP-header/reassembly abuse; not every one depends on a host replying to an Echo Request.\u003c/p>","refs":[{"sourceId":"src07","from":5,"to":7}]},{"title":"ICMP sweep: reconnaissance","html":"\u003cp>A sweep sends Echo Requests across a range of IPs and records responders as likely live hosts. That information guides later service discovery/access attempts; it is usually a preliminary stage rather than the eventual business impact. Lack of a response does not prove the host is absent: filtering, loss or local policy can hide it.\u003c/p>\u003cp>Restrict inbound echo probes from untrusted sources, permit diagnostic sources where needed, rate-limit and alert on a rapid sequential scan pattern. These controls reduce information disclosure and noise but do not hide every other signal of host presence.\u003c/p>","refs":[{"sourceId":"src07","from":9,"to":10}]},{"title":"Ping of Death versus Ping Flood","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Defense\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ping of Death\u003c/td>\u003ctd>Malformed fragments reassemble into a purported IPv4 packet larger than the legal 65,535-byte total length, triggering bugs in old stacks.\u003c/td>\u003ctd>Patch OS/device firmware; validate packet size and fragment structure before delivery.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ping Flood\u003c/td>\u003ctd>Large volumes of otherwise ordinary Echo Requests exhaust link or processing capacity and often provoke replies.\u003c/td>\u003ctd>Suitable ICMP rate limits, anomaly detection/IPS action, and upstream DDoS mitigation when necessary.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The first is a malformed-input vulnerability, often legacy; the second is volume/resource exhaustion and can affect fully patched equipment. Echo processing can be configured/rate-limited; a host is not universally compelled to respond without limit. An IDS normally detects/alerts; an IPS or an integrated enforcement system can block. A local rate limit cannot recover an upstream link already saturated by hostile traffic.\u003c/p>","refs":[{"sourceId":"src07","from":11,"to":14}]},{"title":"Smurf: reflection plus amplification","html":"\u003cp>The attacker sends an ICMP Echo Request to an amplifier network’s directed-broadcast address with the \u003cstrong>victim as forged source\u003c/strong>. If routers forward the directed broadcast and hosts answer, many innocent hosts send Echo Replies to the victim. This combines \u003cstrong>reflection\u003c/strong> (responses go to a spoofed source) with \u003cstrong>amplification\u003c/strong> (one request prompts many replies).\u003c/p>\u003cp>\u003cstrong>Illustrative calculation:\u003c/strong> if one request of 100 bytes causes 80 hosts each to send a 100-byte reply, the victim receives about 8,000 reply bytes, an 80× packet/byte amplification under these simplified equal-size assumptions. Real link overhead, response size and rate controls alter the value.\u003c/p>\u003cp>Disable directed-broadcast forwarding with \u003ccode>no ip directed-broadcast\u003c/code> on appropriate router interfaces. Apply source-validation/BCP 38 ingress/egress filtering to suppress forged-source requests. Rate-limit permitted ICMP as another layer. Modern defaults/hardening make classic Smurf largely historical; the reflection/amplification principle remains relevant.\u003c/p>","refs":[{"sourceId":"src07","from":15,"to":17}]},{"title":"IP spoofing and source validation","html":"\u003cp>An IP sender can put another address in the source field. Routers normally choose forwarding by destination, so a source address alone does not prove identity. Forged sources support naive source-ACL bypass, reflection and difficult attribution. Replies go toward the forged address, so blind source spoofing does not automatically give an attacker a working bidirectional TCP session.\u003c/p>\u003cp>\u003cstrong>Ingress filtering:\u003c/strong> on an external boundary, reject packets claiming internal addresses or other invalid origins. \u003cstrong>Egress filtering:\u003c/strong> permit outbound source addresses only from the organization’s valid assigned ranges. This stops the organization emitting obvious spoofed traffic. It cannot identify every spoof using a plausible address in the permitted range.\u003c/p>\u003cp>\u003cstrong>uRPF\u003c/strong> checks source reachability against routing. Strict mode requires an appropriate reverse route through the receiving interface; legitimate asymmetric paths may fail that test, so choose mode/ACLs to suit the routing design. See \u003ca href=\"https://www.rfc-editor.org/rfc/rfc3704.html\">RFC 3704\u003c/a> for that trade-off. Source validation is valuable but not a replacement for authenticated applications.\u003c/p>","refs":[{"sourceId":"src07","from":19,"to":21}]},{"title":"TTL expiry versus TTL evasion","html":"\u003cp>Each forwarding router decrements IPv4 TTL; expiry causes packet discard and normally an ICMP Time Exceeded response. TTL bounds loops. A \u003cstrong>TTL expiry attack\u003c/strong> deliberately sends many low-TTL packets so a router expends CPU/control-plane effort handling expiry and generating errors. The target is infrastructure availability. Rate-limit ICMP error generation and protect the control plane; do not assume every platform has no default limit.\u003c/p>\u003cp>\u003cstrong>TTL evasion\u003c/strong> aims at a mismatch between the IDS’s reconstructed conversation and what the destination actually receives. A packet may be visible to a sensor but expire before the host; subsequent stream data can then be interpreted differently. Seeing one expired packet is not by itself successful evasion: the attacker needs a reconstruction/desynchronization weakness. This supports a separate intrusion rather than primarily exhausting availability.\u003c/p>\u003cp>Place sensors near protected endpoints where practical, use endpoint-aware stateful inspection and TTL/traffic normalization, and keep inspection engines current. Reducing the hop gap helps but is not a universal guarantee against evasion; heterogeneous host TCP/IP behavior must also be considered.\u003c/p>","refs":[{"sourceId":"src07","from":22,"to":26}]},{"title":"Teardrop and the fragmentation defense family","html":"\u003cp>Teardrop sends malformed fragments with overlapping/contradictory offsets, exploiting reassembly validation bugs in old stacks to crash, hang or corrupt memory. It differs from Ping of Death’s oversized reassembled packet even though both abuse fragment processing. Modern patched systems reject malformed input; unsupported embedded equipment can preserve old risks.\u003c/p>\u003cp>Patch OS and firmware; use firewall reassembly/validation/normalization to reject invalid fragments consistently before internal delivery. A blanket fragment ban may be reasonable only where policy and actual application behavior permit it; legitimate traffic may require fragmentation, and merely blocking fragments indiscriminately can break services. Fragment tricks can also target inconsistent IDS/firewall reassembly, so legacy crash examples teach a continuing inspection principle.\u003c/p>","refs":[{"sourceId":"src07","from":27,"to":28}]},{"title":"A selective layered Layer 3 policy","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Main defense\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ICMP sweep\u003c/td>\u003ctd>Restrict/rate-limit untrusted echo; detect sequential probing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ping of Death\u003c/td>\u003ctd>Patch and validate total length/fragmentation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ping Flood\u003c/td>\u003ctd>Rate limits, enforcement-linked detection, upstream protection.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Smurf\u003c/td>\u003ctd>No directed broadcasts plus anti-spoofing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IP spoofing\u003c/td>\u003ctd>Ingress/egress validation and appropriate uRPF.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TTL expiry\u003c/td>\u003ctd>Rate-limit error generation/protect control plane.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TTL evasion\u003c/td>\u003ctd>Correct sensor placement and TTL/stream-aware normalization.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Teardrop\u003c/td>\u003ctd>Patch and validate/reassemble malformed fragments.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Blocking all inbound ICMP reduces echo-based reconnaissance/flood exposure but can harm troubleshooting and Path MTU Discovery. IPv4 PMTUD can rely on Destination Unreachable “fragmentation needed” messages, as specified by \u003ca href=\"https://www.rfc-editor.org/rfc/rfc1191.html\">RFC 1191\u003c/a>. Prefer a justified type/code/source policy with sensible rates that preserves required error traffic; IPv6 also has essential ICMPv6 functions and must not inherit a careless IPv4 “block all ICMP” rule.\u003c/p>\u003cp>Controls do double duty: patching addresses both legacy crashes; source validation helps spoofing and Smurf. Still, filtering alone does not defeat every volume attack, and rate limiting alone does not correct IDS reconstruction. State remaining risks and verify legitimate diagnostics/connectivity after hardening.\u003c/p>","refs":[{"sourceId":"src07","from":30,"to":33}]}],"quiz":[{"question":"Which attack discovers live hosts rather than directly requiring a crash?","options":["Teardrop","ICMP sweep","Ping of Death","TTL expiry flood"],"answer":1,"explanation":"A sweep is reconnaissance through reachability probes.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"A single forged-source broadcast request triggers replies from 60 hosts. What best describes this?","options":["TCP flow control","ARP cache validation","Reflection and amplification","A DHCP lease renewal"],"answer":2,"explanation":"The victim is the forged reply destination and many responders multiply the traffic.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"Which control directly addresses oversized-fragment crash bugs?","options":["OS/firmware patching and packet/fragment validation","Changing all passwords only","Disabling VTP only","Increasing DNS TTL only"],"answer":0,"explanation":"The vulnerability is unsafe IP reassembly handling.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"What is the primary target of a high-rate low-TTL expiry flood?","options":["An ARP binding database","A certificate chain","A VLAN native tag","Router processing/control-plane capacity"],"answer":3,"explanation":"Forced expiry/error handling consumes network-device resources.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"Why might strict uRPF reject legitimate traffic?","options":["It authenticates the payload too strongly.","Valid traffic may use asymmetric routing.","IPv4 sources are always 128 bits.","It requires all traffic to be broadcast."],"answer":1,"explanation":"The best reverse path need not match the actual incoming path.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"Which response best handles ICMP filtering?","options":["Block every ICMP type in every IP family.","Permit any ICMP at unlimited rate.","Select necessary types/sources and rate limits while preserving required error reporting.","Replace all ICMP with DHCP offers."],"answer":2,"explanation":"Selective policy balances diagnostics/PMTU needs with exposure.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"What makes TTL evasion distinct?","options":["It can create different conversation views at the IDS and endpoint.","It always wins the STP root election.","It assigns malicious DNS by DHCP.","It requires an oversized Echo packet."],"answer":0,"explanation":"The key issue is inspection/reconstruction mismatch.","refs":[{"sourceId":"src07","from":5,"to":32}]},{"question":"Which shared defense family applies to IP spoofing and Smurf?","options":["Sticky ARP only","VLAN 1 assignment","TLS certificate renewal only","Ingress/egress source validation"],"answer":3,"explanation":"Both exploit an unauthenticated forged source address.","refs":[{"sourceId":"src07","from":5,"to":32}]}],"tutorialAnswers":[{"sourceId":"src08","question":"Q1. Explain why ICMP has no authentication, and why that design choice — while necessary for normal network diagnostics like ping and traceroute — creates the vulnerability every attack this week exploits.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Base ICMP provides interoperable diagnostic/error messages without requiring a prior authenticated application relationship. Hosts and routers must report reachability, TTL expiry and delivery errors, but that open design also allows untrusted parties to generate probes/control traffic. Echo replies reveal live hosts and large volumes consume resources. The tutorial wording is broader than the technical dependency: the week also covers IP spoofing and fragment/reassembly bugs, which do not all require trusting an ICMP reply, and authentication is not inherently incompatible with diagnostics. Use selective filtering, validation and rate controls instead of assuming every ICMP message is malicious.\u003c/p>","refs":[{"sourceId":"src08","from":8,"to":8},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q2. Describe how ICMP Sweep works, and explain why it's typically the first step in a larger attack rather than a goal in itself.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> An ICMP sweep sends Echo Requests to addresses across a subnet/range and records replies as likely active hosts. This narrows the attacker’s targets for later port/version discovery and access attempts, rather than by itself stealing records or taking over a host. Restrict public echo exposure where appropriate and alert on sequential probing. An unanswered address may still contain a live but filtered host.\u003c/p>","refs":[{"sourceId":"src08","from":10,"to":10},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q3. Distinguish Ping Flood from the Smurf attack — both are ICMP-based denial-of-service attacks, but what's the key mechanism difference, and why is Smurf considered more dangerous per unit of attacker effort?   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Ping Flood sends a high volume of requests directly at the victim to consume capacity. Smurf forges the victim’s source IP and sends requests to a broadcast amplifier; many hosts then reflect their replies at the victim. Smurf can yield many reply packets per attacker request, increasing impact per unit of initiating traffic when the amplifier is vulnerable. Disable directed broadcasts and source spoofing in addition to rate limits; a direct flood still requires volume controls/upstream protection.\u003c/p>","refs":[{"sourceId":"src08","from":11,"to":11},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q4. A network administrator is deciding whether to block all inbound ICMP at the perimeter entirely, or rate-limit it instead. Evaluate this trade-off, referencing at least two of today's attacks in your answer.   [LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Blocking all inbound ICMP may reduce echo sweeps and some ping-flood traffic but harms useful diagnostics and can disrupt essential errors such as fragmentation-needed messages for PMTU discovery. Rate limiting and a type/code/source policy permit necessary functions while reducing volume and information disclosure. For sweep exposure, restrict echo to approved diagnostic sources; for floods, cap appropriate traffic and consider upstream mitigation if the link is saturated. Neither choice substitutes for patching malformed-reassembly flaws or anti-spoofing/anti-broadcast measures against Smurf.\u003c/p>","refs":[{"sourceId":"src08","from":12,"to":12},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q5. Explain how IP Spoofing works, and why ingress/egress filtering (BCP 38) is effective against it.   [LO1, LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> IP spoofing writes an address other than the actual sender’s into the source field, exploiting the absence of source identity verification in ordinary forwarding. Ingress validation rejects inbound sources impossible for that boundary, such as packets arriving from outside while claiming local internal prefixes. Egress validation permits only authorized local source ranges on outbound traffic, preventing the network from emitting obvious spoofs. BCP 38 source validation reduces reflection and naive source-trust abuse but is not application authentication and cannot identify every spoof within an allowed prefix.\u003c/p>","refs":[{"sourceId":"src08","from":14,"to":14},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q6. Distinguish the TTL Expiry Attack from the TTL-Based Evasion Attack — both abuse the TTL field, but what does each actually try to achieve, and who/what is the real target in each case?   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> TTL expiry flooding sends many low-hop-limit packets so routers must discard them and handle/generate Time Exceeded errors, attacking router CPU/control-plane availability. TTL evasion crafts a stream in which packets observed by a sensor differ from those reaching the real host, exploiting reconstruction inconsistencies to hide a separate malicious payload. The former needs rate/error-generation and control-plane protection; the latter needs endpoint-aware TTL/stream normalization and appropriate sensor placement. One is chiefly a DoS mechanism, the other a detection-bypass mechanism.\u003c/p>","refs":[{"sourceId":"src08","from":15,"to":15},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q7. Describe how the Teardrop attack exploits IP fragmentation, and explain why this is considered a largely legacy attack against modern systems today.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Teardrop sends fragments with overlapping or contradictory offsets so a vulnerable receiver’s reassembly logic mishandles the buffer/layout and may crash or corrupt memory. It is largely legacy because maintained modern stacks validate malformed fragment input rather than following the unsafe behavior. Old or unsupported embedded systems can remain exposed. Patch firmware/OS and validate/reassemble fragments at enforcement points; assess legitimate fragmentation before any blanket ban.\u003c/p>","refs":[{"sourceId":"src08","from":16,"to":16},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q8. IP Spoofing and the Smurf attack share a common root cause. Identify it, and explain why a single mitigation (ingress/egress filtering) is effective against both.   [LO1, LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> The shared root is that a sender can forge the source IP without proof that the address belongs to it. In direct spoofing that can mislead attribution or weak source-based trust; in Smurf it directs amplifier replies to the victim. Source-prefix validation at ingress/egress rejects impossible/unauthorized origins before they reach amplification paths. Also disable directed broadcast forwarding because source validation coverage is never universal.\u003c/p>","refs":[{"sourceId":"src08","from":18,"to":18},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q9. Compare Ping of Death and Teardrop — what do they have in common in terms of the type of vulnerability they exploit and the mitigation strategy that addresses them?   [LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Both exploit deficient IP fragment reassembly/validation in vulnerable stacks and historically cause availability loss. Ping of Death creates a reassembled packet beyond IPv4’s 65,535-byte legal total; Teardrop creates inconsistent overlapping fragment layouts. Patch the OS/firmware and reject illegal sizes/fragment structures through correct reassembly/normalization. Rate limits may reduce load but do not fix the underlying parsing vulnerability.\u003c/p>","refs":[{"sourceId":"src08","from":19,"to":19},{"sourceId":"src07","from":5,"to":33}]},{"sourceId":"src08","question":"Q10. Of all the attacks covered today, choose the one you think would be hardest for a traditional signature-based IDS to detect, and justify your choice.   [LO2, LO3]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> TTL-based evasion is a strong choice because it targets disagreement between the signature IDS’s reconstructed stream and the endpoint’s actual stream. The IDS may match signatures against an apparently benign sequence partly containing packets that expired before arrival, while the host sees different assembled bytes. A traditional signature database alone cannot correct that visibility/model mismatch. Use endpoint-aware state tracking/normalization, suitable placement and current engines. This is a justified selection, not a claim that every modern signature-capable IDS is blind to TTL evasion.\u003c/p>","refs":[{"sourceId":"src08","from":20,"to":20},{"sourceId":"src07","from":5,"to":33}]}]},"m06":{"id":"m06","title":"STP fundamentals, attacks, hardening and complete lab","sections":[{"title":"Why redundant Ethernet needs STP","html":"\u003cp>Redundant switch links support availability after failure, but an active Ethernet loop can circulate broadcasts/unknown frames, duplicate delivery and destabilize MAC learning. Ordinary Ethernet frames do not have an IP-style hop limit. STP preserves physical redundancy while blocking enough ports to create a loop-free logical tree. After failure it can activate a standby path.\u003c/p>\u003cp>Switches exchange Bridge Protocol Data Units (BPDUs) to agree on the tree. Traditional STP does not cryptographically authenticate those messages, so the same mechanism can accept false topology claims from an attached device. Do not confuse receiving BPDUs on a blocked port with forwarding ordinary data: blocked ports still need to hear control information.\u003c/p>","refs":[{"sourceId":"src10","from":5,"to":6}]},{"title":"The three elections and a cost worked example","html":"\u003cp>\u003cstrong>1. Root bridge:\u003c/strong> the lowest Bridge ID wins. The simplified ID comprises priority then MAC address; default configurable priority is 32768 in steps of 4096. Priority is compared before MAC. In Cisco per-VLAN output, the system-ID extension includes the VLAN ID, so VLAN 1 can display 32769 or 4097 for a configured base priority 32768 or 4096.\u003c/p>\u003cp>\u003cstrong>2. Root port:\u003c/strong> each non-root switch selects the port giving lowest total path cost to the root. \u003cstrong>3. Designated port:\u003c/strong> each segment selects the port advertising the best path/root information; other redundant ports block/discard. The lecture emphasizes cost; equal-cost decisions then compare bridge/port identifiers rather than choosing arbitrarily. The root has designated ports and no root port.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Link speed\u003c/th>\u003cth>Short path cost used by the lecture\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>10 Mbps\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100 Mbps\u003c/td>\u003ctd>19\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 Gbps\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cstrong>Lecture example:\u003c/strong> A’s direct 100 Mbps path costs 19; through B it costs 19+4=23, so A selects direct. B’s direct gigabit path costs 4; through A costs 19+19=38, so B also selects direct. On the A–B segment, B advertises root cost 4 and A advertises 19, so B is designated and A’s port on that segment blocks. Root-port selection and designated-port selection answer different questions.\u003c/p>","refs":[{"sourceId":"src10","from":8,"to":11}]},{"title":"Port states and protocol versions","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Classic state\u003c/th>\u003cth>Receives/processes BPDUs\u003c/th>\u003cth>Learns MACs\u003c/th>\u003cth>Forwards user data\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Blocking\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Listening\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Learning\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Forwarding\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Disabled/down is another operational state, although the tutorial asks for these four progressive states. Classic 802.1D uses timers and can take roughly 30–50 seconds to recover in the lab’s failure conditions. RSTP’s discarding state combines non-forwarding behavior; rapid convergence uses defined roles and proposal/agreement on suitable links, not simply a universal removal of all timing checks.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Version\u003c/th>\u003cth>Lecture standard/name\u003c/th>\u003cth>Contribution\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>STP\u003c/td>\u003ctd>IEEE 802.1D\u003c/td>\u003ctd>Original single-tree loop prevention, slow convergence.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RSTP\u003c/td>\u003ctd>IEEE 802.1w\u003c/td>\u003ctd>Rapid transitions, alternate/backup roles and handshake behavior.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PVST+ / Rapid PVST+\u003c/td>\u003ctd>Cisco\u003c/td>\u003ctd>A separate classic/rapid tree per VLAN; can distribute VLAN load across different links.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MSTP\u003c/td>\u003ctd>IEEE 802.1s\u003c/td>\u003ctd>Maps several VLANs to fewer instances for scalability.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>An alternate port is a standby route toward the root via another bridge; a backup port is redundancy for a designated port on the same shared segment. These are not identical. The supplied Packet Tracer lab supports \u003ccode>pvst\u003c/code> and \u003ccode>rapid-pvst\u003c/code>; it explicitly says standalone IEEE RSTP mode/MSTP configuration is unavailable in its environment. Actual command support can depend on the chosen simulator/device version.\u003c/p>","refs":[{"sourceId":"src10","from":12,"to":15}]},{"title":"Three attack mechanisms and their distinct impacts","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Impact\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Root bridge manipulation\u003c/td>\u003ctd>Advertise a superior Bridge ID/low priority through unauthenticated BPDUs; force the network to build around an unauthorized root.\u003c/td>\u003ctd>Path manipulation, instability and potentially interception or DoS.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topology Change flooding/spoofing\u003c/td>\u003ctd>Repeated false topology-change messages or link transitions keep forwarding information aging/flushing excessively.\u003c/td>\u003ctd>Unknown-unicast flooding, degraded performance and possible traffic exposure without becoming root.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>STP DoS\u003c/td>\u003ctd>High BPDU load and/or changing claims consume control-plane work and repeatedly trigger reconvergence.\u003c/td>\u003ctd>Resource exhaustion and network availability loss.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Root election alone does not guarantee every frame flows through the rogue device: actual interception needs an appropriate transit position/links and depends on resulting port roles. The lecture’s “traffic through attacker” is a risk scenario, not a universal consequence of winning with a single edge connection. Classical TC handling commonly shortens MAC aging, while rapid variants handle changes differently; the shared result is frequent relearning/flooding. This resembles CAM flooding’s symptom but uses repeated invalidation rather than filling memory with invented addresses.\u003c/p>","refs":[{"sourceId":"src10","from":17,"to":21}]},{"title":"Six features: match placement and purpose","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>Placement\u003c/th>\u003cth>Trigger/action\u003c/th>\u003cth>Limits\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Root Guard\u003c/td>\u003ctd>Designated ports toward downstream devices that must not become root.\u003c/td>\u003ctd>A superior BPDU puts the port into root-inconsistent non-forwarding condition.\u003c/td>\u003ctd>Blocks superior root claims; does not reject every BPDU/TC message.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BPDU Guard\u003c/td>\u003ctd>End-host access ports, usually with PortFast.\u003c/td>\u003ctd>Any received BPDU causes err-disable.\u003c/td>\u003ctd>Do not apply indiscriminately to legitimate inter-switch links.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BPDU Filter\u003c/td>\u003ctd>Carefully chosen ports excluded from BPDU participation; lab compares one PC-facing port.\u003c/td>\u003ctd>Interface-level form neither sends nor accepts BPDUs and leaves data forwarding up.\u003c/td>\u003ctd>Hides the signal and can permit loops; not equivalent protection to Guard.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loop Guard\u003c/td>\u003ctd>Root/alternate/non-designated ports on suitable inter-switch links.\u003c/td>\u003ctd>Unexpected BPDU loss holds a port loop-inconsistent rather than letting it forward.\u003c/td>\u003ctd>Protects BPDU-loss/unidirectional-failure cases, not general malicious BPDU floods.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BackboneFast\u003c/td>\u003ctd>Switch-wide classic-STP feature; lab configures distribution switches.\u003c/td>\u003ctd>Accelerates recovery from indirect failures instead of waiting the full Max Age delay.\u003c/td>\u003ctd>Convergence optimization; not BPDU authentication.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UplinkFast\u003c/td>\u003ctd>Switch-wide on suitable access switches with redundant uplinks.\u003c/td>\u003ctd>Direct root-uplink failure rapidly promotes an alternate uplink.\u003c/td>\u003ctd>Classic-STP optimization; rapid protocols already incorporate fast recovery.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>PortFast expedites a known edge port’s transition; it is not itself a rogue-switch rejection policy. Root Guard and Loop Guard protect different assumptions and should not be placed on the same port as interchangeable options.\u003c/p>","refs":[{"sourceId":"src10","from":23,"to":30}]},{"title":"BPDU Guard versus Filter: a necessary qualification","html":"\u003cp>The supplied lecture contrasts visible shutdown/err-disable by Guard with silent ignore by Filter. That is a useful observation in its single-rogue-switch lab. However, interface-level \u003ccode>spanning-tree bpdufilter enable\u003c/code> effectively removes STP protection on that interface; it can enable a bridging loop if an extra path appears. Global PortFast-default filtering has different fallback behavior when a BPDU arrives. For ordinary corporate host ports, Guard is generally the stronger choice because unexpected BPDUs trigger containment and investigation. See \u003ca href=\"https://www.cisco.com/c/en/us/td/docs/ios/lanswitch/command/reference/lsw_book/lsw_s2.html\">Cisco’s BPDU Filter command guidance\u003c/a>.\u003c/p>\u003cp>Use the Filter exercise only in the course’s isolated comparison topology and remove the temporary rogue switch when finished. The experiment shows two different BPDU responses; it does not establish that ignoring all BPDUs is universally safe. Loop Guard protects missing expected BPDUs on infrastructure links, so it cannot substitute for edge BPDU Guard against the three fabricated-message attacks.\u003c/p>","refs":[{"sourceId":"src10","from":25,"to":29}]},{"title":"Lab Part 1: topology, port plan and baseline configuration","html":"\u003cp>Build five switches: C1 core; D1/D2 distribution; A1/A2 access; PC1 at A1 and PC2 at A2. C1 links to both distribution switches; D1/D2 link to each other and both access switches. Follow the exact port plan below.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Device\u003c/th>\u003cth>Port\u003c/th>\u003cth>Peer\u003c/th>\u003cth>Mode\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C1\u003c/td>\u003ctd>Gi0/1\u003c/td>\u003ctd>D1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C1\u003c/td>\u003ctd>Gi0/2\u003c/td>\u003ctd>D2\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D1\u003c/td>\u003ctd>Gi0/1\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D1\u003c/td>\u003ctd>Gi0/2\u003c/td>\u003ctd>D2 backbone\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D1\u003c/td>\u003ctd>Fa0/1\u003c/td>\u003ctd>A1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D1\u003c/td>\u003ctd>Fa0/2\u003c/td>\u003ctd>A2\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D2\u003c/td>\u003ctd>Gi0/1\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D2\u003c/td>\u003ctd>Gi0/2\u003c/td>\u003ctd>D1 backbone\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D2\u003c/td>\u003ctd>Fa0/1\u003c/td>\u003ctd>A1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D2\u003c/td>\u003ctd>Fa0/2\u003c/td>\u003ctd>A2\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A1\u003c/td>\u003ctd>Gi0/1\u003c/td>\u003ctd>D1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A1\u003c/td>\u003ctd>Gi0/2\u003c/td>\u003ctd>D2\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A1\u003c/td>\u003ctd>Fa0/1\u003c/td>\u003ctd>PC1\u003c/td>\u003ctd>Access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A2\u003c/td>\u003ctd>Gi0/1\u003c/td>\u003ctd>D1\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A2\u003c/td>\u003ctd>Gi0/2\u003c/td>\u003ctd>D2\u003c/td>\u003ctd>Trunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A2\u003c/td>\u003ctd>Fa0/1\u003c/td>\u003ctd>PC2\u003c/td>\u003ctd>Access\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Use this transcription of the lab’s trunk/access setup, extended explicitly to each device group. Device labels are instructions to the learner, not commands to paste. One VLAN is used, so no inter-VLAN router is required.\u003c/p>\u003cpre>\u003ccode>C1:\nenable\nconfigure terminal\ninterface range gigabitEthernet 0/1 - 2\n switchport mode trunk\nend\n\nD1 and D2 (repeat on each):\nenable\nconfigure terminal\ninterface range gigabitEthernet 0/1 - 2\n switchport mode trunk\nexit\ninterface range fastEthernet 0/1 - 2\n switchport mode trunk\nend\n\nA1 and A2 (repeat on each):\nenable\nconfigure terminal\ninterface range gigabitEthernet 0/1 - 2\n switchport mode trunk\nexit\ninterface fastEthernet 0/1\n switchport mode access\nend\u003c/code>\u003c/pre>\u003cp>PC1: 192.168.1.10 with mask 255.255.255.0. PC2: 192.168.1.20 with the same mask. A gateway is not required for these same-subnet tests. Confirm links stabilize before judging ping results.\u003c/p>","refs":[{"sourceId":"src09","from":9,"to":31}]},{"title":"Lab Part 1: observe root/blocked ports and measure recovery","html":"\u003cp>Run \u003ccode>show spanning-tree vlan 1\u003c/code> on all five switches \u003cstrong>before choosing a root\u003c/strong>. Record the actual Root ID and local Bridge ID. Equal default priorities mean the lowest MAC breaks the initial election tie, so the root cannot be inferred from names such as C1. Record actual root ports, designated ports and blocking/discarding ports. Screenshot at least two outputs showing the root and a blocked port.\u003c/p>\u003cp>On D1/D2’s Gi0/2 backbone, compare their advertised root path cost; lower cost wins designated. If costs tie, compare Bridge IDs. \u003cstrong>Conditional example:\u003c/strong> after C1 is deliberately root and gigabit core links cost 4, both distribution switches advertise cost 4. The lower-ID D1/D2 wins designated on their shared backbone, with the other port alternate/blocking. Access-to-distribution links involving Fa ports negotiate 100 Mbps in the illustrated design: cost 19 plus distribution root cost 4 gives access path cost 23. Verify actual negotiated speeds/costs rather than assuming a port name determines the whole link.\u003c/p>\u003cp>Begin repeated pings PC1 → 192.168.1.20. Disconnect the same chosen A1 uplink, count losses/elapsed time until recovery, reconnect and allow stabilization. Classic PVST+ often loses roughly 30–50 seconds, but \u003cstrong>record your measured value\u003c/strong>. Failed-ping count approximates seconds only if interval/timing is about one second. If \u003ccode>-t\u003c/code> is unavailable in the Packet Tracer PC, repeat pings or use simulation/time observations. Then configure every switch with \u003ccode>spanning-tree mode rapid-pvst\u003c/code>, repeat the identical failure test, and record actual rapid recovery. Do not invent results or screenshots.\u003c/p>","refs":[{"sourceId":"src09","from":32,"to":53}]},{"title":"Lab Part 2: hardening commands and dependencies","html":"\u003cp>Keep Rapid PVST+ enabled. Set C1 base priority to 4096; this selects it over the other default-priority devices, not over every conceivable lower-priority rogue. Root Guard is the layer that rejects superior downstream claims. Configure Root Guard on D1/D2 Fa0/1–2 toward access; Guard plus PortFast on A1’s PC port; Filter plus PortFast on A2’s comparison port; Loop Guard on both access uplinks; UplinkFast on both access switches; BackboneFast on both distribution switches.\u003c/p>\u003cpre>\u003ccode>Every switch:\nconfigure terminal\nspanning-tree mode rapid-pvst\nend\n\nC1:\nconfigure terminal\nspanning-tree vlan 1 priority 4096\nend\n\nD1 and D2 (repeat on each):\nconfigure terminal\ninterface range fastEthernet 0/1 - 2\n spanning-tree guard root\nexit\nspanning-tree backbonefast\nend\n\nA1:\nconfigure terminal\ninterface fastEthernet 0/1\n spanning-tree portfast\n spanning-tree bpduguard enable\nexit\ninterface range gigabitEthernet 0/1 - 2\n spanning-tree guard loop\nexit\nspanning-tree uplinkfast\nend\n\nA2 (comparison feature in this isolated lab):\nconfigure terminal\ninterface fastEthernet 0/1\n spanning-tree portfast\n spanning-tree bpdufilter enable\nexit\ninterface range gigabitEthernet 0/1 - 2\n spanning-tree guard loop\nexit\nspanning-tree uplinkfast\nend\u003c/code>\u003c/pre>\u003cp>The supplied lab includes UplinkFast/BackboneFast for familiarity and status verification. They were designed for classic STP, and Rapid PVST+ already provides rapid recovery. Command acceptance/status varies by simulated device/software; do not claim a measured improvement from those features without evidence. The file provides no MSTP command sequence to execute in this Packet Tracer environment.\u003c/p>","refs":[{"sourceId":"src09","from":54,"to":97}]},{"title":"Lab verification, connectivity and rogue-switch comparison","html":"\u003cp>Use \u003ccode>show spanning-tree summary\u003c/code> plus \u003ccode>show spanning-tree vlan 1\u003c/code> and relevant interface/running configuration to confirm mode, intended C1 root, applied guards and feature status. The summary alone may not display every per-interface guard on every image, so inspect actual port detail as necessary. Screenshot C1, one distribution and one access switch. Repeat the same uplink disconnect/reconnect test after hardening and screenshot recovered pings: security controls must preserve legitimate failover.\u003c/p>\u003cp>\u003cstrong>A1 test:\u003c/strong> temporarily replace PC1’s connection at A1 Fa0/1 with the additional course-lab switch, so the port receives BPDUs. Run \u003ccode>show interfaces status\u003c/code> and \u003ccode>show interfaces fastEthernet 0/1\u003c/code>. Expect err-disabled due to Guard; capture actual output. Remove the switch, reconnect PC1, then reset the interface with \u003ccode>shutdown\u003c/code> followed by \u003ccode>no shutdown\u003c/code> inside interface configuration. Do not re-enable while the triggering device remains attached.\u003c/p>\u003cp>\u003cstrong>A2 comparison:\u003c/strong> attach that same extra switch to A2 Fa0/1. With the explicit interface Filter command, expect the port to remain up while BPDUs are ignored; capture status and remove the extra switch. This demonstrates silent filtering, not proof of safe operation with redundant physical paths. Record observations rather than manufacturing them.\u003c/p>\u003cp>\u003cstrong>Reflection:\u003c/strong> rapid convergence principally improves day-to-day availability after a fault; edge Guard principally contains unauthorized topology participation and reveals a policy violation. Reliability and security overlap in availability but are not identical. Prefer Guard on typical corporate PC ports for visible containment and investigate false positives; keep Filter for carefully justified special cases.\u003c/p>","refs":[{"sourceId":"src09","from":98,"to":123}]}],"quiz":[{"question":"Switch A has root paths costing 19 and 4+19. What is selected?","options":["23, because it has two links","19, the smaller cumulative cost","Both simultaneously as root ports","Neither, because STP ignores cost"],"answer":1,"explanation":"Each non-root switch selects its best root path; 19 \u003c 23.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"Two distribution switches advertise equal root cost on their shared segment. What breaks the next relevant tie?","options":["The number of PCs","The HTTP method","Their bridge identifiers","The newest DHCP lease"],"answer":2,"explanation":"With equal path information, bridge/port IDs break ties rather than device labels.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"Which control should be placed on a PC-facing port that must reject any BPDU?","options":["PortFast plus BPDU Guard","Root Guard alone on the default gateway","BackboneFast on the PC","A larger ARP cache"],"answer":0,"explanation":"PortFast identifies the edge role and Guard err-disables on unexpected BPDUs.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"Which feature primarily protects a blocking/root port when expected BPDUs disappear?","options":["DHCP snooping","UplinkFast only","BPDU Filter","Loop Guard"],"answer":3,"explanation":"Loop Guard prevents unsafe forwarding after BPDU loss.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"Which attack causes excessive relearning without necessarily becoming root?","options":["ICMP Sweep","TC flooding/spoofing","A valid certificate enrollment","Normal same-subnet ARP"],"answer":1,"explanation":"Repeated topology changes invalidate/age MAC information.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"Why should corporate host ports generally prefer Guard over unconditional Filter?","options":["Filter cryptographically authenticates devices.","Guard increases VLAN IDs.","Guard contains and signals unexpected BPDU participation, while Filter can conceal dangerous topology changes.","Guard makes all redundant links forward."],"answer":2,"explanation":"Filter suppresses control traffic and may disable loop protection at that interface.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"What is true of UplinkFast and BackboneFast in the supplied Rapid PVST+ lab?","options":["They are classic-STP convergence features included for familiarity; a dramatic extra speed gain is not expected.","They are encryption algorithms.","They are both mandatory per-port authentication protocols.","They replace Root Guard on all downstream links."],"answer":0,"explanation":"Rapid operation already implements fast-convergence mechanisms.","refs":[{"sourceId":"src10","from":5,"to":31}]},{"question":"How should the completed lab report show convergence times?","options":["Copy 50 seconds for every test.","Use zero for Rapid PVST+ without measurement.","Invent screenshot output matching expected values.","Record measured timing/losses, method and actual outputs for each comparison."],"answer":3,"explanation":"Expected ranges guide interpretation; observations must come from the actual topology.","refs":[{"sourceId":"src10","from":5,"to":31}]}],"tutorialAnswers":[{"sourceId":"src11","question":"Q1. Explain why STP is necessary in a network with redundant switch links, and what would actually happen to that network without it.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Redundant switch links provide backup paths but can form active Layer 2 loops. Ethernet frames lack an IP-style hop limit, so broadcasts and unknown traffic can circulate/replicate, causing storms, duplicate frames and repeated MAC-table moves. STP exchanges BPDUs, elects a root and logically blocks selected redundant ports to preserve one active tree. Physical links remain available for activation after a failure.\u003c/p>","refs":[{"sourceId":"src11","from":8,"to":8},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q2. Describe the three steps of the STP algorithm (root bridge election, root port election, designated port election), and explain what determines the outcome of each step.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> First elect the lowest Bridge ID root: configured priority first, then MAC/system-ID details as relevant. Second, each non-root selects the port with lowest cumulative cost to that root; equal-cost paths are resolved by BPDU bridge/port tie-breakers. Third, each segment selects its designated port using the best advertised root/path information; remaining redundant ports block/discard. A root port is chosen per non-root switch, while a designated port is chosen per segment, so those roles must not be conflated.\u003c/p>","refs":[{"sourceId":"src11","from":10,"to":10},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q3. A switch has two possible paths back to the root bridge: a direct 100 Mbps link (cost 19), and an indirect path through a neighbouring switch that costs 4 to reach the root plus a further 19 to reach this switch. Calculate the Root Path Cost of each option, state which becomes this switch's Root Port, and explain your reasoning.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> The direct 100 Mbps link has cost 19. The indirect option adds the neighbor’s root cost 4 and the link to that neighbor 19, totaling 23. The port on the direct path becomes the root port because 19 is lower than 23. Count all links toward the root once; do not compare only the last link speed or assume the route with a faster single link is always best.\u003c/p>","refs":[{"sourceId":"src11","from":11,"to":11},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q4. Describe the four STP port states in order, and explain why RSTP's new port roles allow it to reach a forwarding state far faster than classic STP.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> The requested classic sequence is Blocking → Listening → Learning → Forwarding. Blocking/listening do not forward user data or learn MACs; learning populates forwarding entries without forwarding user data; forwarding does both. RSTP adds alternate and backup roles and rapid agreement behavior so a valid standby path can take over without waiting all classic timers under suitable conditions. It still preserves loop-safety checks; not every topology/failure is guaranteed instantaneous.\u003c/p>","refs":[{"sourceId":"src11","from":12,"to":12},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q5. Compare STP, RSTP, PVST+/Rapid PVST+, and MSTP. What does each version add over the one before it?   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> STP/802.1D provides the original loop-free single-tree function with slow timer-driven recovery. RSTP/802.1w adds rapid transitions, defined alternate/backup roles and handshake behavior. Cisco PVST+ applies a classic tree per VLAN, and Rapid PVST+ combines per-VLAN trees with rapid behavior, permitting different VLANs to favor different redundant links. MSTP/802.1s groups many VLANs into fewer instances to reduce instance overhead. These are related protocol families, not a perfectly linear ladder in which every version replaces all others. The supplied Packet Tracer lab uses PVST+ and Rapid PVST+; it says MSTP is unavailable there.\u003c/p>","refs":[{"sourceId":"src11","from":14,"to":14},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q6. Describe how the STP root bridge manipulation attack works, and explain why the lack of authentication on BPDUs is what makes it possible.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> The attacker sends BPDUs advertising a superior Bridge ID, typically a lower priority than the intended root. Because ordinary BPDUs do not prove authorization, switches accept the claimed better root and recalculate the tree. Depending on the physical transit position, this can redirect paths for interception or cause instability/DoS. Becoming root alone with one edge connection does not guarantee every data frame crosses the attacker. Guard host ports against BPDUs and reject superior downstream claims with Root Guard.\u003c/p>","refs":[{"sourceId":"src11","from":16,"to":16},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q7. Explain how Topology Change (TC) Flooding/Spoofing degrades network performance. What concept from Week 3 does the resulting symptom resemble, and why?   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> TC flooding sends repeated false topology-change notifications or repeatedly changes port state, causing accelerated aging/invalidation and relearning of MAC entries. Unknown destinations then flood more often, consuming capacity and potentially exposing traffic. This resembles Week 3 CAM flooding in its unknown-unicast symptom, but TC flooding repeatedly invalidates information while CAM flooding consumes the table with invented sources. The attacker need not win root election.\u003c/p>","refs":[{"sourceId":"src11","from":17,"to":17},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q8. Explain how an attacker can cause a network-wide denial of service using STP without ever becoming the root bridge.   [LO1]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> A BPDU flood can consume switch control-plane processing and induce repeated tree calculations through changing root/path claims. Fabricated TCNs also force persistent relearning. Availability can degrade across the switched network even if the current root remains unchanged; exhausting processing or creating instability is a different goal from becoming root. Edge BPDU Guard can contain a source arriving on a forbidden host port, but legitimate infrastructure links still require appropriate monitoring/control-plane protection.\u003c/p>","refs":[{"sourceId":"src11","from":18,"to":18},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q9. For each of Root Guard, BPDU Guard, and Loop Guard, state which of this week's three attacks it would actually prevent, and explain your reasoning for each.   [LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> Root Guard prevents superior downstream root claims on designated ports, directly addressing root manipulation; it does not reject arbitrary TC messages or every flood. BPDU Guard stops all three patterns when their BPDUs enter through a protected end-device port because any BPDU err-disables that port; it cannot be applied indiscriminately to real inter-switch ports. Loop Guard addresses unexpected loss of expected BPDUs and loop risk from failures. It is not a direct defense against any of the three fabricated-message attacks as generally defined, although it is a useful complementary availability safeguard.\u003c/p>","refs":[{"sourceId":"src11","from":20,"to":20},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q10. BPDU Guard and BPDU Filter protect the same PC-facing access ports, but respond to an incoming BPDU completely differently. Describe that difference, and evaluate which one you would recommend for a corporate office's PC ports, justifying your choice.   [LO1, LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> BPDU Guard treats any BPDU as a violation and puts the host port into err-disabled state, giving visible containment requiring investigation/recovery. The lab’s interface-level BPDU Filter silently discards BPDUs and leaves the port forwarding, so the rogue control claim is ignored without a Guard-style shutdown. Recommend Guard for normal corporate PC ports: it enforces the end-host assumption and reveals violation. Unconditional filtering also removes STP protection on that interface and can permit loops if another path is introduced, so its apparent uptime is not equivalent protection. Global default filtering behaves differently from explicit interface filtering.\u003c/p>","refs":[{"sourceId":"src11","from":21,"to":21},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q11. Explain the difference between what BackboneFast and UplinkFast each optimise for, and why a network might reasonably need both rather than just one.   [LO2]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> BackboneFast optimizes classic-STP recovery from indirect failures elsewhere in the backbone, reducing waiting for old root information to expire. UplinkFast optimizes direct failure of an access switch’s current root uplink by bringing a standby uplink into use quickly. A classic hierarchical design can encounter both failure types, so the features address different cases. RSTP/Rapid PVST+ incorporates fast-convergence behavior, so these legacy options should not be described as essential extra acceleration in every rapid network.\u003c/p>","refs":[{"sourceId":"src11","from":22,"to":22},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src11","question":"Q12. A network administrator has configured BPDU Guard on every access port, but has not touched the distribution or core switches at all. Evaluate this configuration: which attacks does it stop, and what STP-related risk remains unaddressed?   [LO2, LO3]","answerHtml":"\u003cp>\u003cstrong>Model revision answer.\u003c/strong> BPDU Guard on all genuine host ports blocks root claims, false TCs and BPDU floods entering through those ports by disabling the source port. That is a strong edge layer, but trusted inter-switch paths can still receive superior claims from a misconfigured/compromised infrastructure switch, and missing BPDUs on redundant links can create unsafe transitions. Set intended root priority, place Root Guard on appropriate downstream designated ports, and use Loop Guard on suitable root/alternate links. Rapid convergence and monitoring improve reliability/visibility but do not authenticate every legitimate infrastructure message.\u003c/p>","refs":[{"sourceId":"src11","from":23,"to":23},{"sourceId":"src10","from":5,"to":31}]},{"sourceId":"src09","question":"Part 1, Step 1.1: build and configure all trunk/access links","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Build C1↔D1/D2, D1↔D2, D1/D2↔A1/A2, PC1↔A1 and PC2↔A2 using the exact port plan in the lab section. C1 Gi0/1–2 are trunks. D1/D2 Gi0/1–2 and Fa0/1–2 are trunks. A1/A2 Gi0/1–2 are trunks and Fa0/1 is access. The full device-group configuration is provided in the lab notes above. Confirm physical links and trunk roles before continuing.\u003c/p>","refs":[{"sourceId":"src09","from":9,"to":29}]},{"sourceId":"src09","question":"Part 1, Step 1.2: address the PCs","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Use PC1 192.168.1.10/24 and PC2 192.168.1.20/24 with mask 255.255.255.0. Both are in 192.168.1.0/24 and VLAN 1, so they can communicate through switching without inter-VLAN routing or a default gateway. Check for duplicate addresses and allow initial STP/ARP convergence before diagnosing a failed first ping.\u003c/p>","refs":[{"sourceId":"src09","from":30,"to":31}]},{"sourceId":"src09","question":"Part 1, Step 2: identify the default root, blocked ports and backbone designated port","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Run show spanning-tree vlan 1 on all five switches. Record the actual Root ID and which local Bridge ID matches it; do not infer a name. If priorities are equal, lowest MAC determines root. List the actual blocking/discarding ports and explain how each closes a redundant loop. On D1/D2 Gi0/2, compare advertised root costs; lower cost wins designated, with Bridge ID breaking an equal-cost tie. The initial answer depends on the observed root and costs, so no single named port/root can be supplied without output. Capture at least two real outputs showing a root and blocked port.\u003c/p>","refs":[{"sourceId":"src09","from":32,"to":39}]},{"sourceId":"src09","question":"Part 1, Step 3: measure baseline PVST+ convergence","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Ping PC2 from PC1 repeatedly, disconnect the selected A1 uplink, and record loss count plus elapsed recovery time; reconnect and stabilize. The guide suggests roughly 30–50 seconds for classic behavior, but that is an expected range, not a result to copy. Report the chosen failed link, ping interval, observed failures and actual elapsed time. A failed standby link may not interrupt the flow, so note the selected port role when interpreting the test.\u003c/p>","refs":[{"sourceId":"src09","from":40,"to":46}]},{"sourceId":"src09","question":"Part 1, Step 4: Rapid PVST+ comparison","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Set spanning-tree mode rapid-pvst on every switch. Repeat the same A1-link failure/reconnection with the same timing method and record actual recovery. Compare the measured rapid result with the measured baseline and explain faster standby transitions/handshake behavior. Keep Rapid PVST+ for Part 2. The lab’s Packet Tracer environment does not provide standalone IEEE RSTP or MSTP configuration modes.\u003c/p>","refs":[{"sourceId":"src09","from":47,"to":55}]},{"sourceId":"src09","question":"Part 2, Step 2.1: choose C1 deterministically","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> On C1 use spanning-tree vlan 1 priority 4096 and verify that its Root ID matches its Bridge ID on VLAN 1. It should defeat the other default base-priority 32768 switches. VLAN-extended output may show 4097 for VLAN 1. A rogue with an even lower ID could still win where unguarded; configured priority is a topology choice, not authentication.\u003c/p>","refs":[{"sourceId":"src09","from":56,"to":60}]},{"sourceId":"src09","question":"Part 2, Step 2.2: deploy Root Guard","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> On both D1 and D2 enter interface range fastEthernet 0/1 - 2 and spanning-tree guard root. These are downstream designated ports toward A1/A2 that should not become root paths. A superior claim from that direction is rejected through root-inconsistent non-forwarding state instead of replacing C1. Do not put this setting on an uplink that legitimately needs to be a root port.\u003c/p>","refs":[{"sourceId":"src09","from":61,"to":66}]},{"sourceId":"src09","question":"Part 2, Steps 2.3–2.4: different edge protections","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> A1 Fa0/1 receives spanning-tree portfast plus spanning-tree bpduguard enable. A2 Fa0/1 receives spanning-tree portfast plus spanning-tree bpdufilter enable for the isolated comparison. Guard responds to any received BPDU with err-disable. The explicit Filter suppresses BPDU participation but leaves data forwarding active, so its absence of shutdown must not be mistaken for equal loop protection. Full commands are in the notes.\u003c/p>","refs":[{"sourceId":"src09","from":67,"to":81}]},{"sourceId":"src09","question":"Part 2, Steps 2.5–2.6: redundant-uplink and backbone settings","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> On A1/A2 Gi0/1–2 apply spanning-tree guard loop, and at switch scope apply spanning-tree uplinkfast. On D1/D2 at switch scope apply spanning-tree backbonefast. Loop Guard prevents unsafe forwarding after expected BPDU loss; UplinkFast covers direct classic root-uplink failure; BackboneFast covers indirect classic failures. The guide explicitly says not to expect dramatic extra convergence improvement under Rapid PVST+; confirm command support/status rather than claiming unmeasured benefits.\u003c/p>","refs":[{"sourceId":"src09","from":82,"to":97}]},{"sourceId":"src09","question":"Part 2, Step 3: verify and screenshot configuration","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Run show spanning-tree summary and show spanning-tree vlan 1. Confirm rapid mode, actual intended C1 root, and feature settings. Inspect port-specific spanning-tree details/running configuration where the simulator summary does not display per-port Root/Loop Guard. Capture actual outputs from C1, one distribution switch and one access switch. Configuration evidence and operational root/role evidence serve different purposes; keep both.\u003c/p>","refs":[{"sourceId":"src09","from":98,"to":101}]},{"sourceId":"src09","question":"Part 2, Step 4: verify legitimate connectivity and failover","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Re-run the same A1-uplink interruption after all hardening. Record that PC1↔PC2 communication recovers, compare recovery with the earlier rapid test, reconnect and stabilize. Screenshot the successful recovered pings. If the test fails, inspect root/port roles, guard-induced states, trunk consistency and addressing; do not mark the task complete from command entry alone.\u003c/p>","refs":[{"sourceId":"src09","from":102,"to":104}]},{"sourceId":"src09","question":"Part 2, Step 5a: demonstrate A1 BPDU Guard and restore service","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> In the isolated topology, temporarily connect the additional lab switch to A1 Fa0/1 in place of PC1. Its BPDUs should trigger Guard, so show interfaces status and show interfaces fastEthernet 0/1 should reveal an err-disabled port. Capture actual evidence. Remove the extra switch, reconnect PC1, then in interface Fa0/1 configuration issue shutdown followed by no shutdown to recover. Confirm PC1 connectivity; resetting while the BPDU source remains attached would retrigger the violation.\u003c/p>","refs":[{"sourceId":"src09","from":105,"to":113}]},{"sourceId":"src09","question":"Part 2, Step 5b and Step 6: demonstrate A2 Filter and compare","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Move the same temporary switch to A2 Fa0/1. With explicit interface BPDU Filter, show interfaces status and the interface detail should show the link up rather than Guard’s err-disabled response while BPDUs are ignored. Capture actual output and remove the temporary switch. Comparison: A1 visibly contained unauthorized BPDU participation; A2 silently retained link availability and provided no equivalent violation response. The test has one temporary connection; a redundant path with unconditional Filter can produce a loop.\u003c/p>","refs":[{"sourceId":"src09","from":114,"to":121}]},{"sourceId":"src09","question":"Final reflection: security posture versus daily reliability","answerHtml":"\u003cp>\u003cstrong>Model lab answer / expected method.\u003c/strong> Model reflection: My actual baseline and Rapid PVST+ measurements show how fast the network restores service after the tested failure; I would insert the measured numbers rather than copy the guide’s range. Rapid convergence mainly improves operational availability, while BPDU Guard’s shutdown demonstrates enforcement of the no-switch-on-PC-port rule. Security and reliability overlap, but fast failover does not authenticate BPDUs and silent uptime does not establish safe topology control. I would choose BPDU Guard for ordinary corporate PC ports because unexpected BPDUs trigger visible containment and investigation. Unconditional BPDU Filter may conceal unauthorized participation and removes loop protection at that interface, so it needs a specific justified use rather than being the default.\u003c/p>","refs":[{"sourceId":"src09","from":122,"to":123}]}]},"m07":{"id":"m07","title":"Routing protocols and routing attacks","sections":[{"title":"How routers learn and compare routes","html":"\u003cp>A router forwards using its routing table. Dynamic routing exchanges reachability information automatically, replacing manual maintenance at scale. Security depends on which neighbours and claims the router accepts. An attractive route changes the next hop; the attacker may then drop, inspect or relay traffic.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Protocol\u003c/th>\u003cth>Type and metric\u003c/th>\u003cth>Transport\u003c/th>\u003cth>Messages and trust\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RIP\u003c/td>\u003ctd>Distance-vector; fewest hops, maximum reachable 15; 16 = unreachable\u003c/td>\u003ctd>UDP 520; RIPv1 broadcast, RIPv2 224.0.0.9\u003c/td>\u003ctd>Request and Response; full updates normally every 30 s. RIPv1 no authentication; RIPv2 optional cleartext/MD5.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OSPF\u003c/td>\u003ctd>Link-state; cost = reference bandwidth/interface bandwidth, summed along path; topology database per area, Area 0 backbone\u003c/td>\u003ctd>IP protocol 89; 224.0.0.5 all OSPF routers; 224.0.0.6 DR/BDR\u003c/td>\u003ctd>Hello, DBD, LSR, LSU, LSAck; MD5 protects neighbour exchanges in lecture/lab.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EIGRP\u003c/td>\u003ctd>Advanced distance-vector, DUAL; bandwidth and delay by default; load/reliability available but normally disabled\u003c/td>\u003ctd>IP protocol 88; 224.0.0.10\u003c/td>\u003ctd>Hello, Update, Query, Reply, Acknowledgment; Query/Reply supports loop-free convergence.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BGP\u003c/td>\u003ctd>Path-vector between Autonomous Systems; ordered attributes such as weight, local preference, AS path and origin\u003c/td>\u003ctd>TCP 179\u003c/td>\u003ctd>OPEN, UPDATE, KEEPALIVE, NOTIFICATION. Session MD5 is carried as a TCP option.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>OSPF example: with reference bandwidth 100 Mb/s, a 10 Mb/s interface has cost 10 and a 100 Mb/s interface cost 1. Actual configured reference bandwidth matters. RIP treats either link as one hop. BGP is policy driven; shorter AS path is only one selection factor, not its sole metric.\u003c/p>","refs":[{"sourceId":"src12","from":5,"to":15}]},{"title":"Five routing attacks: cause, action and consequence","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Vulnerability and technique\u003c/th>\u003cth>Impact\u003c/th>\u003cth>Controls\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Routing table poisoning\u003c/td>\u003ctd>False advertisements with attractive metrics: RIP Response, EIGRP Update, OSPF rogue LSA or BGP UPDATE analogue\u003c/td>\u003ctd>Wrong next hop, interception and/or DoS\u003c/td>\u003ctd>Neighbour authentication, route filtering, passive access interfaces\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unauthorised route injection\u003c/td>\u003ctd>Rogue device becomes a continuing routing participant. OSPF/EIGRP form Hello-based adjacencies; RIP may accept an injected Response without adjacency; BGP normally requires a configured peer/session\u003c/td>\u003ctd>Persistent false routes plus topology visibility\u003c/td>\u003ctd>Authentication, passive-interface, physical port controls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BGP route/prefix hijacking\u003c/td>\u003ctd>Announce an unauthorised IP prefix, often more specific than the real route\u003c/td>\u003ctd>Internet-scale redirection, interception or outage\u003c/td>\u003ctd>Provider prefix filters and RPKI origin validation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blackhole / sinkhole\u003c/td>\u003ctd>Use poisoning/injection/hijacking to redirect to a discard path or an attacker-controlled receiver\u003c/td>\u003ctd>Blackhole = dropped traffic/DoS; sinkhole = collection, possible tampering and optional forwarding\u003c/td>\u003ctd>Prevent route manipulation; monitor path changes, drops and latency\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Routing DoS / instability\u003c/td>\u003ctd>Flood updates or repeatedly announce/withdraw routes; trigger SPF, DUAL or BGP recomputation\u003c/td>\u003ctd>CPU exhaustion, unstable forwarding and loss of availability\u003c/td>\u003ctd>Authentication, control-plane limits, careful route dampening\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>These are not mutually exclusive labels. Poisoning describes how routing information is falsified; blackhole/sinkhole describes what subsequently happens to the traffic. A legitimate but compromised neighbour can conduct either.\u003c/p>","refs":[{"sourceId":"src12","from":17,"to":29}]},{"title":"Case study: YouTube, 24 February 2008","html":"\u003cp>Pakistan Telecom (AS17557) tried to block YouTube domestically by announcing 208.65.153.0/24, a more-specific part of YouTube's 208.65.152.0/22. Its upstream PCCW (AS3491) propagated the announcement globally instead of confining/filtering it. Longest-prefix matching drew traffic towards Pakistan Telecom and produced an outage of roughly two hours. This illustrates how a local configuration decision can become a global incident.\u003c/p>\u003cp>A /22 includes four /24 networks; a destination within 208.65.153.0/24 matches both announcements and follows the /24. Provider filtering should accept only prefixes authorised for that customer. A correct ROA plus configured rejection of Invalid announcements would reject the unauthorised origin.\u003c/p>","refs":[{"sourceId":"src12","from":22,"to":24}]},{"title":"Authentication, passive interfaces and route filters","html":"\u003cp>Shared-key neighbour authentication prevents a device lacking the key from becoming a trusted routing peer or submitting accepted authenticated updates. It does not encrypt the topology, verify the physical existence of a route, or protect against a compromised authorised neighbour. The MD5 examples are the legacy lab mechanism; use modern supported authentication in production.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>OSPF\u003c/th>\u003cth>EIGRP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MD5 configuration\u003c/td>\u003ctd>Enable message-digest authentication per area or interface; set interface message-digest key. The lecture contrasts a simple active-key arrangement with EIGRP key chains.\u003c/td>\u003ctd>Define a named key chain, key ID and secret; apply MD5 mode and the key chain to the interface. Key lifetimes support planned rotation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Passive-interface\u003c/td>\u003ctd>Suppresses Hellos/adjacency on user-facing links while the network can still be advertised through other active interfaces.\u003c/td>\u003ctd>Suppresses Hellos/adjacency on user-facing links; network still advertised through active neighbours.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Distribute-list\u003c/td>\u003ctd>Normally filters routes entering the local routing table; cannot simply stop intra-area LSA propagation because routers need a consistent LSDB. Area-boundary tools are different.\u003c/td>\u003ctd>Can filter routes in Update exchange, affecting route propagation.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Filter even authenticated neighbours: authentication controls \u003cem>who\u003c/em> can speak; filtering controls \u003cem>what\u003c/em> may be learned/advertised. For BGP, apply customer-specific prefix allowlists at provider boundaries. Use passive-interface only where no neighbour is required; RIP receiving behaviour differs from OSPF/EIGRP.\u003c/p>\u003cp>\u003cstrong>OSPF key-rotation qualification:\u003c/strong> the lecture's “one active key/no rotation out of the box” contrast is simplified. Cisco IOS documents multiple MD5 key IDs and rollover that sends authenticated copies during migration. EIGRP key-chain lifetimes are still the lab distinction, but OSPF is not universally incapable of rollover. See \u003ca href=\"https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/iproute_ospf/command/iro-cr-book/ospf-i1.html\">Cisco OSPF message-digest-key command reference\u003c/a>. For passive interfaces, \u003ca href=\"https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/13675-16.html\">Cisco EIGRP passive-interface explanation\u003c/a> confirms that EIGRP suppresses adjacency whereas RIP commonly still receives updates.\u003c/p>","refs":[{"sourceId":"src12","from":31,"to":36}]},{"title":"RPKI and Route Origin Authorisations","html":"\u003cp>A Regional Internet Registry (RIPE NCC, ARIN or APNIC, for example) provides a resource certificate binding address resources to a holder. The holder publishes a signed ROA specifying a prefix, authorised origin AS and maximum permitted prefix length. Validators download and verify the certificate/ROA chain; routers use validated results in policy.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Result\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Policy consequence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Valid\u003c/td>\u003ctd>At least one covering ROA authorises the origin AS and advertised prefix length.\u003c/td>\u003ctd>Normally eligible for ordinary BGP policy; not proof of the entire path.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invalid\u003c/td>\u003ctd>Covering ROA data exists, but no ROA authorises both origin and length.\u003c/td>\u003ctd>Configure rejection; an incorrect legitimate ROA can also produce Invalid.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NotFound\u003c/td>\u003ctd>No covering ROA exists.\u003c/td>\u003ctd>Unvalidated, commonly still eligible; not synonymous with malicious.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Origin validation does not check every AS hop and works only when resources have ROAs and operators use the results. The lecture table's “Invalid → rejected” describes intended filtering policy, not an automatic property of validation. See \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6811.html\">RFC 6811, BGP Prefix Origin Validation\u003c/a>.\u003c/p>","refs":[{"sourceId":"src12","from":37,"to":39}]},{"title":"Layered recommendation and exam reasoning","html":"\u003cp>For an internal routing domain: authenticate router-facing links, make end-user interfaces passive, restrict physical access and filter plausible prefixes. Add control-plane rate limits and monitoring for churn or path changes. For external BGP: filter customer prefixes and apply RPKI validation policy. Dampening can suppress repeatedly flapping routes but needs careful tuning because legitimate instability may also be penalised.\u003c/p>\u003cp>Packet Tracer scope: OSPF and EIGRP MD5 are the two reliable lab targets in these supplied lectures. RIPv2 authentication varies by simulator version and BGP support is limited. This is a tool-support limitation, not evidence that RIP/BGP cannot be authenticated in real networks.\u003c/p>","refs":[{"sourceId":"src12","from":40,"to":44}]}],"quiz":[{"question":"A RIPv2 route is advertised at metric 16. How is it treated?","options":["Preferred to metric 15","Unreachable","A default route","An OSPF external route"],"answer":1,"explanation":"RIP accepts at most 15 reachable hops; 16 denotes unreachable.","refs":[{"sourceId":"src12","from":7,"to":7}]},{"question":"Which routing packet runs directly over IP protocol 89?","options":["BGP OPEN","RIP Response","OSPF Hello","EIGRP Query"],"answer":2,"explanation":"OSPF uses IP protocol 89; EIGRP uses 88, RIP UDP 520 and BGP TCP 179.","refs":[{"sourceId":"src12","from":9,"to":14}]},{"question":"An authenticated neighbour advertises a prohibited prefix. Which control directly restricts the content of that claim?","options":["Route filtering","A longer shared password alone","Disabling monitoring","Increasing link bandwidth"],"answer":0,"explanation":"Authentication proves key possession; filtering limits accepted or advertised prefixes.","refs":[{"sourceId":"src12","from":35,"to":36}]},{"question":"Why did the YouTube /24 divert destinations also covered by its legitimate /22?","options":["UDP prefers short packets","Longest-prefix matching selects the more-specific route","AS17557 had the smallest AS number","MD5 encrypted the /24"],"answer":1,"explanation":"The destination matches both routes; the /24 is more specific.","refs":[{"sourceId":"src12","from":22,"to":24}]},{"question":"What is a plain OSPF distribute-list normally able to change?","options":["The identical LSDB requirement","The local routing-table installation","Every remote LSA simultaneously","The IP protocol number"],"answer":1,"explanation":"Intra-area LSA flooding remains; boundary filtering uses other mechanisms.","refs":[{"sourceId":"src12","from":36,"to":36}]},{"question":"A covering ROA authorises AS100 with maxLength /24. AS100 announces a /25. Result?","options":["Valid","NotFound","Invalid","Always accepted because the AS matches"],"answer":2,"explanation":"Origin and length must both be authorised; /25 exceeds the permitted /24 maximum.","refs":[{"sourceId":"src12","from":38,"to":39}]},{"question":"Which attack primarily keeps the control plane recalculating rather than selecting one malicious next hop?","options":["OS fingerprinting","Routing instability/DoS","WAF evasion","DH key exchange"],"answer":1,"explanation":"Repeated announcements/withdrawals or update floods consume control-plane resources.","refs":[{"sourceId":"src12","from":27,"to":28}]},{"question":"Which statement about lab authentication is best supported?","options":["Packet Tracer supports every BGP feature","OSPF and EIGRP are the reliable supplied lab targets","RIPv1 includes MD5 by default","RPKI is an OSPF key chain"],"answer":1,"explanation":"The lecture explicitly scopes reliable Packet Tracer MD5 practice to OSPF/EIGRP.","refs":[{"sourceId":"src12","from":31,"to":33}]}],"tutorialAnswers":[{"sourceId":"src13","question":"Q1. Compare RIP, OSPF, EIGRP, and BGP by type (distance-vector, link-state, advanced distance-vector, or path-vector) and by the metric each one uses to select a best path.   [LO1]","answerHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Protocol\u003c/th>\u003cth>Type\u003c/th>\u003cth>Best-path metric\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RIP\u003c/td>\u003ctd>Distance-vector\u003c/td>\u003ctd>Hop count; maximum 15\u003c/td>\u003c/tr>\u003ctr>\u00
